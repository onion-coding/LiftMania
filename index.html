<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12102B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LiftMania">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LiftMania</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap');

/* ══════════════════ DESIGN TOKENS ══════════════════
   Every theme defines the same set, so nothing in the app ever needs a raw
   hex. Accent colours come in three roles and they are NOT interchangeable:

     --x     text/icon of that colour sitting on a page surface  (>=4.5:1)
     --xF    a filled block of that colour
     --onX   the text colour that sits on top of --xF

   In the dark theme fills are bright and their ink is near-black; in the
   light themes fills are deep and their ink is white. Using --x as a
   background (or --xF as text) is what makes a theme unreadable. */
:root{
  color-scheme:dark;
  --night:#12102B; --panel:#1C1841; --panel2:#2A2364; --line:#3B3484; --deep:#0B0920;
  --cream:#F5F2FF; --dim:#B3A9DC;
  --row:rgba(255,255,255,.05);
  --gold:#FFC93F;    --goldF:#FFC93F;    --onGold:#241B00;
  --green:#3DEFA7;   --greenF:#00E88C;   --onGreen:#002B1B;
  --cobalt:#8FACFF;  --cobaltF:#3B65F0;  --onCobalt:#FFFFFF;
  --magenta:#FF7ABA; --magentaF:#FF3D9A; --onMagenta:#2E0619;
  --red:#FF9086;     --redF:#FF6B5E;     --onRed:#2E0805;
  --onGroup:#12102B; --focus:#FFC93F; --mdim:1.6;
  --ease:cubic-bezier(.2,.8,.2,1); --easeout:cubic-bezier(.16,1,.3,1);
  --holdBg:#4A2E6E; --holdFg:#EFDCFF;
  --kgBg:#1E3E7C;   --kgFg:#D2E1FF;
  --bwBg:#1C4A37;   --bwFg:#C6F5DF;
  --d:'Bungee',Impact,'Haettenschweiler','Arial Narrow Bold',sans-serif;
  --b:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --m:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
body[data-theme="foresty"]{
  color-scheme:light;
  --night:#F1EEE3; --panel:#FCFAF5; --panel2:#E7E0CF; --line:#D5CAB2; --deep:#EFEADD;
  --cream:#1D2925; --dim:#5A6961;
  --row:rgba(60,45,15,.045);
  --gold:#7A570B;    --goldF:#E2A63C;    --onGold:#241900;
  --green:#1D6B45;   --greenF:#257A4C;   --onGreen:#FFFFFF;
  --cobalt:#1A5D73;  --cobaltF:#1F718A;  --onCobalt:#FFFFFF;
  --magenta:#993858; --magentaF:#AF446B; --onMagenta:#FFFFFF;
  --red:#A33528;     --redF:#BE4436;     --onRed:#FFFFFF;
  --onGroup:#FFFFFF; --focus:#1A5D73; --mdim:.82;
  --holdBg:#EADFF2; --holdFg:#4B2A6B;
  --kgBg:#DBE5F3;   --kgFg:#1D4C74;
  --bwBg:#DAECDF;   --bwFg:#1C5A38;
}
body[data-theme="bright"]{
  color-scheme:light;
  --night:#F4F6F9; --panel:#FFFFFF; --panel2:#EDF1F6; --line:#D8DFE8; --deep:#F1F4F8;
  --cream:#141821; --dim:#586474;
  --row:rgba(15,23,42,.035);
  --gold:#7F5400;    --goldF:#F0B429;    --onGold:#241900;
  --green:#0E7A45;   --greenF:#12864C;   --onGreen:#FFFFFF;
  --cobalt:#1D4ED8;  --cobaltF:#2456D6;  --onCobalt:#FFFFFF;
  --magenta:#AC1D5A; --magentaF:#C22B6C; --onMagenta:#FFFFFF;
  --red:#AF2A20;     --redF:#C4342A;     --onRed:#FFFFFF;
  --onGroup:#FFFFFF; --focus:#1D4ED8; --mdim:.82;
  --holdBg:#ECE3FA; --holdFg:#4A2A85;
  --kgBg:#DDE8FB;   --kgFg:#17458F;
  --bwBg:#DBEFE3;   --bwFg:#0F6438;
}

/* ══════════════════ BASE ══════════════════ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--night);color:var(--cream);font-family:var(--b);
  font-size:15px;line-height:1.5;transition:background-color .35s ease,color .35s ease;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);position:relative}
#app{width:min(100vw - 20px, 470px);margin:14px auto 30px;padding-bottom:24px;
  display:flex;flex-direction:column;gap:12px}
button{cursor:pointer;font-family:inherit;border:none;color:inherit;font-size:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h2{margin:0}
.ic{width:20px;height:20px;flex:none;display:block}
.disp{font-family:var(--d);line-height:1.1}
.mono{font-family:var(--m)}
.mini{font-family:var(--m);font-size:11.5px;color:var(--dim);line-height:1.45}
.mini b{color:var(--cream);font-weight:500}
.empty{font-size:13.5px;color:var(--dim);line-height:1.5;padding:2px 0}

/* two columns once there is room for them */
.cols{display:flex;flex-direction:column;gap:12px}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (min-width:900px){
  #app{width:min(100vw - 40px, 1100px);gap:16px}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
}

/* ══════════════════ HEADER ══════════════════ */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brandline{min-width:0}
.brand{font-family:var(--d);font-size:22px;line-height:1;letter-spacing:.01em}
.themebox{display:flex;align-items:center;gap:3px;padding:3px;flex:none;
  border:1px solid var(--line);border-radius:11px;background:var(--panel)}
.theme-pill{display:inline-flex;align-items:center;justify-content:center;width:29px;height:27px;
  border-radius:8px;border:none;background:transparent;color:var(--cream);font-size:13px;line-height:1;padding:0}
.theme-pill.active{background:var(--goldF);color:var(--onGold)}

.statstrip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:2px}
@media (min-width:900px){ .statstrip{grid-template-columns:repeat(3,200px)} }
.stat{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:13px;
  background:var(--panel);border:1px solid var(--line);min-width:0}
.stat .ic{width:18px;height:18px;color:var(--accent,var(--dim))}
.stat .sv{min-width:0}
.stat b{display:block;font-family:var(--m);font-size:15px;font-weight:500;line-height:1.15;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat b i{font-style:normal;font-size:11px;color:var(--dim);margin-left:3px}
.stat .k{display:block;font-family:var(--m);font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--dim);margin-top:2px}

/* ══════════════════ TABS ══════════════════ */
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:5px;
  background:var(--panel);border:1px solid var(--line);border-radius:15px}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;border-radius:11px;
  padding:9px 1px 8px;background:transparent;color:var(--dim);
  font-family:var(--m);font-size:9px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.tab .ic{width:21px;height:21px}
.tab.on{background:var(--goldF);color:var(--onGold)}
@media (min-width:900px){
  .tabs{max-width:680px}
  .tab{flex-direction:row;gap:8px;font-size:11px;padding:10px 4px}
}

/* ══════════════════ CARDS ══════════════════
   One header line: an icon in the section's colour, a title, optional meta,
   and the ? that holds every word of explanation. */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px 16px}
.chead{display:flex;align-items:center;gap:11px}
.cicon{width:32px;height:32px;border-radius:10px;flex:none;display:flex;align-items:center;
  justify-content:center;background:var(--row);color:var(--accent,var(--cream))}
@supports (background:color-mix(in srgb,red 10%,white)){
  .cicon{background:color-mix(in srgb,var(--accent,var(--dim)) 15%,transparent)}
}
.ctitle{flex:1;min-width:0;font-size:15px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
.ctitle.big{font-family:var(--d);font-size:19px;font-weight:400;letter-spacing:.01em;line-height:1.15}
.cmeta{font-family:var(--m);font-size:11.5px;color:var(--dim);white-space:nowrap;flex:none}
.hbtn{width:24px;height:24px;flex:none;border-radius:50%;background:var(--row);
  color:var(--dim);font-family:var(--m);font-size:12px;line-height:1;padding:0}
.hbtn.on{background:var(--goldF);color:var(--onGold)}
.csub{font-family:var(--m);font-size:11.5px;color:var(--dim);margin-top:7px;line-height:1.45}
.help{margin-top:12px;padding:12px 13px;border-radius:12px;background:var(--deep);
  color:var(--dim);font-size:13px;line-height:1.6}
.help b{color:var(--cream);font-weight:500}
.body{margin-top:13px}

/* ══════════════════ ROWS ══════════════════ */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:11px;padding:11px 0;width:100%;text-align:left;
  background:none;border:none;border-bottom:1px solid var(--line);min-width:0;color:inherit}
.li:first-child{padding-top:0}
.li:last-child{padding-bottom:0;border-bottom:none}
.ldot{width:9px;height:9px;border-radius:50%;flex:none}
.lmain{flex:1;min-width:0}
.lname{font-size:14px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lsub{display:block;font-family:var(--m);font-size:11px;color:var(--dim);margin-top:3px;line-height:1.35}
.lval{flex:none;text-align:right;font-family:var(--m);font-size:13.5px;line-height:1.2;white-space:nowrap}
.lval .u{font-size:10px;color:var(--dim);margin-left:3px}

.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv.two{grid-template-columns:repeat(2,1fr)}
.kvi{padding:10px 11px;border-radius:12px;background:var(--row);border:none;min-width:0;text-align:left}
.kvi .k{display:block;font-family:var(--m);font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--dim)}
.kvi b{display:block;font-family:var(--m);font-size:16px;font-weight:500;margin-top:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kvi .k2{display:block;font-family:var(--m);font-size:10px;color:var(--dim);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.track{position:relative;background:var(--deep);border-radius:99px;overflow:hidden;width:100%}
.fill{position:absolute;inset:0 auto 0 0;border-radius:99px;transform-origin:left center}

/* ══════════════════ MISSIONS ══════════════════ */
.objrow{display:flex;align-items:flex-start;gap:12px;padding:12px 0;width:100%;text-align:left;
  background:none;border:none;border-bottom:1px solid var(--line);color:inherit}
.objrow:first-child{padding-top:0}
.objrow:last-child{padding-bottom:0;border-bottom:none}
.objbox{width:22px;height:22px;flex:none;border-radius:7px;background:var(--row);
  display:flex;align-items:center;justify-content:center;font-family:var(--m);font-size:11px;
  color:var(--dim);margin-top:1px}
.objrow.done .objbox{background:var(--greenF);color:var(--onGreen)}
.objtxt{flex:1;min-width:0}
.objlab{display:block;font-size:14px;line-height:1.3}
.objrow.done .objlab{color:var(--dim)}
.objbar{display:block;margin:8px 0 6px}

/* ══════════════════ FEED ══════════════════ */
.fr{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.fr:first-child{padding-top:0}
.fr:last-child{padding-bottom:0;border-bottom:none}
.av{width:56px;height:56px;flex:none;border-radius:16px;background:var(--row);
  display:flex;align-items:center;justify-content:center;font-family:var(--d);font-size:20px;
  overflow:hidden}
.av img,.bigav img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.bigav{width:168px;height:168px;flex:none;border-radius:36px;background:var(--row);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-family:var(--d);font-size:62px;color:var(--dim)}
.bigav.set{box-shadow:inset 0 0 0 2px var(--line)}
@media (max-width:420px){ .bigav{width:132px;height:132px;border-radius:30px;font-size:50px} }
.av.me{background:var(--goldF);color:var(--onGold)}
.ftxt{flex:1;min-width:0;font-size:13.5px;line-height:1.3}
.ftxt b{font-weight:700}
.ftime{flex:none;font-family:var(--m);font-size:10.5px;color:var(--dim);white-space:nowrap;padding-top:3px}
.prbadge{display:inline-block;font-family:var(--m);font-size:9.5px;letter-spacing:.07em;padding:2px 5px;
  border-radius:5px;background:var(--goldF);color:var(--onGold);margin-left:6px}

/* ══════════════════ BOARD ══════════════════ */
.lrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.lrow:first-child{padding-top:0}
.lrow:last-child{padding-bottom:0;border-bottom:none}
.lrow.me .pname{color:var(--gold)}
.rk{width:26px;height:26px;border-radius:9px;flex:none;display:flex;align-items:center;
  justify-content:center;font-family:var(--d);font-size:11px;background:var(--row);color:var(--dim)}
.rk.g1{background:var(--goldF);color:var(--onGold)}
.rk.g2{background:#B9BECF;color:#1A1D26}
.rk.g3{background:#9A5B22;color:#FFFFFF}
.pname{font-weight:700;font-size:14.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.youtag{font-family:var(--m);font-size:9.5px;letter-spacing:.1em;color:var(--onGold);
  background:var(--goldF);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.pbig{font-family:var(--m);font-size:16px;color:var(--gold);margin-left:auto;flex:none;
  text-align:right;line-height:1.15}
.pbig span{display:block;font-size:9px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.rolebadge{font-family:var(--m);font-size:9px;letter-spacing:.1em;padding:2px 6px;border-radius:5px;
  background:var(--row);color:var(--dim);margin-left:6px;vertical-align:2px;text-transform:uppercase}
.rolebadge.own{background:var(--goldF);color:var(--onGold)}
.xbtn{width:27px;height:27px;border-radius:8px;background:var(--row);color:var(--dim);font-size:14px;
  display:flex;align-items:center;justify-content:center;flex:none;line-height:1}
.xbtn:hover{background:var(--redF);color:var(--onRed)}
.code{font-family:var(--m);font-size:14px;letter-spacing:.12em;background:var(--deep);border-radius:11px;
  padding:12px;color:var(--cream);flex:1;min-width:0;text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cta.soon{background:var(--row);color:var(--dim);cursor:default;position:relative}
.cta.soon:active{transform:none}
.cta.soon span{display:block;font-family:var(--m);font-size:10px;letter-spacing:.14em;
  margin-top:5px;opacity:.8}

/* ══════════════════ SIGN IN ══════════════════ */
.login{min-height:72vh;display:flex;flex-direction:column;justify-content:center;gap:14px;
  width:min(100%,420px);margin:0 auto}
.lin{width:100%;height:50px;text-align:center;font-size:18px;letter-spacing:.08em;
  font-family:var(--m);background:var(--deep);color:var(--cream);border:1px solid var(--line);
  border-radius:12px;padding:0 10px;transition:border-color .25s var(--ease)}
.lin:focus{outline:none;border-color:var(--focus)}
.lreveal{max-height:0;opacity:0;overflow:hidden;pointer-events:none;transform:translateY(10px);
  transition:max-height .5s var(--ease),opacity .55s var(--ease),transform .55s var(--ease)}
#lhint{display:flex;align-items:center;gap:9px;min-height:19px}
.spin{width:15px;height:15px;flex:none;border-radius:50%;border:2px solid var(--line);
  border-top-color:var(--gold);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lreveal.on{max-height:340px;opacity:1;transform:none;pointer-events:auto}
.lstate{display:flex;align-items:flex-start;gap:11px;margin-top:12px;padding:12px 13px;
  border-radius:12px;background:var(--row);font-size:13px;line-height:1.4;color:var(--dim);
  box-shadow:inset 3px 0 0 var(--accent,var(--line))}
.lstate b{display:block;color:var(--cream);font-weight:700;font-size:14px}
.lstate em{display:block;margin-top:4px;font-style:normal;font-family:var(--m);font-size:11.5px}
.lstate .ic{width:19px;height:19px;margin-top:1px;color:var(--accent,var(--dim))}
.lstate.swap{animation:lstatein .3s var(--easeout) both}
@keyframes lstatein{from{opacity:0;transform:translateY(-6px)}}
.cta.swap{animation:ctaswap .34s var(--easeout) both}
@keyframes ctaswap{from{opacity:0;transform:translateY(9px) scale(.97)}}
.dots{display:inline-block;width:14px;text-align:left}
.dots:after{content:"";animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* ══════════════════ PICKER ══════════════════ */
.gchips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gchip{border-radius:10px;padding:9px 4px;font-size:12.5px;font-weight:700;background:var(--row);
  color:var(--cream);border:1px solid transparent;line-height:1.1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gchip .cnt{font-family:var(--m);font-size:9px;color:var(--gold);vertical-align:2px;margin-left:4px}
.exwrap{display:flex;flex-wrap:wrap;gap:6px}
.exchip{border-radius:10px;padding:9px 11px;font-size:13.5px;background:var(--row);color:var(--cream);
  border:1px solid transparent;display:inline-flex;align-items:center;gap:7px;line-height:1.15}
.exchip.on{background:var(--cream);color:var(--night);font-weight:700}
.exchip.hit{border-color:var(--gold)}
.exchip.on.hit{box-shadow:0 0 0 2px var(--goldF)}
.tag{font-family:var(--m);font-size:10px;font-weight:500;letter-spacing:.07em;padding:3px 5px;
  border-radius:5px;background:var(--panel2);color:var(--dim);flex:none;line-height:1.1}
.tag.hold{background:var(--holdBg);color:var(--holdFg)}
.tag.kg{background:var(--kgBg);color:var(--kgFg)}
.tag.bw{background:var(--bwBg);color:var(--bwFg)}
.exchip.on .tag{background:var(--night);color:var(--cream)}
.exchip .side{font-family:var(--m);font-size:10px;color:var(--magenta);flex:none}
.exchip.on .side{color:var(--night);opacity:.7}
.expand{margin-top:10px;padding:12px;border-radius:12px;background:var(--deep)}
.qchip{border-radius:9px;padding:7px 9px;font-size:12.5px;background:var(--row);color:var(--cream);
  border:none;margin:0 5px 5px 0;display:inline-flex;align-items:center;gap:6px}
.filt{border-radius:9px;padding:7px 11px;font-size:12px;font-family:var(--m);background:var(--row);
  color:var(--cream);border:none;line-height:1.35;white-space:nowrap}
.filt.on{background:var(--goldF);color:var(--onGold)}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg{display:inline-flex;border-radius:9px;overflow:hidden;background:var(--row);flex:none}
.seg button{padding:7px 12px;font-family:var(--m);font-size:12px;color:var(--dim);
  background:transparent;line-height:1.3}
.seg button.on{background:var(--goldF);color:var(--onGold)}
.legend{display:flex;flex-direction:column;gap:9px;font-family:var(--m);font-size:11.5px;
  color:var(--dim);line-height:1.35}
.legend>span{display:flex;align-items:center;gap:9px}
.legend .swatch{width:20px;height:14px;border-radius:4px;flex:none;border:1px solid var(--gold)}

/* ══════════════════ LOGGER ══════════════════ */
.steppers{display:flex;gap:10px}
.stepper{flex:1;min-width:0}
.slabel{display:block;font-family:var(--m);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--dim);margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbtn{width:38px;height:48px;border-radius:11px;background:var(--row);color:var(--cream);
  font-size:21px;line-height:1}
.sbtn:active{background:var(--goldF);color:var(--onGold)}
input.sval{flex:1;height:48px;border-radius:11px;background:var(--deep);color:var(--cream);
  font-family:var(--m);font-size:18px;text-align:center;border:1px solid transparent;
  min-width:0;width:100%;padding:0;-webkit-appearance:none}
input.sval:focus{border-color:var(--focus);outline:none;background:var(--panel2)}
.srow{display:flex;align-items:center;gap:6px}
.mathrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-family:var(--m);font-size:12px;color:var(--dim);padding:11px 13px;border-radius:12px;
  background:var(--row)}
.mathrow b{color:var(--cream);font-weight:500;font-size:15px}
.prline{padding:10px 12px;border-radius:12px;font-size:12.5px;line-height:1.45;background:var(--deep);
  border-left:3px solid var(--line)}
.cta{width:100%;border-radius:14px;padding:17px 0;background:var(--greenF);color:var(--onGreen);
  font-family:var(--d);font-size:16px}
.cta.alt{background:var(--cobaltF);color:var(--onCobalt)}
.ghost{border-radius:10px;padding:10px 13px;background:var(--row);color:var(--cream);
  border:none;font-family:var(--m);font-size:12px}
.ghost.wide{width:100%}
.gatechip{display:block;width:100%;border-radius:12px;padding:11px 13px;background:var(--row);
  border:none;color:var(--cream);font-family:var(--m);font-size:12px;text-align:left;line-height:1.5}

/* ══════════════════ TODAY & ROTATION ══════════════════ */
.card.today{padding-bottom:18px}
.tday{display:flex;align-items:flex-start;gap:14px}
.tdow{font-family:var(--m);font-size:10.5px;letter-spacing:.16em;color:var(--dim)}
.tname{font-family:var(--d);font-size:26px;line-height:1.1;margin-top:5px}
@media (max-width:420px){ .tname{font-size:21px} }
.tfocus{font-size:13.5px;color:var(--dim);margin-top:6px}
.tday .ghost{margin-left:auto;flex:none}
.rotstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:15px}
.rotpip{position:relative;text-align:center;border-radius:10px;padding:8px 0 14px;background:var(--row);
  font-family:var(--m);font-size:10.5px;color:var(--dim);text-transform:uppercase}
.rotpip.on{color:var(--cream);outline:2px solid var(--accent);outline-offset:1px}
.rotpip em{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);width:16px;height:4px;
  border-radius:99px;border:1px dashed}
.rotrow{padding:12px 0;border-bottom:1px solid var(--line)}
.rotrow:first-child{padding-top:0}
.rotrow:last-child{border-bottom:none}
.rotrow.rest{opacity:.62}
.rothead{display:flex;align-items:center;gap:11px}
.rotday{font-family:var(--m);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);width:82px;flex:none}
.rotname{flex:1;min-width:0;padding:8px 10px!important;font-size:13px!important}
.rotgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;margin-left:93px}
@media (max-width:520px){ .rotgs{margin-left:0} .rotday{width:64px} }
.gtog{border-radius:9px;padding:6px 10px;font-size:12px;background:var(--row);color:var(--dim);
  border:1px solid var(--line);transition:background-color .18s var(--ease),color .18s var(--ease)}
.gtog.on{font-weight:700}

/* ══════════════════ CHALLENGES ══════════════════ */
.roster{display:grid;grid-template-columns:1fr}
.crow{border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:none}
.crow.open{background:var(--row);border-radius:14px;padding:4px 12px;border-bottom:none;margin:4px -12px}
.chit{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:13px 0;
  background:none;border:none;color:inherit}
.cnum{font-family:var(--m);font-size:11px;color:var(--dim);flex:none;width:22px;padding-top:2px}
.cname{display:block;font-family:var(--d);font-size:13px;line-height:1.25}
.crow.med .cname{color:var(--gold)}
.cbar{display:block;margin:8px 0 6px}
.cmed{flex:none;width:44px;text-align:center}
.crm{width:34px;height:34px;display:block;margin:0 auto}
.nomed{display:block;width:34px;height:34px;margin:0 auto;border-radius:50%;
  border:1px dashed var(--line);color:var(--dim);font-size:12px;line-height:32px}
.cpts{display:block;font-family:var(--m);font-size:9.5px;color:var(--dim);margin-top:4px}
.chalbox{margin-top:16px;border-radius:14px;background:var(--row);padding:13px}
.attbox{margin-top:14px;border-radius:14px;background:var(--deep);padding:13px;
  box-shadow:inset 0 0 0 1px var(--line)}
.attbox .steppers{margin:0}
.attbox .cta{margin-top:12px}
.crule{font-size:13px;line-height:1.5;color:var(--cream)}
.restbox{margin-top:13px}
.restrow{display:flex;align-items:baseline;gap:10px}
.restclock{font-family:var(--m);font-size:30px;line-height:1;color:var(--cream);
  background:none;border:none;padding:0;letter-spacing:.01em}
.restlab{font-family:var(--m);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.restplus{margin-left:auto;flex:none;font-family:var(--m);font-size:11px;letter-spacing:.04em;
  color:var(--dim);background:var(--row);border:1px solid var(--line);border-radius:8px;padding:5px 9px}
.restplus:hover{color:var(--cream);border-color:var(--dim)}
.resttrack{height:4px;border-radius:99px;background:var(--row);overflow:hidden;margin-top:8px}
.restfill{height:100%;border-radius:99px;background:var(--greenF);transition:width 1s linear}
.restbox.done .restclock{color:var(--green)}
.restbox.done .restfill{transition:none}
.verdict{margin-top:11px;font-size:13px;line-height:1.4;color:var(--dim);text-align:center}
.attbadge{display:inline-block;font-family:var(--m);font-size:9.5px;letter-spacing:.07em;padding:2px 5px;
  border-radius:5px;background:var(--cobaltF);color:var(--onCobalt);margin-left:6px}
.chalhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chalname{font-family:var(--d);font-size:12px;color:var(--gold);letter-spacing:.03em}
.fxmedal{width:96px;height:96px;display:block;margin:0 auto}

/* ══════════════════ WEEK ══════════════════ */
/* medal metals are literal, so they are the same in every theme */
.profrow{display:flex;align-items:center;gap:20px}
@media (max-width:420px){ .profrow{flex-direction:column;align-items:flex-start;gap:14px} }
.medalrow{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.medal.now{box-shadow:inset 0 0 0 2px var(--mc)}
.medal{text-align:center;padding:8px 2px;border-radius:12px;background:transparent;
  font-family:var(--m);font-size:10px;color:var(--dim);line-height:1.1;
  transition:background-color .3s var(--ease)}
.medal.on{background:var(--row)}
.mimg{display:block;margin:0 auto;width:34px;height:34px;
  transition:filter .35s var(--ease),opacity .35s var(--ease)}
/* a tier you have not taken is the same disc, drained of its metal */
.medal:not(.on) .mimg{filter:grayscale(1) brightness(var(--mdim,.82));opacity:.5}
.medal b{display:block;font-size:11.5px;color:var(--cream);margin-top:4px;font-weight:500;
  font-family:var(--m);letter-spacing:-.01em}
.mbimg{width:18px;height:18px;display:inline-block;vertical-align:-3px;margin-left:6px}
.fimg{width:19px;height:19px;display:inline-block;vertical-align:-4px;margin:0 1px}
.fbig{width:40px;height:40px;display:block;flex:none}
.medal.bronze{--mc:#A9722F;--mi:#FFFFFF}
.medal.silver{--mc:#AEB6C6;--mi:#1A1D26}
.medal.gold{--mc:#E8B33C;--mi:#241900}
.medal.author{--mc:#12A176;--mi:#FFFFFF}
.medal.champion{--mc:#7C4DE0;--mi:#FFFFFF}



.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wday{position:relative;overflow:hidden;text-align:center;border-radius:11px;padding:11px 1px;
  background:var(--row);font-family:var(--m);font-size:10.5px;color:var(--dim);line-height:1.7}
.wday.r{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.wday.p{background:var(--panel2);color:var(--cream)}
.wday.f{background:var(--greenF);color:var(--onGreen)}
.wday.today{outline:2px solid var(--gold);outline-offset:1px;color:var(--cream)}
.daysep{display:flex;align-items:center;gap:10px;margin:16px 0 9px;font-family:var(--m);
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.daysep:first-child{margin-top:0}
.daysep .ln{flex:1;height:1px;background:var(--line)}

/* ══════════════════ FORMS & BANNERS ══════════════════ */
input[type=text],input[type=number]{background:var(--deep);color:var(--cream);
  border:1px solid var(--line);border-radius:11px;padding:11px;font-family:var(--m);font-size:14px}
input::placeholder{color:var(--dim);opacity:1}
.banner{display:flex;align-items:flex-start;gap:11px;border-radius:13px;padding:13px 14px;
  background:var(--goldF);color:var(--onGold);font-size:13px;line-height:1.5}
.banner .ic{margin-top:1px}
.banner.warn{background:var(--redF);color:var(--onRed)}
.banner.info{background:var(--panel2);color:var(--cream)}
.banner .ghost{display:inline-block;margin-top:9px;background:rgba(0,0,0,.14);color:inherit}

/* ══════════════════ MOTION ══════════════════
   Entrance motion only runs under #app.enter, which render() sets when the
   view actually changed. Everything else here is press/hover feedback or a
   one-shot flagged through U.fx. */
@keyframes cardin{from{opacity:0;transform:translateY(12px)}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes tabin{from{transform:scale(.9);opacity:.5}}
#app.enter .card,#app.enter .statstrip{animation:cardin .36s var(--easeout) both}
#app.enter .col>.card:nth-child(2){animation-delay:.06s}
#app.enter .col>.card:nth-child(3){animation-delay:.12s}
#app.enter .col>.card:nth-child(4){animation-delay:.18s}
#app.enter .col>.card:nth-child(5){animation-delay:.24s}
#app.enter .fill{animation:growx .75s .1s var(--easeout) both}
#app.enter .tab.on{animation:tabin .3s var(--easeout) both}
#app.enter .prbadge{animation:badgein .35s var(--easeout) both}
@keyframes badgein{from{transform:scale(.4);opacity:0}}

/* a bar that knows where it came from animates the gap it just closed */
@keyframes widthto{from{width:var(--from)}}
.fill.animw{animation:widthto .9s var(--easeout) both}

@keyframes bump{40%{transform:scale(1.09)}}
input.sval.bump{animation:bump .28s var(--ease)}

@keyframes popbox{0%{transform:scale(.4);opacity:.3}55%{transform:scale(1.22)}100%{transform:scale(1)}}
.objbox.justdone{animation:popbox .5s cubic-bezier(.2,1.5,.4,1) both}

@keyframes reveal{from{opacity:0;transform:translateY(-7px)}}
.help.reveal,.expand.reveal{animation:reveal .24s var(--easeout) both}

/* press + hover feedback survives re-renders because it is pure CSS state */
.tab,.filt,.gchip,.exchip,.qchip,.ghost,.cta,.sbtn,.theme-pill,.hbtn,.seg button,
.gatechip,.kvi,button.li,.objrow{
  transition:background-color .18s var(--ease),color .18s var(--ease),
             border-color .18s var(--ease),box-shadow .18s var(--ease),
             filter .18s var(--ease),transform .1s var(--ease)}
.cta:active{transform:scale(.985)}
.sbtn:active{transform:scale(.9)}
.tab:active,.filt:active,.gchip:active,.exchip:active,.ghost:active,.qchip:active,
.hbtn:active,.theme-pill:active,.gatechip:active,.kvi:active{transform:scale(.96)}
button.li:active,.objrow:active{transform:scale(.995)}
@media (hover:hover){
  button.li:hover,.objrow:hover,.gatechip:hover{background:var(--row)}
  .filt:not(.on):hover,.qchip:hover,.ghost:hover,.exchip:not(.on):hover,
  .hbtn:not(.on):hover,.seg button:not(.on):hover{background:var(--panel2)}
  .tab:not(.on):hover{color:var(--cream);background:var(--row)}
  .gchip:hover,.cta:hover,.filt.on:hover,.tab.on:hover{filter:brightness(1.07)}
  .theme-pill:not(.active):hover{background:var(--row)}
}

/* ══════════════════ DEFEAT SEQUENCE ══════════════════
   The overlay always draws on a dark scrim, so it pins its own dark token
   set - otherwise the light themes would paint dark ink onto it. */
#fx{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 45%,rgba(0,232,140,.20),rgba(10,8,26,0) 62%),#0A0818;
  padding:24px;text-align:center;overflow:hidden;color:var(--cream);
  --cream:#F5F2FF; --dim:#C6BEE8; --night:#12102B;
  --gold:#FFC93F; --goldF:#FFC93F; --onGold:#241B00;
  --green:#3DEFA7; --greenF:#00E88C; --magenta:#FF7ABA;
  --line:rgba(255,255,255,.24); --row:rgba(255,255,255,.07)}
#fx.on{display:flex}
.shake{animation:shake .65s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.slam{animation:slam .6s cubic-bezier(.2,1.5,.3,1) both}
@keyframes slam{0%{transform:scale(2.7);opacity:0;letter-spacing:.45em;filter:blur(7px)}
  55%{opacity:1}100%{transform:scale(1);opacity:1;letter-spacing:.01em;filter:blur(0)}}
.ring{position:absolute;border-radius:50%;border:2px solid var(--greenF);animation:ring 1.2s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes ring{from{width:0;height:0;opacity:.95}to{width:150vmax;height:150vmax;opacity:0}}
.spark{position:absolute;width:7px;height:7px;border-radius:2px;animation:spark 1.2s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes spark{from{transform:translate(0,0) scale(1.2) rotate(0);opacity:1}
  to{transform:translate(var(--dx),var(--dy)) scale(.15) rotate(220deg);opacity:0}}
.fxcard{position:relative;z-index:2;max-width:340px}
.rise{animation:rise .55s .3s both}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.fxpill{display:inline-block;border-radius:999px;padding:5px 12px;background:var(--row);
  font-family:var(--m);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.actban{display:inline-block;border-radius:12px;padding:11px 18px;background:var(--goldF);color:var(--onGold);
  font-family:var(--d);font-size:13px;transform-origin:center;animation:sweepin .75s .4s both}
@keyframes sweepin{from{transform:scaleX(.04) skewX(-18deg);opacity:0}}
.crack{height:14px;margin:14px 0;border-radius:99px;background:linear-gradient(90deg,var(--greenF),var(--goldF),var(--magentaF));
  animation:crack .7s cubic-bezier(.6,0,.9,.2) forwards}
@keyframes crack{0%{transform:scaleX(1);opacity:1}70%{transform:scaleX(1.05);opacity:1}
  100%{transform:scaleX(0);opacity:0}}
.tapdis{animation:fadein 1s 1.3s both}
@keyframes fadein{from{opacity:0}}
.pop{animation:pop .4s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.86);opacity:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="fx"></div>
<a id="dl" style="display:none"></a>
<input id="fileIn" type="file" accept=".json,application/json" style="display:none">
<input id="picIn" type="file" accept="image/*" style="display:none">

<script>
"use strict";

/* ══════════════════ MUSCLE GROUPS ══════════════════
   c = the colour on a dark background, l = the same hue deep enough to read
   on a light one. gcol() picks; never use .c directly. */
const GROUPS = {
  chest:{name:"Chest",c:"#FF8478",l:"#B23A2C"}, back:{name:"Back",c:"#7C9CFF",l:"#1D4ED8"},
  shoulders:{name:"Shoulders",c:"#FFC53D",l:"#8A5D00"}, biceps:{name:"Biceps",c:"#2FE39C",l:"#12784A"},
  triceps:{name:"Triceps",c:"#3FCFEE",l:"#0B6980"}, legs:{name:"Legs",c:"#FF6FB2",l:"#B01B5E"},
  core:{name:"Core",c:"#BB9BFF",l:"#6234B8"}
};
const GK = Object.keys(GROUPS);
const gcol = g => U.theme==="night" ? GROUPS[g].c : GROUPS[g].l;

/* mode: bw = bodyweight × leverage · load = external kg · bwload = bodyweight + added · time = seconds */
const EX = [
  {id:"pushup",n:"Push-up",g:"chest",mode:"bw",f:.64,s:"both"},
  {id:"incpush",n:"Incline push-up",g:"chest",mode:"bw",f:.50,s:"both"},
  {id:"decpush",n:"Decline push-up",g:"chest",mode:"bw",f:.75,s:"both"},
  {id:"defpush",n:"Deficit push-up",g:"chest",mode:"bw",f:.70,s:"both"},
  {id:"archer",n:"Archer push-up",g:"chest",mode:"bw",f:.85,s:"each"},
  {id:"cpress",n:"Cable chest press",g:"chest",mode:"load",s:"opt",sd:"both"},
  {id:"cfly",n:"Cable fly",g:"chest",mode:"load",s:"opt",sd:"both"},

  {id:"crow",n:"Cable row",g:"back",mode:"load",s:"opt",sd:"both"},
  {id:"clat",n:"Cable lat pulldown",g:"back",mode:"load",s:"opt",sd:"both"},
  {id:"csap",n:"Straight-arm pulldown",g:"back",mode:"load",s:"opt",sd:"both"},
  {id:"cpullover",n:"Cable pullover",g:"back",mode:"load",s:"both"},
  {id:"trow",n:"Inverted row (table)",g:"back",mode:"bw",f:.60,s:"both"},
  {id:"sman",n:"Superman hold",g:"back",mode:"time",f:.20,s:"both"},

  {id:"pike",n:"Pike push-up",g:"shoulders",mode:"bw",f:.60,s:"both"},
  {id:"cohp",n:"Cable shoulder press",g:"shoulders",mode:"load",s:"opt",sd:"both"},
  {id:"lat",n:"Lateral raise",g:"shoulders",mode:"load",s:"opt",sd:"each"},
  {id:"front",n:"Front raise",g:"shoulders",mode:"load",s:"opt",sd:"each"},
  {id:"face",n:"Face pull",g:"shoulders",mode:"load",s:"both"},
  {id:"upright",n:"Upright row",g:"shoulders",mode:"load",s:"both"},

  {id:"curl",n:"Bicep curl",g:"biceps",mode:"load",s:"opt",sd:"each"},
  {id:"hammer",n:"Hammer curl",g:"biceps",mode:"load",s:"opt",sd:"each"},
  {id:"ccurl",n:"Cable curl",g:"biceps",mode:"load",s:"opt",sd:"each"},
  {id:"conc",n:"Concentration curl",g:"biceps",mode:"load",s:"each"},
  {id:"rcurl",n:"Reverse curl",g:"biceps",mode:"load",s:"opt",sd:"each"},
  {id:"21s",n:"Twenty-ones",g:"biceps",mode:"load",s:"opt",sd:"each"},

  {id:"diamond",n:"Diamond push-up",g:"triceps",mode:"bw",f:.70,s:"both"},
  {id:"dip",n:"Chair dip",g:"triceps",mode:"bw",f:.70,s:"both"},
  {id:"pdown",n:"Cable pushdown",g:"triceps",mode:"load",s:"opt",sd:"both"},
  {id:"ohext",n:"Overhead extension",g:"triceps",mode:"load",s:"opt",sd:"both"},
  {id:"kickback",n:"Cable kickback",g:"triceps",mode:"load",s:"each"},

  {id:"squat",n:"Bodyweight squat",g:"legs",mode:"bw",f:.50,s:"both"},
  {id:"goblet",n:"Goblet squat",g:"legs",mode:"bwload",f:.50,s:"both"},
  {id:"split",n:"Split squat",g:"legs",mode:"bw",f:.85,s:"each"},
  {id:"bulg",n:"Bulgarian split squat",g:"legs",mode:"bw",f:.95,s:"each"},
  {id:"lunge",n:"Reverse lunge",g:"legs",mode:"bw",f:.60,s:"opt",sd:"each"},
  {id:"rdl",n:"Romanian deadlift",g:"legs",mode:"load",s:"opt",sd:"both"},
  {id:"pthru",n:"Cable pull-through",g:"legs",mode:"load",s:"both"},
  {id:"nordic",n:"Hamstring slider curl",g:"legs",mode:"bw",f:.70,s:"opt",sd:"both"},
  {id:"calf",n:"Calf raise",g:"legs",mode:"bw",f:.90,s:"opt",sd:"both"},
  {id:"bridge",n:"Glute bridge",g:"legs",mode:"bw",f:.40,s:"opt",sd:"both"},
  {id:"wallsit",n:"Wall sit",g:"legs",mode:"time",f:.50,s:"both"},
  {id:"burpee",n:"Burpee",g:"legs",mode:"bw",f:.70,s:"both"},
  {id:"jsquat",n:"Jump squat",g:"legs",mode:"bw",f:.70,s:"both"},
  {id:"stepup",n:"Step-up",g:"legs",mode:"bwload",f:.65,s:"each"},

  {id:"plank",n:"Plank",g:"core",mode:"time",f:.30,s:"both"},
  {id:"splank",n:"Side plank",g:"core",mode:"time",f:.42,s:"each"},
  {id:"hollow",n:"Hollow hold",g:"core",mode:"time",f:.35,s:"both"},
  {id:"lsit",n:"L-sit / tuck hold",g:"core",mode:"time",f:.60,s:"both"},
  {id:"lraise",n:"Leg raise",g:"core",mode:"bw",f:.30,s:"both"},
  {id:"ccrunch",n:"Cable crunch",g:"core",mode:"load",s:"both"},
  {id:"chop",n:"Cable woodchop",g:"core",mode:"load",s:"each"},
  {id:"pallof",n:"Pallof press",g:"core",mode:"load",s:"each"},
  {id:"twist",n:"Russian twist",g:"core",mode:"load",s:"opt",sd:"both"},
  {id:"mclimb",n:"Mountain climbers",g:"core",mode:"bw",f:.25,s:"opt",sd:"both"},
  {id:"deadbug",n:"Dead bug",g:"core",mode:"bw",f:.20,s:"opt",sd:"both"}
];
const byId = id => EX.find(e=>e.id===id) || EX[0];

const stdScale=()=>(S&&S.stdScale)||1;

/* ══════════════════ THE TEN CHALLENGES ══════════════════
   Ten fixed tests, the same ten for everybody, and every one of them is
   uncapped: no time limit, no ceiling, just a number that goes up. That is
   what makes them raceable — your 38 push-ups and a friend's 41 are the same
   test run twice, so the board under a challenge is a real ranking instead of
   a difficulty setting.

   Medal cuts are absolute and hand-set. They never scale with your bodyweight
   and never move with your history, so a Gold means the same thing on every
   phone. Champion is meant to be out of reach for nearly everyone.
   S.stdScale (YOU › calibrated for) shifts all five cuts together for a
   lifter the standards were not written around. */
const CH_KIND={
  reps:{verb:"most reps in one set", unit:"reps",     short:""},
  side:{verb:"most reps per side",   unit:"reps",     short:"/side"},
  hold:{verb:"longest hold",         unit:"seconds",  short:"s"},
  load:{verb:"heaviest set of 8+",   unit:"kg",       short:"kg"}
};
const CHALLENGES=[
  {id:"c_push",  ex:"pushup", kind:"reps", name:"The Floor",
   rule:"Chest to the ground, arms locked at the top, one continuous set. Resting in the plank is allowed; putting a knee down is not.",
   cuts:[10,20,35,50,75]},
  {id:"c_row",   ex:"trow",   kind:"reps", name:"Under The Table",
   rule:"Body in one line, chest to the edge every rep. Heels stay planted where they started.",
   cuts:[8,15,25,35,50]},
  {id:"c_pike",  ex:"pike",   kind:"reps", name:"The Pike",
   rule:"Hips high, crown of the head to the floor. The closest thing to an overhead press you own.",
   cuts:[5,10,18,28,40]},
  {id:"c_dip",   ex:"dip",    kind:"reps", name:"The Edge",
   rule:"Off a chair or a step, elbows to ninety degrees behind you. Feet stay put.",
   cuts:[8,15,25,40,60]},
  {id:"c_curl",  ex:"curl",   kind:"load", name:"Dead Weight",
   rule:"Eight clean reps or more with no swing and no leaning back. The record is the weight on each rep, not the total.",
   cuts:[8,12,18,24,32]},
  {id:"c_squat", ex:"squat",  kind:"reps", name:"Below Parallel",
   rule:"Hip crease under the knee on every rep. Nobody has ever counted the half ones.",
   cuts:[20,40,65,100,150]},
  {id:"c_bulg",  ex:"bulg",   kind:"side", name:"One Leg",
   rule:"Rear foot elevated, front knee tracking over the foot. Log your weaker side — that is the one that counts.",
   cuts:[8,15,25,35,50]},
  {id:"c_burp",  ex:"burpee", kind:"reps", name:"The Furnace",
   rule:"Chest to the floor at the bottom, feet leaving the ground at the top. One set, the clock is irrelevant.",
   cuts:[10,20,30,45,65]},
  {id:"c_plank", ex:"plank",  kind:"hold", name:"The Long Minute",
   rule:"Forearms down, hips level with the shoulders. It ends the moment the hips drop, not the moment it hurts.",
   cuts:[45,90,150,240,360]},
  {id:"c_hollow",ex:"hollow", kind:"hold", name:"The Hollow",
   rule:"Lower back pinned flat to the floor, shoulders and heels lifted. Any gap under the spine and the clock stops.",
   cuts:[20,40,70,110,160]}
];
const CH_BY_EX={}; CHALLENGES.forEach(c=>{ CH_BY_EX[c.ex]=c; });
const chalOf=id=>CHALLENGES.find(c=>c.id===id)||CHALLENGES[0];
const chalEx=c=>byId(c.ex);

/* the cut this player has to clear, after their calibration */
const chalCut=(c,t)=>{ const raw=c.cuts[t]*stdScale();
  return c.kind==="load" ? Math.round(raw*2)/2 : Math.max(1,Math.round(raw)); };
/* the medal a value is worth on a challenge, -1 for none */
function chalMedal(c,v){
  if(!(v>0)) return -1;
  let t=-1; for(let i=0;i<5;i++) if(v>=chalCut(c,i)) t=i;
  return t;
}
/* Each medal is earned once and kept: taking Silver does not take Bronze away
   from you, so the number you hold on a challenge is the running total of every
   cut you have passed on it. Nineteen is the most one challenge can pay. */
const MED_PTS=[1,2,3,5,8];
const CUM_PTS=[1,3,6,11,19];
const chalPts=t=>(t>=0&&t<5)?CUM_PTS[t]:0;
/* Champion is a ceiling on the medals, so above it the only thing left to win
   is position: every challenge pays again for where you stand on its board.
   Deliberately smaller than a medal — first place on one challenge is worth
   less than a Gold on it, and nothing at all until somebody else turns up to
   be beaten, because standing alone on a board you are the only entrant on is
   not an achievement. */
const RANK_PTS=[5,3,2];
const rankPts=(n,field)=>(!n||(field||0)<2)?0:(RANK_PTS[n-1]||1);

const chalRec=id=>(S&&S.chal&&S.chal[id])||null;
const chalVal=id=>{ const r=chalRec(id); return r?r.v:0; };
const chalTier=id=>chalMedal(chalOf(id),chalVal(id));
/* the one number the board ranks on — works on a foreign board card too */
function medalPoints(ch){
  const rec=ch||(S&&S.chal)||{}; let p=0;
  CHALLENGES.forEach(c=>{ const r=rec[c.id]; if(r&&r.v>0) p+=chalPts(chalMedal(c,r.v)); });
  return p;
}
/* a Champion holds all five, the way a champion medal implies the ones under it */
function medalTally(ch){
  const rec=ch||(S&&S.chal)||{}, out=[0,0,0,0,0];
  CHALLENGES.forEach(c=>{ const r=rec[c.id]; if(!r||!(r.v>0)) return;
    const t=chalMedal(c,r.v); for(let k=0;k<=t;k++) out[k]++; });
  return out;
}
/* What a declared attempt is worth — 0 when it is not a legal one, because a
   set of six curls cannot claim a set-of-eight record. Only an attempt made
   from the challenge screen is ever measured: a normal training set, however
   good, is training, and the ten are tests you choose to sit. */
function chalRunValue(c,reps,prk,sd){
  if(!c) return 0;
  if(c.kind==="load") return reps>=8 ? prk : 0;
  if(c.kind==="side") return sd==="each" ? reps : Math.floor(reps/2);
  return reps;
}
const chalFmt=(c,v)=>!v?"—"
  : c.kind==="load" ? v+"kg"
  : c.kind==="hold" ? v+"s"
  : c.kind==="side" ? v+"/side"
  : v+" reps";
/* what one more notch costs, in the unit you actually control */
function chalGap(c,v,t){
  if(t>=4) return null;
  const d=Math.round((chalCut(c,t+1)-v)*10)/10;
  if(d<=0) return null;
  return c.kind==="load" ? `+${d}kg per rep`

/* ══════════════════ THE ROTATION ══════════════════
   Which muscles you are meant to be on, day by day. The default hits every
   group exactly twice across the seven days; past that it is yours — rename a
   day, swap its groups, or empty one out entirely and it becomes a rest day
   with nothing asked of it.

   Today's missions are drawn from the rotation, so editing it re-rolls today
   rather than leaving three missions behind for muscles you just took off the
   calendar. */
const DEFAULT_ROT=[
 {name:"Push A",      gs:["chest","triceps"]},
 {name:"Pull A",      gs:["back","biceps"]},
 {name:"Legs A",      gs:["legs"]},
 {name:"Core & Delts",gs:["core","shoulders"]},
 {name:"Push B",      gs:["chest","shoulders","triceps"]},
 {name:"Pull B",      gs:["back","biceps"]},
 {name:"Legs B",      gs:["legs","core"]}
];
const DOWL=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const DOWF=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

const rotList=()=>(S&&Array.isArray(S.rot)&&S.rot.length===7)?S.rot:DEFAULT_ROT;
/* one day of the rotation, always complete and always safe to read */
function rotAt(dow){
  const r=rotList()[dow]||{};
  const gs=(Array.isArray(r.gs)?r.gs:[]).filter(g=>GROUPS[g]);
  return {dow,gs,
    name:String(r.name||(gs.length?"Training":"Rest")).slice(0,22),
    label:gs.length?gs.map(g=>GROUPS[g].name.toLowerCase()).join(" & "):"rest day"};
}
const isRest=dow=>!rotAt(dow).gs.length;
/* editing any day invalidates the missions that were drawn from it */
const rotSig=()=>rotList().map(r=>((r&&r.gs)||[]).join("+")).join("|");
function normRot(v){
  if(!Array.isArray(v)||v.length!==7) return null;
  return v.map((r,i)=>({name:String((r&&r.name)||DEFAULT_ROT[i].name).slice(0,22),
    gs:((r&&Array.isArray(r.gs))?r.gs:[]).filter(g=>GROUPS[g]).slice(0,4)}));
}

/* ══════════════════ DATES & MATHS ══════════════════ */
const pad=n=>String(n).padStart(2,"0");
const dayKey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const toDate=k=>new Date(k+"T00:00:00");
const dayNum=k=>Math.floor(toDate(k).getTime()/864e5);
const dowOf=k=>(toDate(k).getDay()+6)%7;
function mondayOf(k){const d=toDate(k);d.setDate(d.getDate()-dowOf(k));return dayKey(d);}
const yKey=()=>{const d=new Date();d.setDate(d.getDate()-1);return dayKey(d);};
const fmt=n=>Math.round(n).toLocaleString();

const SEC_PER_REP=3;
const hasLoad = ex => ex.mode==="load" || ex.mode==="bwload";
const perRepKg=(ex,bw,load)=> ex.mode==="load"?load : ex.mode==="bwload"?bw*ex.f+load : bw*ex.f;
/* sides: 1 = both limbs on one implement, 2 = each limb worked separately.
   Load and reps are always entered PER SIDE, so tonnage multiplies but
   per-rep load (what the records and the challenges are scored on) stays
   honest. */
const sideMode = ex => ex.s==="opt" ? ((S&&S.last[ex.id]&&S.last[ex.id].sd) || ex.sd) : ex.s;
const sidesNow = () => (U.sd==="each"?2:1);
function computeSet(ex,bw,sets,reps,load,sides){
  const prk=perRepKg(ex,bw,load);
  const units= ex.mode==="time" ? reps/SEC_PER_REP : reps;
  return {ton:Math.round(prk*units*sets*(sides||1)), prk:Math.round(prk*10)/10};
}
const e1rm=(kg,reps)=>Math.round(kg*(1+reps/30)*10)/10;

/* ══════════════════ DAILY MISSION ENGINE ══════════════════ */
const TASKS=[
 {t:"set_reps", mk:(T,p)=>({target:12+T*2, label:`One set of ${12+T*2}+ reps · ${p.label}`})},
 {t:"total_reps", mk:(T,p)=>({target:60+T*15, label:`${60+T*15} total reps · ${p.label}`})},
 {t:"distinct", mk:(T,p)=>({target:Math.min(6,3+Math.floor(T/3)), label:`${Math.min(6,3+Math.floor(T/3))} different ${p.label} exercises`})},
 {t:"hold", mk:(T)=>({target:45+T*15, label:`${45+T*15}s of holds — any muscle`})},
 {t:"top_load", mk:(T,p,S)=>{const b=bestLoadIn(S,p.gs); const tg=Math.max(5,Math.round(b*(.82+T*.012)*2)/2);
    return {target:tg, label:`One set at ${tg}kg+ per rep · ${p.label}`};}},
 {t:"pr", mk:()=>({target:1, label:"Set a new record on anything"})},
 {t:"sets", mk:(T,p)=>({target:9+T, label:`${9+T} hard sets · ${p.label}`})}
];
function bestLoadIn(S,gs){
  let b=0; for(const id in S.records){ if(gs.includes(byId(id).g)) b=Math.max(b,S.records[id].load||0); }
  return b|| Math.max(8, S.bw*.4);
}
function baseTonnage(S){
  const today=dayNum(dayKey()); const per={};
  S.log.forEach(r=>{ if(today-dayNum(r.d)<21) per[r.d]=(per[r.d]||0)+r.ton; });
  const v=Object.values(per).sort((a,b)=>a-b);
  if(v.length<3) return 900;
  return Math.max(700, v[Math.floor(v.length/2)]);
}
function weekIndex(S,k){ return S.start ? Math.max(0,Math.floor((dayNum(k)-dayNum(S.start))/7)) : 0; }

function makeDaily(S,k){
  const dow=dowOf(k), p=rotAt(dow), W=weekIndex(S,k), T=Math.min(9,Math.floor(W/2));
  const base={k,dow,rot:rotSig(),plan:p.name,week:W,tier:T,
    acc:{ton:0,focusTon:0,reps:0,sec:0,sets:0,ex:[],pr:false,bestSetReps:0,bestLoad:0}};
  /* a rest day asks for nothing: no missions to fail, no tick to miss */
  if(!p.gs.length) return Object.assign(base,{quota:0,objs:[],perfect:true,rest:true});
  const quota=Math.max(400, Math.round(baseTonnage(S)*.6*(1+.02*Math.min(W,25))/10)*10);
  const n=dayNum(k), NT=TASKS.length;
  let i1=(n*3+W*2)%NT, i2=(n*5+W*4+3)%NT;
  if(i2===i1) i2=(i2+1)%NT;
  const a=TASKS[i1], b=TASKS[i2];
  const oa=a.mk(T,p,S), ob=b.mk(Math.min(9,T+2),p,S);
  return Object.assign(base,{quota,
    objs:[
      {t:"quota",target:quota,label:`Move ${fmt(quota)}kg of ${p.label}`,done:false},
      {t:a.t,target:oa.target,label:oa.label,done:false},
      {t:b.t,target:ob.target,label:ob.label,done:false}
    ],
    perfect:false,rest:false});
}
function progressOf(o,acc){
  switch(o.t){
    case "quota":return acc.focusTon; case "set_reps":return acc.bestSetReps;
    case "total_reps":return acc.reps; case "distinct":return acc.ex.length;
    case "hold":return acc.sec; case "top_load":return acc.bestLoad;
    case "pr":return acc.pr?1:0; case "sets":return acc.sets; default:return 0;
  }
}
/* which exercises count toward a given daily objective */
function objQualifiers(o,plan,bw){
  const inF=e=>plan.gs.includes(e.g);
  switch(o.t){
    case "quota": case "distinct": case "sets": return EX.filter(inF);
    case "set_reps": case "total_reps": return EX.filter(e=>inF(e)&&e.mode!=="time");
    case "hold": return EX.filter(e=>e.mode==="time");
    case "top_load": return EX.filter(e=>inF(e)&&(e.mode!=="bw"||bw*e.f>=o.target)&&e.mode!=="time");
    case "pr": return EX;
    default: return [];
  }
}
const OBJ_HINT={
  quota:"Total kilos moved in today's muscle groups. Sets × reps × the weight on each rep.",
  set_reps:"One single set has to reach this rep count. Holds don't count.",
  total_reps:"Every rep of today's groups adds up across the whole day.",
  distinct:"Different exercises from today's groups — variety, not volume.",
  hold:"Isometric holds only, any muscle. Seconds add up across the day.",
  top_load:"One set where each rep carries at least this much weight.",
  pr:"Beat any of your stored records: load, reps, set volume or estimated 1RM.",
  sets:"Working sets logged in today's muscle groups."
};
const fmtProg=(o,v)=> o.t==="pr" ? (v?"done":"not yet")
  : o.t==="quota" ? fmt(v)+"/"+fmt(o.target)+"kg"
  : o.t==="hold" ? v+"/"+o.target+"s"

/* ══════════════════ FORM ══════════════════
   The training measure, and deliberately not the same shape as the challenge
   one. Records are permanent, so the challenge board is all-time: whoever is
   strongest wins it and that is correct. Measuring training the same way would
   just rank people by how long ago they signed up — total kilos only ever goes
   up, so the earliest player would hold first place forever and nobody new
   could ever take it.

   So Form is a rolling 28 days and nothing older counts. Turning up is worth
   the most, finishing the day you were given is worth more than the volume in
   it, and the sets are the tiebreaker. It resets itself, which means it is
   always winnable this month by whoever actually trains this month. */
const FORM_WIN=28;
const FORM_D=10, FORM_P=5;
function trainStats(){
  const t0=dayNum(dayKey()), days={};
  let ton=0, sets=0;
  (S.log||[]).forEach(r=>{ const age=t0-dayNum(r.d);
    if(age<0||age>=FORM_WIN) return;
    ton+=r.ton||0; sets+=r.sets||0; days[r.d]=1; });
  let pd=0;
  Object.keys(S.weeks||{}).forEach(wk=>{
    const arr=S.weeks[wk];
    if(!Array.isArray(arr)) return;            /* the ":paid" flags are booleans */
    arr.forEach((v,i)=>{ if(v!==2) return;
      const age=t0-(dayNum(wk)+i);
      if(age>=0&&age<FORM_WIN) pd++; });
  });
  return {d:Object.keys(days).length, pd, st:sets, tn:Math.round(ton)};
}
const EMPTY_TR={d:0,pd:0,st:0,tn:0};
/* days you turned up, days you finished, sets you did */
const formOf=tr=>!tr?0:(tr.d|0)*FORM_D+(tr.pd|0)*FORM_P+(tr.st|0);

let KEY="liftmania:save";
const LEGACY=["ironrun:save","ironrun:v2","ironrun:v1"];
const STORE={mode:"memory",mem:{},
  async init(){
    if(window.storage && typeof window.storage.set==="function"){
      try{ await window.storage.set(KEY+":probe","1"); this.mode="claude"; return; }catch(e){}
    }
    try{ localStorage.setItem(KEY+":probe","1"); localStorage.removeItem(KEY+":probe"); this.mode="local"; return; }catch(e){}

  },
  async get(k){
    const key=k||KEY;
    try{
      if(this.mode==="claude"){ const r=await window.storage.get(key); return r?r.value:null; }
      if(this.mode==="local") return localStorage.getItem(key);
      return this.mem[key]||null;
    }catch(e){ return null; }
  },
  async getAny(){
    let v=await this.get(KEY);

    return null;
  },
  async set(v,k){
    const key=k||KEY;

      if(this.mode==="claude") await window.storage.set(key,v);
      else if(this.mode==="local") localStorage.setItem(key,v);
      else this.mem[key]=v;
      return true;

  },
  /* shared = visible to everyone using this app: the league board lives here */

    try{ const r=await window.storage.get(k,true); return r?r.value:null; }catch(e){ return null; } },
  async sset(k,v){ if(this.mode!=="claude") return false;

  async slist(pre){ if(this.mode!=="claude") return [];
    try{ const r=await window.storage.list(pre,true); const ks=(r&&r.keys)||[];

  const rows=[

    {k:"reps",  label:ex.mode==="time"?"hold":"reps", cur:reps,                best:r.reps||0,  u:ex.mode==="time"?"s":""},
    {k:"vol",   label:"set volume",                cur:Math.round(prk*units),  best:r.vol||0,   u:"kg"},
    {k:"e1rm",  label:"est. 1RM",                  cur:e1rm(prk,units),        best:r.e1rm||0,  u:"kg"}
  ];
  const hits=rows.filter(x=>x.cur>x.best);
  const miss=rows.filter(x=>x.cur<=x.best && x.best>0)
                 .map(x=>({...x,gap:x.best-x.cur+ (x.k==="reps"?1:0.1), rel:(x.best-x.cur)/x.best}))
                 .sort((a,b)=>a.rel-b.rel);

   Nothing you have earned decays. A record is a record and a medal, once cut,
   stays cut — the ten challenges are a ladder you climb, not a bar you have to
   keep holding up. What a long gap actually costs is the streak, the week's
   ticks, and the lifts that quietly drift onto the going-stale list. */
function applyDecay(){
  if(!S.lastDay) return null;
  const gap=dayNum(dayKey())-dayNum(S.lastDay);
  if(gap<2 || !S.streak) return null;
  const lost=S.streak; S.streak=0;
  return {days:gap,streak:lost};
}
function restStatus(){
  if(!S.lastDay) return {t:"new",msg:"Nothing logged yet. The clock starts on your first set."};
  const gap=dayNum(dayKey())-dayNum(S.lastDay);
  if(gap===0) return {t:"ok",msg:"Trained today. The streak holds."};
  if(gap===1) return {t:"grace",msg:isRest(dowOf(dayKey()))
    ? "Rest day on your rotation. The streak is safe either way."
    : "One day off. Log anything today and the streak survives."};
  return {t:"decay",msg:`${gap} days off — the streak is back to zero. Your records and medals are untouched.`};
}

/* One path for both: `att` is null for an ordinary logged set and carries the
   challenge, the numbers and the side mode when the set is a declared attempt.
   An attempt is always a single all-out set — nothing about "the most push-ups
   you can do" survives being spread over three of them. */
function logSet(att){
  const ex=att?chalEx(att.c):byId(U.ex);
  const sets=att?1:U.sets, reps=att?att.reps:U.reps, load=att?att.load:U.load;
  const sd=att?att.sd:U.sd, sides=sd==="each"?2:1;
  const {ton,prk}=computeSet(ex,S.bw,sets,reps,load,sides);
  if(ton<=0) return;
  const today=dayKey();
  if(S.lastDay!==today) S.streak = S.lastDay===yKey() ? S.streak+1 : 1;
  S.lastDay=today; S.away=null;
  rollDaily();
  /* snapshot the bars before any of this lands, so they animate the distance */
  const objFrom=S.daily.objs.map(o=>{const v=progressOf(o,S.daily.acc);
    return o.t==="pr"?(v?100:0):Math.min(100,v/o.target*100);});
  const popObj=[];

  /* records — four per exercise, the private ledger under everything else */
  const rec=S.records[ex.id]||{};
  const units = ex.mode==="time" ? reps/SEC_PER_REP : reps;
  const setVol=Math.round(prk*units), est=e1rm(prk,units);
  const broke=[];
  const nr={load:rec.load||0,loadD:rec.loadD,reps:rec.reps||0,repsD:rec.repsD,
            vol:rec.vol||0,volD:rec.volD,e1rm:rec.e1rm||0,e1rmD:rec.e1rmD,
            n:rec.n||0,last:rec.last,seen:(rec.seen||0)+1};
  if(prk>nr.load){ nr.load=prk; nr.loadD=today; broke.push("load"); }
  if(reps>nr.reps){ nr.reps=reps; nr.repsD=today; broke.push(ex.mode==="time"?"hold":"reps"); }
  if(setVol>nr.vol){ nr.vol=setVol; nr.volD=today; broke.push("set volume"); }
  if(est>nr.e1rm){ nr.e1rm=est; nr.e1rmD=today; broke.push("est. 1RM"); }
  if(broke.length){
    nr.n+=broke.length; nr.last=today; S.power++;
    S.prLog=[{d:today,ex:ex.id,k:broke.slice(),prk,reps},...(S.prLog||[])].slice(0,80);
  }
  S.records[ex.id]=nr;

  /* ── the attempt ───────────────────────────────────────────────────
     Only a set declared as an attempt is measured against the ten. */
  const ch=att?att.c:null;
  const runV=ch ? Math.round(chalRunValue(ch,reps,prk,sd)*10)/10 : 0;
  const medNow=ch&&runV>0 ? chalMedal(ch,runV) : -1;
  let got=null;
  if(ch && runV>0){
    const cur=S.chal[ch.id]||null, wasT=cur?chalMedal(ch,cur.v):-1;
    const beat=!cur || runV>cur.v;
    S.chal[ch.id]={v:beat?runV:cur.v, d:beat?today:cur.d, n:((cur&&cur.n)||0)+1};
    if(beat){
      got={id:ch.id,name:ch.name,v:runV,prev:cur?cur.v:0,tier:medNow,up:medNow>wasT};
      /* a tier you already hold is yours for good, so the ceremony is for a
         cut you have just passed for the first time and nothing else */
      if(medNow>wasT) FXQ.push({tier:medNow,name:ch.name,rec:chalFmt(ch,runV),
        rank:`${medNow+1} of 5`, gap:chalGap(ch,runV,medNow),
        next:medNow<4?MEDALS[medNow+1].n:null, pts:medalPoints()});
    }
  }

  /* daily accumulators */
  const p=rotAt(S.daily.dow), inFocus=p.gs.includes(ex.g), a=S.daily.acc;
  a.ton+=ton;
  if(ex.mode==="time") a.sec+=reps*sets*sides;
  if(broke.length) a.pr=true;
  if(inFocus){
    a.focusTon+=ton; a.sets+=sets;
    if(ex.mode!=="time") a.reps+=reps*sets*sides;
    if(!a.ex.includes(ex.id)) a.ex.push(ex.id);
    if(ex.mode!=="time" && reps>a.bestSetReps) a.bestSetReps=reps;
    if(prk>a.bestLoad) a.bestLoad=prk;
  }

  /* today's missions */
  const finished=[];
  S.daily.objs.forEach((o,i)=>{
    if(!o.done && progressOf(o,a)>=o.target){ o.done=true; finished.push(o.label); popObj.push(i); }
  });
  let perfect=false;
  if(!S.daily.perfect && S.daily.objs.length && S.daily.objs.every(o=>o.done)){
    S.daily.perfect=true; perfect=true;
  }

  /* week ledger — a rest day on your own rotation counts as kept */
  const wk=mondayOf(today);
  if(!S.weeks[wk]) S.weeks[wk]=[0,0,0,0,0,0,0];
  S.weeks[wk][S.daily.dow]=Math.max(S.weeks[wk][S.daily.dow], S.daily.perfect?2:1);
  let weekDone=false;
  if(S.weeks[wk].every((v,i)=>v===2||isRest(i)) && !S.weeks[wk+":paid"]){
    S.weeks[wk+":paid"]=true; S.perfectWeeks++; weekDone=true;
  }

  S.totalTon+=ton;
  /* an all-out attempt is a terrible suggestion for your next working set */
  if(!att) S.last[ex.id]={sets,reps,load,sd};
  S.log.unshift({d:today,t:Date.now(),ex:ex.id,sets,reps,load,sd,prk,ton,
    pr:broke.length?broke.slice():null,md:medNow,att:att?1:0});
  S.log=S.log.slice(0,900);

  U.flash={ton,broke,finished,perfect,weekDone,chal:got,run:runV,chId:ch?ch.id:null,att:!!att,
    rep:{ex:ex.id,sets,reps,load,sd}};
  U.fx={objFrom,popObj};
  startRest(S.restLen||30);
  persist(); publish(); render();
  if(FXQ.length) playFx();
}

/* Sit the test: one set, all out, from the challenge screen. */
function submitAttempt(id){
  const c=chalOf(id), ex=chalEx(c), isLoad=c.kind==="load";
  const reps=Math.max(1,Math.round(isLoad?U.attR:U.attV));
  const load=isLoad?Math.round(U.attV*2)/2:0;
  if(isLoad && reps<8) return alert(`A run at ${c.name} is a set of eight reps or more. Fewer than that and it is a heavy set, not this test.`);
  if(isLoad && load<=0) return alert("Put some weight on it first.");
  const sd=ex.s==="opt" ? (ex.sd||"both") : ex.s;
  logSet({c,reps,load,sd});
}

/* The clock ticks in place: painting it must never re-render the app, or every
   second would throw away whatever the steppers or a focused field were doing. */
/* Longer, and longer from now on: tapping this after every set would be worse
   than the wrong default, so the new length is remembered. */
function restPlus(){
  S.restLen=Math.min(600,(S.restLen||30)+30);
  const left=Math.max(0,U.rest)+30;
  startRest(Math.max(left,(U.restTotal||0)+30));
  U.rest=left;
  paintRest(); persist();      /* paint in place — a render would reset the steppers */
}

/* Do that again. The set is replayed from what the receipt recorded, never
   from the picker, which may have wandered somewhere else since. */
function againSet(){
  const f=U.flash; if(!f) return;
  if(f.att&&f.chId) return submitAttempt(f.chId);
  if(!f.rep) return;
  pickEx(f.rep.ex);
  U.sets=f.rep.sets; U.reps=f.rep.reps; U.load=f.rep.load; U.sd=f.rep.sd;
  logSet();
}

function startRest(n){
  U.restTotal=Math.max(1,n); U.rest=U.restTotal;
  clearInterval(U.restT);
  U.restT=setInterval(()=>{ U.rest--; if(U.rest<=0){clearInterval(U.restT);U.rest=0;} paintRest(); },1000);
}
function paintRest(){
  const box=document.getElementById("restBox"); if(!box) return;
  const c=document.getElementById("restClock"), f=document.getElementById("restFill"),
        l=document.getElementById("restLen");
  const total=Math.max(1,U.restTotal||S.restLen||30);
  const done=U.rest<=0;
  box.classList.toggle("done",done);
  if(c) c.textContent = done ? "go" : `${Math.floor(U.rest/60)}:${pad(U.rest%60)}`;
  if(f) f.style.width = done ? "0%" : (U.rest/total*100)+"%";
  if(l) l.textContent = S.restLen+"s";
}

/* ══════════════════ DEFEAT SEQUENCE ══════════════════ */
const FXQ=[]; let FXT=null;
const REDUCE=()=>window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function playFx(){
  if(!FXQ.length) return;
  const it=FXQ.shift(), el=document.getElementById("fx"), r=REDUCE();
  let sparks="";
  if(!r){
    const cols=["#00E88C","#FFC53D","#FF3D9A","#3D6BFF","#F2EDFF"];
    for(let i=0;i<30;i++){
      const a=(i/30)*Math.PI*2+Math.random()*.4, d=150+Math.random()*280;
      sparks+=`<div class="spark" style="--dx:${(Math.cos(a)*d).toFixed(0)}px;--dy:${(Math.sin(a)*d).toFixed(0)}px;`
        +`background:${cols[i%5]};animation-delay:${(Math.random()*.2).toFixed(2)}s"></div>`;
    }
  }
  el.innerHTML=`${r?"":`<div class="ring"></div><div class="ring" style="animation-delay:.18s;border-color:var(--gold)"></div>`}${sparks}
    <div class="fxcard">
      <div class="fxpill" style="color:var(--green)">medal ${esc(it.rank)}</div>
      <div class="${r?"":"slam"}" style="margin:16px 0 0">${medalImg(it.tier,"fxmedal")}</div>
      <div class="disp" style="font-size:29px;margin:10px 0 0">${esc(MEDALS[it.tier].n.toUpperCase())}</div>
      ${r?"":`<div class="crack"></div>`}
      <div class="rise muted">${esc(it.name)} · <b style="color:var(--cream)">${esc(it.rec)}</b></div>

      <div class="rise" style="margin-top:20px">
        ${it.next?`<div class="fxpill">next up</div>
          <div class="disp" style="font-size:18px;color:var(--gold);margin-top:5px">${esc(it.next.toUpperCase())}</div>
          <div class="mono" style="font-size:13px;color:var(--dim);margin-top:5px">${esc(it.gap||"")}</div>`
        :`<div class="fxpill" style="color:var(--gold)">nothing sits above this one</div>`}
        <div class="mono" style="font-size:12px;color:var(--dim);margin-top:12px">${it.pts} medal points</div>
      </div>
      <div class="tapdis mono" style="font-size:12px;color:var(--dim);margin-top:22px">tap anywhere to continue</div>
    </div>`;
  el.classList.add("on");
  if(!r){ const app=document.getElementById("app");
    app.classList.add("shake"); setTimeout(()=>app.classList.remove("shake"),700); }
  clearTimeout(FXT); FXT=setTimeout(dismissFx, 4600);
}
function dismissFx(){
  clearTimeout(FXT);
  const el=document.getElementById("fx"); el.classList.remove("on"); el.innerHTML="";
  if(FXQ.length) setTimeout(playFx,200); else render();
}
document.getElementById("fx").addEventListener("click",dismissFx);

/* ══════════════════ EXPORT / IMPORT ══════════════════ */
function exportSave(){
  S.lastExport=Date.now(); persist();
  const blob=new Blob([JSON.stringify({app:"liftmania",ver:3,exported:dayKey(),save:S},null,1)],{type:"application/json"});
  const a=document.getElementById("dl");
  a.href=URL.createObjectURL(blob); a.download=`liftmania-${MP.me?MP.me.id:"save"}-${dayKey()}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000); render();
}
function loadSaveObj(o){
  if(o && (o.app==="liftmania"||o.app==="iron-run") && o.save) o=o.save;
  if(!o || typeof o!=="object" || !("log" in o)) { alert("That file isn't a LiftMania save."); return; }
  S=migrate(o); applyDecay(); rollDaily(); persist(); U.tab="train"; render();
  alert("Save restored.");
}
/* square-crop and squeeze until it is small enough to ride along with the
   stats blob that syncs to everyone else */
function setAvatar(file){
  if(!file) return;
  const fr=new FileReader();
  fr.onerror=()=>alert("Couldn't read that file.");
  fr.onload=()=>{
    const img=new Image();
    img.onerror=()=>alert("That doesn't look like an image.");
    img.onload=()=>{
      const N=192, cv=document.createElement("canvas");
      cv.width=cv.height=N;
      const ctx=cv.getContext("2d"), side=Math.min(img.width,img.height);
      ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,N,N);
      let q=0.74, out=cv.toDataURL("image/jpeg",q);
      while(out.length>16000 && q>0.32){ q-=0.07; out=cv.toDataURL("image/jpeg",q); }
      if(!safePic(out)) return alert("Couldn't use that image. Try a different one.");
      S.pic=out; persist(); publish(); render();
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}
document.getElementById("picIn").addEventListener("change",e=>{
  setAvatar(e.target.files[0]); e.target.value="";
});
document.getElementById("fileIn").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ loadSaveObj(JSON.parse(r.result)); }catch(x){ alert("Couldn't read that file."); } };
  r.readAsText(f); e.target.value="";
});

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clamp=n=>Math.max(0,Math.min(100,n));
const bar=(pct,color,h,from)=>{
  const anim = from!=null && Math.abs(from-pct)>0.5;
  return `<div class="track" style="height:${h||6}px"><div class="fill${anim?" animw":""}" `
    + `style="width:${clamp(pct)}%;background:${color}${anim?`;--from:${clamp(from)}%`:""}"></div></div>`;
};
const exTag=e=>{const[c,t]=MODE_TAG[e.mode];return `<span class="tag ${c}">${t}</span>`;};
const hasEx=id=>EX.some(e=>e.id===id);

/* Board rows come from other players, so a picture is only ever used after it
   matches a plain base64 data URL - it ends up inside a style attribute. */
const PIC_OK=/^data:image\/(?:jpeg|png|webp);base64,[A-Za-z0-9+/]+=*$/;
const safePic=p=>(typeof p==="string"&&p.length<26000&&PIC_OK.test(p))?p:null;
/* One avatar, with a face if there is one and the initial if there is not.
   Drawn as <img> rather than a CSS background: a data URL in url() has to get
   past the CSS tokeniser too, and that is where engines disagree. */
function ava(pic,name,cls){
  const p=safePic(pic);
  return p ? `<span class="av ${cls||""}"><img src="${p}" alt="${esc(name||"")}" loading="lazy"></span>`
           : `<span class="av ${cls||""}">${esc(initial(name))}</span>`;
}

const kgs=n=>Math.abs(n)>=10000?fmtK(n)+" kg":fmt(n)+"kg";

/* "2h", "3d" — the crew feed needs shorter stamps than agoText gives */
function relT(ms){
  if(!ms) return "";
  const s=(Date.now()-ms)/1000;
  if(s<90) return "now";
  if(s<5400) return Math.max(1,Math.round(s/60))+"m";
  if(s<172800) return Math.round(s/3600)+"h";
  return Math.round(s/86400)+"d";
}

const cols=(a,b)=>`<div class="cols"><div class="col">${a}</div><div class="col">${b}</div></div>`;
const qualList=(list,note)=>`<div class="expand${FX.expand?" reveal":""}">
  ${note?`<div class="mini" style="margin-bottom:9px">${esc(note)}</div>`:""}
  <div>${list.map(e=>`<button class="qchip" data-a="jump" data-e="${e.id}">${esc(e.n)} ${exTag(e)}</button>`).join("")}</div></div>`;
const stepper=(label,field,step,min)=>`
 <div class="stepper"><span class="slabel">${label}</span><div class="srow">

/* ══════════════════ ACTIVITY ══════════════════
   Everyone's last few sets ride along inside the board card they already
   push, so the feed needs no extra table and no extra request. */
function feedItems(withMe){
  const out=[];
  Object.values(MP.board).forEach(pl=>{
    const mine=MP.me&&pl.id===MP.me.id;
    if(mine&&!withMe) return;
    (pl.recent||[]).forEach(r=>{ if(hasEx(r.ex)) out.push(Object.assign({},r,{who:pl.name||pl.id,pic:pl.pic,mine})); });
  });
  return out.sort((a,b)=>(b.t||0)-(a.t||0));
}
function feedRow(it){
  const e=byId(it.ex), who=esc(it.mine?"You":it.who), md=it.md;
  const c=CH_BY_EX[it.ex];
  const head = md>=0&&md!=null&&c
    ? `<b>${who}</b> ran ${esc(c.name)} for ${medalImg(md,"fimg")} ${esc(MEDALS[md].n)}`
    : `<b>${who}</b> logged ${esc(e.n)}`;
  return `<div class="fr">
    ${ava(it.mine?S.pic:it.pic, it.who, it.mine?"me":"")}
    <div class="ftxt">${head}
      <span class="lsub">${esc(e.n)} · ${setDesc(it)} · ${fmt(it.ton||0)}kg${it.pr&&it.pr.length?`<span class="prbadge">PR</span>`:""}</span></div>
    <div class="ftime">${relT(it.t)}</div>
  </div>`;
}
const todaySets=()=>{const k=dayKey();return (S.log||[]).filter(r=>r.d===k);};

/* Your own card on the board was published on your last sync, so in your own
   view it is always a little stale. Everyone else's is the best we have; yours
   is sitting in front of us, so patch the live numbers over it. */
function liveRows(pool){
  const mine=MP.me&&MP.me.id;
  const rows=(pool||Object.values(MP.board)).map(pl=>pl.id!==mine?pl:Object.assign({},pl,{
    chal:S.chal||{}, tr:trainStats(), pwr:S.power|0, ton:Math.round(S.totalTon||0), streak:S.streak|0,
    prs:(S.prLog||[]).length, lastDay:S.lastDay, pic:S.pic||null}));
  if(mine && !rows.some(r=>r.id===mine)) rows.push(selfRow());
  return rows;
}

/* ══════════════════ STANDINGS ══════════════════
   Every score is worked out here rather than read off a board card. The ten
   challenges are identical for everyone and everyone publishes their raw
   records, so the same arithmetic runs on every device and nobody's rank
   depends on how recently they happened to sync.

   A score is two things added together: the medals you hold, each one earned
   once and kept for good, and the position you hold on each challenge's board.
   The medals stop at Champion. The positions never do — once the cuts are all
   behind you the only thing left to take is somebody else's place. */
function standings(pool){
  const rows=liveRows(pool).map(pl=>Object.assign({},pl,{
    chal:pl.chal||{}, med:[0,0,0,0,0], mpts:0, rpts:0, rank:{}, ran:0}));
  CHALLENGES.forEach(c=>{
    rows.forEach(r=>{
      const v=r.chal[c.id]&&r.chal[c.id].v; if(!(v>0)) return;
      r.ran++;
      const t=chalMedal(c,v);
      if(t>=0){ r.mpts+=CUM_PTS[t]; for(let k=0;k<=t;k++) r.med[k]++; }
    });
    const runs=rows.filter(r=>r.chal[c.id]&&r.chal[c.id].v>0)
                   .sort((a,b)=>b.chal[c.id].v-a.chal[c.id].v);
    runs.forEach((r,i)=>{ r.rank[c.id]=i+1; r.field=runs.length;
                          r.rpts+=rankPts(i+1,runs.length); });
  });
  rows.forEach(r=>{
    r.score=r.mpts+r.rpts; r.mp=r.score;
    /* a player who has not opened a build that publishes it counts as zero
       rather than breaking the column */
    r.tr=r.tr&&typeof r.tr==="object"?r.tr:EMPTY_TR;
    r.form=formOf(r.tr);
  });
  return rows.sort((a,b)=>b.score-a.score || (b.mpts|0)-(a.mpts|0));
}
const myStanding=()=>{
  const mine=MP.me&&MP.me.id;
  return standings().find(r=>r.id===mine)
    || {score:medalPoints(),mpts:medalPoints(),rpts:0,med:medalTally(),rank:{},ran:0,
        tr:trainStats(),form:formOf(trainStats())};
};
/* one challenge's board, best first */
function chalBoard(c){
  return standings().filter(r=>r.chal[c.id]&&r.chal[c.id].v>0)
                    .sort((a,b)=>b.chal[c.id].v-a.chal[c.id].v);
}

const TABS=[["feed","FEED","news"],["train","TRAIN","dumbbell"],["week","WEEK","cal"],
            ["chal","CHALLENGES","medal"],["crew","CREW","users"],["you","YOU","trophy"]];

function render(){
  rollDaily();
  FX=U.fx||{}; U.fx=null;
  const ex=byId(U.ex);
  let h=topBar()+tabBar()+alerts();
  if(U.tab==="feed")   h+=tabFeed();
  else if(U.tab==="train")  h+=tabTrain(ex);
  else if(U.tab==="week")   h+=tabWeek();
  else if(U.tab==="chal")   h+=tabChal();
  else if(U.tab==="crew")   h+=tabCrew();
  else if(U.tab==="you")    h+=tabYou();

  const app=document.getElementById("app");
  /* only a genuine view change earns the entrance run - otherwise every tap on
     a stepper would replay the whole page */
  app.className = lastView===U.tab ? "" : "enter";
  lastView=U.tab;
  app.innerHTML=h;
  wireInputs();
  paintRest();
}

function topBar(){
  return `<header class="topbar">
    <div class="brandline">
      <div class="brand">LIFTMANIA</div>
      <div class="mini" style="margin-top:3px">${esc((MP.me&&MP.me.name)||"guest")}</div>
    </div>
    <div class="themebox">${THEMES.map(t=>
      `<button class="theme-pill ${U.theme===t.id?"active":""}" data-a="theme" data-v="${t.id}" title="${t.title}" aria-label="${t.title}">${t.label}</button>`).join("")}</div>
  </header>`;
}
/* The three numbers that actually move: what you have collected, whether you
   turned up, and how much has gone through your hands since the start. */
function statStrip(){
  const t0=dayNum(dayKey());
  const wsets=(S.log||[]).reduce((a,r)=>a+(t0-dayNum(r.d)<7?r.sets:0),0);
  return `<div class="statstrip">
    <div class="stat" style="--accent:var(--green)">${ico("flame")}
      <span class="sv"><b>${S.streak}<i>d</i></b><span class="k">streak</span></span></div>
    <div class="stat" style="--accent:var(--magenta)">${ico("bars")}
      <span class="sv"><b>${wsets} <i>sets</i></b><span class="k">this week</span></span></div>
    <div class="stat" style="--accent:var(--cobalt)">${ico("weight")}
      <span class="sv"><b>${fmtK(S.totalTon)} <i>kg</i></b><span class="k">lifted</span></span></div>
  </div>`;
}
function tabBar(){
  return `<nav class="tabs">${TABS.map(t=>
    `<button class="tab ${U.tab===t[0]?"on":""}" data-a="tab" data-t="${t[0]}">${ico(t[2])}<span>${t[1]}</span></button>`).join("")}</nav>`;
}
/* only genuinely urgent things sit above the content; everything else has a home */
function alerts(){
  let h="";
  if(S.away){const w=S.away;
    h+=`<div class="banner warn">${ico("alert")}<div><b>${w.days} days off.</b> The ${w.streak}-day streak is gone. Nothing else moved — every record and every medal is exactly where you left it.
      <button class="ghost" data-a="dismissaway">got it</button></div></div>`;}
  if(STORE.mode==="memory")
    h+=`<div class="banner warn">${ico("alert")}<div>This browser is blocking storage. Progress will vanish when you close the tab — download a backup from YOU after every session.</div></div>`;
  else if(MP.status==="error")
    h+=`<div class="banner warn">${ico("alert")}<div>Not syncing: ${esc(MP.err||"server unreachable")}. Your training is still saved on this device.</div></div>`;
  return h;
}

/* The first thing on the screen is the answer to "what am I doing today" —
   the day, the slot your own rotation puts there, and the way to change it. */
function todayCard(){
  const dow=S.daily.dow, p=rotAt(dow), rest=!p.gs.length;
  return `<section class="card today" style="--accent:${rest?"var(--dim)":gcol(p.gs[0])}">
    <div class="tday">
      <div style="min-width:0">
        <div class="tdow">${DOWF[dow].toUpperCase()}</div>
        <div class="tname">${esc(p.name)}</div>
        <div class="tfocus">${rest?"Nothing scheduled. Take it."
          :`focus on <b style="color:${gcol(p.gs[0])}">${esc(p.label)}</b>`}</div>
      </div>
      <button class="ghost" data-a="editrot">${U.editRot?"done":"customise"}</button>
    </div>
    <div class="rotstrip">${DOWL.map((d,i)=>{const q=rotAt(i);
      return `<span class="rotpip ${i===dow?"on":""}" title="${esc(DOWF[i])} · ${esc(q.name)}">${d[0]}
        <em style="background:${q.gs.length?gcol(q.gs[0]):"transparent"};border-color:${q.gs.length?"transparent":"var(--dim)"}"></em></span>`;}).join("")}</div>

}

  const counts={}; GK.forEach(g=>counts[g]=rotList().filter(r=>((r&&r.gs)||[]).includes(g)).length);
  return `<div class="expand${FX.expand?" reveal":""}">
    <div class="mini" style="margin-bottom:12px">Name each day and tap the groups it trains. Leave a day with no groups and it becomes a rest day — no missions, and the week still counts as kept. Changing today re-rolls today's missions.</div>
    ${DOWL.map((d,i)=>{const r=rotAt(i);
      return `<div class="rotrow${r.gs.length?"":" rest"}">
        <div class="rothead">
          <span class="rotday">${esc(DOWF[i])}</span>
          <input type="text" class="rotname" id="rot_${i}" value="${esc(r.name)}" maxlength="22" placeholder="Rest day">
        </div>
        <div class="rotgs">${GK.map(g=>`<button class="gtog${r.gs.includes(g)?" on":""}" data-a="rotg" data-i="${i}" data-g="${g}"
          style="${r.gs.includes(g)?`background:${gcol(g)};color:var(--onGroup);border-color:transparent`:""}">${GROUPS[g].name}</button>`).join("")}</div>
      </div>`;}).join("")}
