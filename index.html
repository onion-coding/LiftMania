<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12102B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LiftMania">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LiftMania</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap');

/* ══════════════════ DESIGN TOKENS ══════════════════
   Every theme defines the same set, so nothing in the app ever needs a raw
   hex. Accent colours come in three roles and they are NOT interchangeable:

     --x     text/icon of that colour sitting on a page surface  (>=4.5:1)
     --xF    a filled block of that colour
     --onX   the text colour that sits on top of --xF

   In the dark theme fills are bright and their ink is near-black; in the
   light themes fills are deep and their ink is white. Using --x as a
   background (or --xF as text) is what makes a theme unreadable. */
:root{
  color-scheme:dark;
  --night:#12102B; --panel:#1C1841; --panel2:#2A2364; --line:#3B3484; --deep:#0B0920;
  --cream:#F5F2FF; --dim:#B3A9DC;
  --row:rgba(255,255,255,.05);
  --gold:#FFC93F;    --goldF:#FFC93F;    --onGold:#241B00;
  --green:#3DEFA7;   --greenF:#00E88C;   --onGreen:#002B1B;
  --cobalt:#8FACFF;  --cobaltF:#3B65F0;  --onCobalt:#FFFFFF;
  --magenta:#FF7ABA; --magentaF:#FF3D9A; --onMagenta:#2E0619;
  --red:#FF9086;     --redF:#FF6B5E;     --onRed:#2E0805;
  --onGroup:#12102B; --focus:#FFC93F;
  --ease:cubic-bezier(.2,.8,.2,1); --easeout:cubic-bezier(.16,1,.3,1);
  --holdBg:#4A2E6E; --holdFg:#EFDCFF;
  --kgBg:#1E3E7C;   --kgFg:#D2E1FF;
  --bwBg:#1C4A37;   --bwFg:#C6F5DF;
  --d:'Bungee',Impact,'Haettenschweiler','Arial Narrow Bold',sans-serif;
  --b:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --m:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
body[data-theme="foresty"]{
  color-scheme:light;
  --night:#F1EEE3; --panel:#FCFAF5; --panel2:#E7E0CF; --line:#D5CAB2; --deep:#EFEADD;
  --cream:#1D2925; --dim:#5A6961;
  --row:rgba(60,45,15,.045);
  --gold:#7A570B;    --goldF:#E2A63C;    --onGold:#241900;
  --green:#1D6B45;   --greenF:#257A4C;   --onGreen:#FFFFFF;
  --cobalt:#1A5D73;  --cobaltF:#1F718A;  --onCobalt:#FFFFFF;
  --magenta:#993858; --magentaF:#AF446B; --onMagenta:#FFFFFF;
  --red:#A33528;     --redF:#BE4436;     --onRed:#FFFFFF;
  --onGroup:#FFFFFF; --focus:#1A5D73;
  --holdBg:#EADFF2; --holdFg:#4B2A6B;
  --kgBg:#DBE5F3;   --kgFg:#1D4C74;
  --bwBg:#DAECDF;   --bwFg:#1C5A38;
}
body[data-theme="bright"]{
  color-scheme:light;
  --night:#F4F6F9; --panel:#FFFFFF; --panel2:#EDF1F6; --line:#D8DFE8; --deep:#F1F4F8;
  --cream:#141821; --dim:#586474;
  --row:rgba(15,23,42,.035);
  --gold:#7F5400;    --goldF:#F0B429;    --onGold:#241900;
  --green:#0E7A45;   --greenF:#12864C;   --onGreen:#FFFFFF;
  --cobalt:#1D4ED8;  --cobaltF:#2456D6;  --onCobalt:#FFFFFF;
  --magenta:#AC1D5A; --magentaF:#C22B6C; --onMagenta:#FFFFFF;
  --red:#AF2A20;     --redF:#C4342A;     --onRed:#FFFFFF;
  --onGroup:#FFFFFF; --focus:#1D4ED8;
  --holdBg:#ECE3FA; --holdFg:#4A2A85;
  --kgBg:#DDE8FB;   --kgFg:#17458F;
  --bwBg:#DBEFE3;   --bwFg:#0F6438;
}

/* ══════════════════ BASE ══════════════════ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--night);color:var(--cream);font-family:var(--b);
  font-size:15px;line-height:1.5;transition:background-color .35s ease,color .35s ease;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);position:relative}
#app{width:min(100vw - 20px, 470px);margin:14px auto 30px;padding-bottom:24px;
  display:flex;flex-direction:column;gap:12px}
button{cursor:pointer;font-family:inherit;border:none;color:inherit;font-size:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h2{margin:0}
.ic{width:20px;height:20px;flex:none;display:block}
.disp{font-family:var(--d);line-height:1.1}
.mono{font-family:var(--m)}
.mini{font-family:var(--m);font-size:11.5px;color:var(--dim);line-height:1.45}
.mini b{color:var(--cream);font-weight:500}
.empty{font-size:13.5px;color:var(--dim);line-height:1.5;padding:2px 0}

/* two columns once there is room for them */
.cols{display:flex;flex-direction:column;gap:12px}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (min-width:900px){
  #app{width:min(100vw - 40px, 1100px);gap:16px}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
}

/* ══════════════════ HEADER ══════════════════ */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brandline{min-width:0}
.brand{font-family:var(--d);font-size:22px;line-height:1;letter-spacing:.01em}
.themebox{display:flex;align-items:center;gap:3px;padding:3px;flex:none;
  border:1px solid var(--line);border-radius:11px;background:var(--panel)}
.theme-pill{display:inline-flex;align-items:center;justify-content:center;width:29px;height:27px;
  border-radius:8px;border:none;background:transparent;color:var(--cream);font-size:13px;line-height:1;padding:0}
.theme-pill.active{background:var(--goldF);color:var(--onGold)}

.statstrip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:2px}
@media (min-width:900px){ .statstrip{grid-template-columns:repeat(3,200px)} }
.stat{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:13px;
  background:var(--panel);border:1px solid var(--line);min-width:0}
.stat .ic{width:18px;height:18px;color:var(--accent,var(--dim))}
.stat .sv{min-width:0}
.stat b{display:block;font-family:var(--m);font-size:15px;font-weight:500;line-height:1.15;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat b i{font-style:normal;font-size:11px;color:var(--dim);margin-left:3px}
.stat .k{display:block;font-family:var(--m);font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--dim);margin-top:2px}

/* ══════════════════ TABS ══════════════════ */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:5px;
  background:var(--panel);border:1px solid var(--line);border-radius:15px}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;border-radius:11px;
  padding:9px 2px 8px;background:transparent;color:var(--dim);
  font-family:var(--m);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;line-height:1}
.tab .ic{width:21px;height:21px}
.tab.on{background:var(--goldF);color:var(--onGold)}
@media (min-width:900px){
  .tabs{max-width:560px}
  .tab{flex-direction:row;gap:8px;font-size:11px;padding:10px 4px}
}

/* ══════════════════ CARDS ══════════════════
   One header line: an icon in the section's colour, a title, optional meta,
   and the ? that holds every word of explanation. */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px 16px}
.chead{display:flex;align-items:center;gap:11px}
.cicon{width:32px;height:32px;border-radius:10px;flex:none;display:flex;align-items:center;
  justify-content:center;background:var(--row);color:var(--accent,var(--cream))}
@supports (background:color-mix(in srgb,red 10%,white)){
  .cicon{background:color-mix(in srgb,var(--accent,var(--dim)) 15%,transparent)}
}
.ctitle{flex:1;min-width:0;font-size:15px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
.ctitle.big{font-family:var(--d);font-size:19px;font-weight:400;letter-spacing:.01em;line-height:1.15}
.cmeta{font-family:var(--m);font-size:11.5px;color:var(--dim);white-space:nowrap;flex:none}
.hbtn{width:24px;height:24px;flex:none;border-radius:50%;background:var(--row);
  color:var(--dim);font-family:var(--m);font-size:12px;line-height:1;padding:0}
.hbtn.on{background:var(--goldF);color:var(--onGold)}
.csub{font-family:var(--m);font-size:11.5px;color:var(--dim);margin-top:7px;line-height:1.45}
.help{margin-top:12px;padding:12px 13px;border-radius:12px;background:var(--deep);
  color:var(--dim);font-size:13px;line-height:1.6}
.help b{color:var(--cream);font-weight:500}
.body{margin-top:13px}

/* ══════════════════ ROWS ══════════════════ */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:11px;padding:11px 0;width:100%;text-align:left;
  background:none;border:none;border-bottom:1px solid var(--line);min-width:0;color:inherit}
.li:first-child{padding-top:0}
.li:last-child{padding-bottom:0;border-bottom:none}
.ldot{width:9px;height:9px;border-radius:50%;flex:none}
.lmain{flex:1;min-width:0}
.lname{font-size:14px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lsub{display:block;font-family:var(--m);font-size:11px;color:var(--dim);margin-top:3px;line-height:1.35}
.lval{flex:none;text-align:right;font-family:var(--m);font-size:13.5px;line-height:1.2;white-space:nowrap}
.lval .u{font-size:10px;color:var(--dim);margin-left:3px}

.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv.two{grid-template-columns:repeat(2,1fr)}
.kvi{padding:10px 11px;border-radius:12px;background:var(--row);border:none;min-width:0;text-align:left}
.kvi .k{display:block;font-family:var(--m);font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--dim)}
.kvi b{display:block;font-family:var(--m);font-size:16px;font-weight:500;margin-top:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kvi .k2{display:block;font-family:var(--m);font-size:10px;color:var(--dim);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.track{position:relative;background:var(--deep);border-radius:99px;overflow:hidden;width:100%}
.fill{position:absolute;inset:0 auto 0 0;border-radius:99px;transform-origin:left center}

/* ══════════════════ MISSIONS ══════════════════ */
.objrow{display:flex;align-items:flex-start;gap:12px;padding:12px 0;width:100%;text-align:left;
  background:none;border:none;border-bottom:1px solid var(--line);color:inherit}
.objrow:first-child{padding-top:0}
.objrow:last-child{padding-bottom:0;border-bottom:none}
.objbox{width:22px;height:22px;flex:none;border-radius:7px;background:var(--row);
  display:flex;align-items:center;justify-content:center;font-family:var(--m);font-size:11px;
  color:var(--dim);margin-top:1px}
.objrow.done .objbox{background:var(--greenF);color:var(--onGreen)}
.objtxt{flex:1;min-width:0}
.objlab{display:block;font-size:14px;line-height:1.3}
.objrow.done .objlab{color:var(--dim)}
.objbar{display:block;margin:8px 0 6px}

/* ══════════════════ FEED ══════════════════ */
.fr{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.fr:first-child{padding-top:0}
.fr:last-child{padding-bottom:0;border-bottom:none}
.av{width:28px;height:28px;flex:none;border-radius:9px;background:var(--row);
  display:flex;align-items:center;justify-content:center;font-family:var(--d);font-size:11px}
.av.me{background:var(--goldF);color:var(--onGold)}
.ftxt{flex:1;min-width:0;font-size:13.5px;line-height:1.3}
.ftxt b{font-weight:700}
.ftime{flex:none;font-family:var(--m);font-size:10.5px;color:var(--dim);white-space:nowrap;padding-top:3px}
.prbadge{display:inline-block;font-family:var(--m);font-size:9.5px;letter-spacing:.07em;padding:2px 5px;
  border-radius:5px;background:var(--goldF);color:var(--onGold);margin-left:6px}

/* ══════════════════ BOARD ══════════════════ */
.lrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.lrow:first-child{padding-top:0}
.lrow:last-child{padding-bottom:0;border-bottom:none}
.lrow.me .pname{color:var(--gold)}
.rk{width:26px;height:26px;border-radius:9px;flex:none;display:flex;align-items:center;
  justify-content:center;font-family:var(--d);font-size:11px;background:var(--row);color:var(--dim)}
.rk.g1{background:var(--goldF);color:var(--onGold)}
.rk.g2{background:#B9BECF;color:#1A1D26}
.rk.g3{background:#9A5B22;color:#FFFFFF}
.pname{font-weight:700;font-size:14.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.youtag{font-family:var(--m);font-size:9.5px;letter-spacing:.1em;color:var(--onGold);
  background:var(--goldF);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.pbig{font-family:var(--m);font-size:16px;color:var(--gold);margin-left:auto;flex:none;
  text-align:right;line-height:1.15}
.pbig span{display:block;font-size:9px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.rolebadge{font-family:var(--m);font-size:9px;letter-spacing:.1em;padding:2px 6px;border-radius:5px;
  background:var(--row);color:var(--dim);margin-left:6px;vertical-align:2px;text-transform:uppercase}
.rolebadge.own{background:var(--goldF);color:var(--onGold)}
.xbtn{width:27px;height:27px;border-radius:8px;background:var(--row);color:var(--dim);font-size:14px;
  display:flex;align-items:center;justify-content:center;flex:none;line-height:1}
.xbtn:hover{background:var(--redF);color:var(--onRed)}
.code{font-family:var(--m);font-size:14px;letter-spacing:.12em;background:var(--deep);border-radius:11px;
  padding:12px;color:var(--cream);flex:1;min-width:0;text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cta.soon{background:var(--row);color:var(--dim);cursor:default;position:relative}
.cta.soon:active{transform:none}
.cta.soon span{display:block;font-family:var(--m);font-size:10px;letter-spacing:.14em;
  margin-top:5px;opacity:.8}

/* ══════════════════ SIGN IN ══════════════════ */
.login{min-height:72vh;display:flex;flex-direction:column;justify-content:center;gap:14px;
  width:min(100%,420px);margin:0 auto}
.lin{width:100%;height:50px;text-align:center;font-size:18px;letter-spacing:.08em;
  font-family:var(--m);background:var(--deep);color:var(--cream);border:1px solid var(--line);
  border-radius:12px;padding:0 10px;transition:border-color .25s var(--ease)}
.lin:focus{outline:none;border-color:var(--focus)}
.lreveal{max-height:0;opacity:0;overflow:hidden;pointer-events:none;transform:translateY(10px);
  transition:max-height .5s var(--ease),opacity .55s var(--ease),transform .55s var(--ease)}
#lhint{display:flex;align-items:center;gap:9px;min-height:19px}
.spin{width:15px;height:15px;flex:none;border-radius:50%;border:2px solid var(--line);
  border-top-color:var(--gold);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lreveal.on{max-height:340px;opacity:1;transform:none;pointer-events:auto}
.lstate{display:flex;align-items:flex-start;gap:11px;margin-top:12px;padding:12px 13px;
  border-radius:12px;background:var(--row);font-size:13px;line-height:1.4;color:var(--dim);
  box-shadow:inset 3px 0 0 var(--accent,var(--line))}
.lstate b{display:block;color:var(--cream);font-weight:700;font-size:14px}
.lstate em{display:block;margin-top:4px;font-style:normal;font-family:var(--m);font-size:11.5px}
.lstate .ic{width:19px;height:19px;margin-top:1px;color:var(--accent,var(--dim))}
.lstate.swap{animation:lstatein .3s var(--easeout) both}
@keyframes lstatein{from{opacity:0;transform:translateY(-6px)}}
.cta.swap{animation:ctaswap .34s var(--easeout) both}
@keyframes ctaswap{from{opacity:0;transform:translateY(9px) scale(.97)}}
.dots{display:inline-block;width:14px;text-align:left}
.dots:after{content:"";animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* ══════════════════ PICKER ══════════════════ */
.gchips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gchip{border-radius:10px;padding:9px 4px;font-size:12.5px;font-weight:700;background:var(--row);
  color:var(--cream);border:1px solid transparent;line-height:1.1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gchip .cnt{font-family:var(--m);font-size:9px;color:var(--gold);vertical-align:2px;margin-left:4px}
.exwrap{display:flex;flex-wrap:wrap;gap:6px}
.exchip{border-radius:10px;padding:9px 11px;font-size:13.5px;background:var(--row);color:var(--cream);
  border:1px solid transparent;display:inline-flex;align-items:center;gap:7px;line-height:1.15}
.exchip.on{background:var(--cream);color:var(--night);font-weight:700}
.exchip.hit{border-color:var(--gold)}
.exchip.on.hit{box-shadow:0 0 0 2px var(--goldF)}
.tag{font-family:var(--m);font-size:10px;font-weight:500;letter-spacing:.07em;padding:3px 5px;
  border-radius:5px;background:var(--panel2);color:var(--dim);flex:none;line-height:1.1}
.tag.hold{background:var(--holdBg);color:var(--holdFg)}
.tag.kg{background:var(--kgBg);color:var(--kgFg)}
.tag.bw{background:var(--bwBg);color:var(--bwFg)}
.exchip.on .tag{background:var(--night);color:var(--cream)}
.exchip .side{font-family:var(--m);font-size:10px;color:var(--magenta);flex:none}
.exchip.on .side{color:var(--night);opacity:.7}
.expand{margin-top:10px;padding:12px;border-radius:12px;background:var(--deep)}
.qchip{border-radius:9px;padding:7px 9px;font-size:12.5px;background:var(--row);color:var(--cream);
  border:none;margin:0 5px 5px 0;display:inline-flex;align-items:center;gap:6px}
.filt{border-radius:9px;padding:7px 11px;font-size:12px;font-family:var(--m);background:var(--row);
  color:var(--cream);border:none;line-height:1.35;white-space:nowrap}
.filt.on{background:var(--goldF);color:var(--onGold)}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg{display:inline-flex;border-radius:9px;overflow:hidden;background:var(--row);flex:none}
.seg button{padding:7px 12px;font-family:var(--m);font-size:12px;color:var(--dim);
  background:transparent;line-height:1.3}
.seg button.on{background:var(--goldF);color:var(--onGold)}
.legend{display:flex;flex-direction:column;gap:9px;font-family:var(--m);font-size:11.5px;
  color:var(--dim);line-height:1.35}
.legend>span{display:flex;align-items:center;gap:9px}
.legend .swatch{width:20px;height:14px;border-radius:4px;flex:none;border:1px solid var(--gold)}

/* ══════════════════ LOGGER ══════════════════ */
.steppers{display:flex;gap:10px}
.stepper{flex:1;min-width:0}
.slabel{display:block;font-family:var(--m);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--dim);margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbtn{width:38px;height:48px;border-radius:11px;background:var(--row);color:var(--cream);
  font-size:21px;line-height:1}
.sbtn:active{background:var(--goldF);color:var(--onGold)}
input.sval{flex:1;height:48px;border-radius:11px;background:var(--deep);color:var(--cream);
  font-family:var(--m);font-size:18px;text-align:center;border:1px solid transparent;
  min-width:0;width:100%;padding:0;-webkit-appearance:none}
input.sval:focus{border-color:var(--focus);outline:none;background:var(--panel2)}
.srow{display:flex;align-items:center;gap:6px}
.mathrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-family:var(--m);font-size:12px;color:var(--dim);padding:11px 13px;border-radius:12px;
  background:var(--row)}
.mathrow b{color:var(--cream);font-weight:500;font-size:15px}
.prline{padding:10px 12px;border-radius:12px;font-size:12.5px;line-height:1.45;background:var(--deep);
  border-left:3px solid var(--line)}
.cta{width:100%;border-radius:14px;padding:17px 0;background:var(--greenF);color:var(--onGreen);
  font-family:var(--d);font-size:16px}
.cta.alt{background:var(--cobaltF);color:var(--onCobalt)}
.ghost{border-radius:10px;padding:10px 13px;background:var(--row);color:var(--cream);
  border:none;font-family:var(--m);font-size:12px}
.ghost.wide{width:100%}
.gatechip{display:block;width:100%;border-radius:12px;padding:11px 13px;background:var(--row);
  border:none;color:var(--cream);font-family:var(--m);font-size:12px;text-align:left;line-height:1.5}

/* ══════════════════ BOSSES ══════════════════ */
.roster{display:grid;grid-template-columns:1fr;column-gap:26px}
@media (min-width:900px){ .roster{grid-template-columns:1fr 1fr} }
.acthead{grid-column:1/-1;font-family:var(--d);font-size:12px;color:var(--gold);
  margin:20px 0 4px;letter-spacing:.04em}
.acthead:first-child{margin-top:0}
.brow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.brow.done{opacity:.45}
.brow.done .bname{text-decoration:line-through}
.brow.cur{background:var(--row);border-radius:12px;padding:12px;border-bottom:none;margin:4px 0}
.bnum{font-family:var(--m);font-size:11px;color:var(--dim);flex:none;width:22px}
.bname{font-family:var(--d);font-size:12px;line-height:1.3}

/* ══════════════════ WEEK ══════════════════ */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wday{text-align:center;border-radius:11px;padding:10px 1px;background:var(--row);
  font-family:var(--m);font-size:10.5px;color:var(--dim);line-height:1.7}
.wday.p{background:var(--panel2);color:var(--cream)}
.wday.f{background:var(--greenF);color:var(--onGreen)}
.wday.today{outline:2px solid var(--gold);outline-offset:1px;color:var(--cream)}
.daysep{display:flex;align-items:center;gap:10px;margin:16px 0 9px;font-family:var(--m);
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.daysep:first-child{margin-top:0}
.daysep .ln{flex:1;height:1px;background:var(--line)}

/* ══════════════════ FORMS & BANNERS ══════════════════ */
input[type=text],input[type=number]{background:var(--deep);color:var(--cream);
  border:1px solid var(--line);border-radius:11px;padding:11px;font-family:var(--m);font-size:14px}
input::placeholder{color:var(--dim);opacity:1}
.banner{display:flex;align-items:flex-start;gap:11px;border-radius:13px;padding:13px 14px;
  background:var(--goldF);color:var(--onGold);font-size:13px;line-height:1.5}
.banner .ic{margin-top:1px}
.banner.warn{background:var(--redF);color:var(--onRed)}
.banner.info{background:var(--panel2);color:var(--cream)}
.banner .ghost{display:inline-block;margin-top:9px;background:rgba(0,0,0,.14);color:inherit}

/* ══════════════════ MOTION ══════════════════
   Entrance motion only runs under #app.enter, which render() sets when the
   view actually changed. Everything else here is press/hover feedback or a
   one-shot flagged through U.fx. */
@keyframes cardin{from{opacity:0;transform:translateY(12px)}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes tabin{from{transform:scale(.9);opacity:.5}}
#app.enter .card,#app.enter .statstrip{animation:cardin .36s var(--easeout) both}
#app.enter .col>.card:nth-child(2){animation-delay:.06s}
#app.enter .col>.card:nth-child(3){animation-delay:.12s}
#app.enter .col>.card:nth-child(4){animation-delay:.18s}
#app.enter .col>.card:nth-child(5){animation-delay:.24s}
#app.enter .fill{animation:growx .75s .1s var(--easeout) both}
#app.enter .tab.on{animation:tabin .3s var(--easeout) both}
#app.enter .prbadge{animation:badgein .35s var(--easeout) both}
@keyframes badgein{from{transform:scale(.4);opacity:0}}

/* a bar that knows where it came from animates the gap it just closed */
@keyframes widthto{from{width:var(--from)}}
.fill.animw{animation:widthto .9s var(--easeout) both}

@keyframes bump{40%{transform:scale(1.09)}}
input.sval.bump{animation:bump .28s var(--ease)}

@keyframes popbox{0%{transform:scale(.4);opacity:.3}55%{transform:scale(1.22)}100%{transform:scale(1)}}
.objbox.justdone{animation:popbox .5s cubic-bezier(.2,1.5,.4,1) both}

@keyframes reveal{from{opacity:0;transform:translateY(-7px)}}
.help.reveal,.expand.reveal{animation:reveal .24s var(--easeout) both}

/* press + hover feedback survives re-renders because it is pure CSS state */
.tab,.filt,.gchip,.exchip,.qchip,.ghost,.cta,.sbtn,.theme-pill,.hbtn,.seg button,
.gatechip,.kvi,button.li,.objrow{
  transition:background-color .18s var(--ease),color .18s var(--ease),
             border-color .18s var(--ease),box-shadow .18s var(--ease),
             filter .18s var(--ease),transform .1s var(--ease)}
.cta:active{transform:scale(.985)}
.sbtn:active{transform:scale(.9)}
.tab:active,.filt:active,.gchip:active,.exchip:active,.ghost:active,.qchip:active,
.hbtn:active,.theme-pill:active,.gatechip:active,.kvi:active{transform:scale(.96)}
button.li:active,.objrow:active{transform:scale(.995)}
@media (hover:hover){
  button.li:hover,.objrow:hover,.gatechip:hover{background:var(--row)}
  .filt:not(.on):hover,.qchip:hover,.ghost:hover,.exchip:not(.on):hover,
  .hbtn:not(.on):hover,.seg button:not(.on):hover{background:var(--panel2)}
  .tab:not(.on):hover{color:var(--cream);background:var(--row)}
  .gchip:hover,.cta:hover,.filt.on:hover,.tab.on:hover{filter:brightness(1.07)}
  .theme-pill:not(.active):hover{background:var(--row)}
}

/* ══════════════════ DEFEAT SEQUENCE ══════════════════
   The overlay always draws on a dark scrim, so it pins its own dark token
   set - otherwise the light themes would paint dark ink onto it. */
#fx{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 45%,rgba(0,232,140,.20),rgba(10,8,26,0) 62%),#0A0818;
  padding:24px;text-align:center;overflow:hidden;color:var(--cream);
  --cream:#F5F2FF; --dim:#C6BEE8; --night:#12102B;
  --gold:#FFC93F; --goldF:#FFC93F; --onGold:#241B00;
  --green:#3DEFA7; --greenF:#00E88C; --magenta:#FF7ABA;
  --line:rgba(255,255,255,.24); --row:rgba(255,255,255,.07)}
#fx.on{display:flex}
.shake{animation:shake .65s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.slam{animation:slam .6s cubic-bezier(.2,1.5,.3,1) both}
@keyframes slam{0%{transform:scale(2.7);opacity:0;letter-spacing:.45em;filter:blur(7px)}
  55%{opacity:1}100%{transform:scale(1);opacity:1;letter-spacing:.01em;filter:blur(0)}}
.ring{position:absolute;border-radius:50%;border:2px solid var(--greenF);animation:ring 1.2s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes ring{from{width:0;height:0;opacity:.95}to{width:150vmax;height:150vmax;opacity:0}}
.spark{position:absolute;width:7px;height:7px;border-radius:2px;animation:spark 1.2s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes spark{from{transform:translate(0,0) scale(1.2) rotate(0);opacity:1}
  to{transform:translate(var(--dx),var(--dy)) scale(.15) rotate(220deg);opacity:0}}
.fxcard{position:relative;z-index:2;max-width:340px}
.rise{animation:rise .55s .3s both}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.fxpill{display:inline-block;border-radius:999px;padding:5px 12px;background:var(--row);
  font-family:var(--m);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.actban{display:inline-block;border-radius:12px;padding:11px 18px;background:var(--goldF);color:var(--onGold);
  font-family:var(--d);font-size:13px;transform-origin:center;animation:sweepin .75s .4s both}
@keyframes sweepin{from{transform:scaleX(.04) skewX(-18deg);opacity:0}}
.crack{height:14px;margin:14px 0;border-radius:99px;background:linear-gradient(90deg,var(--greenF),var(--goldF),var(--magentaF));
  animation:crack .7s cubic-bezier(.6,0,.9,.2) forwards}
@keyframes crack{0%{transform:scaleX(1);opacity:1}70%{transform:scaleX(1.05);opacity:1}
  100%{transform:scaleX(0);opacity:0}}
.tapdis{animation:fadein 1s 1.3s both}
@keyframes fadein{from{opacity:0}}
.pop{animation:pop .4s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.86);opacity:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const paceDays = () => (S && S.pace) || 7;
const bossHp = i => Math.round(baseWeek()*(paceDays()/7)*demandMult(i)/10)*10;

  const k=i-ROSTER.length;
  return {i,name:"The Ceiling +"+(k+1),gate:ENDLESS[k%ENDLESS.length],flavor:"Nobody has cleared this one yet.",
    hp:Math.round(bossHp(99)*Math.pow(1.12,k+1)*(ENDLESS[k%ENDLESS.length]&&ENDLESS[k%ENDLESS.length].time?HOLD_HP:1)/50)*50, act:"XI · Endless"};
}

const TASKS=[
 {t:"set_reps", mk:(T,p)=>({target:12+T*2, label:`One set of ${12+T*2}+ reps · ${p.label}`})},

 {t:"distinct", mk:(T,p)=>({target:Math.min(6,3+Math.floor(T/3)), label:`${Math.min(6,3+Math.floor(T/3))} different ${p.label} exercises`})},

function baseTonnage(S){

function makeDaily(S,k){
  const dow=dowOf(k), p=PLAN[dow], W=weekIndex(S,k), T=Math.min(9,Math.floor(W/2));
  const quota=Math.max(400, Math.round(baseTonnage(S)*.6*(1+.02*Math.min(W,25))/10)*10);

function migrate(o){

/* ══════════════════ DETRAINING ══════════════════

function decayRate(off){ return Math.min(.10, .02+.01*(off-1)); }
function applyDecay(){
  const t=dayNum(dayKey());
  if(!S.lastDay){ S.decayedThrough=t; return null; }
  const last=dayNum(S.lastDay);
  const from=Math.max(last+2,(S.decayedThrough||last)+1);
  if(t<from){ S.decayedThrough=Math.max(S.decayedThrough||0,t); return null; }
  const floor=Math.floor(S.ci/10)*10;
  let healed=0; const revived=[];
  for(let d=from; d<=t; d++){
    const heal=Math.round(bossAt(S.ci).hp*decayRate(d-last));
    healed+=heal; S.cd-=heal;
    while(S.cd<0){
      if(S.ci<=floor){ S.cd=0; break; }
      S.ci--; revived.push(bossAt(S.ci).name); S.cd=bossAt(S.ci).hp+S.cd;
    }
  }
  S.decayedThrough=t; S.streak=0;
  return {days:t-last,healed,revived,atFloor:S.ci<=floor&&S.cd===0};
}
function restStatus(){
  if(!S.lastDay) return {t:"new",msg:"Nothing logged yet. The clock starts on your first set."};
  const gap=dayNum(dayKey())-dayNum(S.lastDay);
  if(gap===0) return {t:"ok",msg:"Trained today. Nothing decays."};
  if(gap===1) return {t:"grace",msg:"Rest day — free. Miss tomorrow too and the boss starts healing."};
  return {t:"decay",msg:`${gap} days off. ${bossAt(S.ci).name} is healing ${Math.round(decayRate(gap)*100)}% of its HP a day.`};
}
function logSet(){
  const ex=byId(U.ex), sides=sidesNow(), {ton,prk}=computeSet(ex,S.bw,U.sets,U.reps,U.load,sides);
  if(ton<=0) return;
  const today=dayKey();
  if(S.lastDay!==today) S.streak = S.lastDay===yKey() ? S.streak+1 : 1;
  S.lastDay=today; S.decayedThrough=dayNum(today); S.away=null;
  updateCalibration();
  rollDaily();
  /* snapshot the bars before any of this lands, so they animate the distance */
  const hpFrom=(bossAt(S.ci).hp-S.cd)/bossAt(S.ci).hp*100;
  const objFrom=S.daily.objs.map(o=>{const v=progressOf(o,S.daily.acc);
    return o.t==="pr"?(v?100:0):Math.min(100,v/o.target*100);});
  const popObj=[];

  /* records */
  const rec=S.records[ex.id]||{};
  const units = ex.mode==="time" ? U.reps/SEC_PER_REP : U.reps;
  const setVol=Math.round(prk*units), est=e1rm(prk,units);
  const broke=[];
  const nr={load:rec.load||0,loadD:rec.loadD,reps:rec.reps||0,repsD:rec.repsD,
            vol:rec.vol||0,volD:rec.volD,e1rm:rec.e1rm||0,e1rmD:rec.e1rmD,
            n:rec.n||0,last:rec.last,seen:(rec.seen||0)+1};
  if(prk>nr.load){ nr.load=prk; nr.loadD=today; broke.push("load"); }
  if(U.reps>nr.reps){ nr.reps=U.reps; nr.repsD=today; broke.push(ex.mode==="time"?"hold":"reps"); }
  if(setVol>nr.vol){ nr.vol=setVol; nr.volD=today; broke.push("set volume"); }
  if(est>nr.e1rm){ nr.e1rm=est; nr.e1rmD=today; broke.push("est. 1RM"); }
  if(broke.length){
    nr.n+=broke.length; nr.last=today; S.power++;
    S.prLog=[{d:today,ex:ex.id,k:broke.slice(),prk,reps:U.reps},...(S.prLog||[])].slice(0,80);
  }
  S.records[ex.id]=nr;

  let dmg=Math.round((ton/5)*(1+Math.min(S.power,60)*.01)*flowMult(S.streak));

  /* daily accumulators */
  const p=PLAN[S.daily.dow], inFocus=p.gs.includes(ex.g), a=S.daily.acc;
  a.ton+=ton;
  if(ex.mode==="time") a.sec+=U.reps*U.sets*sides;
  if(broke.length) a.pr=true;
  if(inFocus){
    a.focusTon+=ton; a.sets+=U.sets;
    if(ex.mode!=="time") a.reps+=U.reps*U.sets*sides;
    if(!a.ex.includes(ex.id)) a.ex.push(ex.id);
    if(ex.mode!=="time" && U.reps>a.bestSetReps) a.bestSetReps=U.reps;
    if(prk>a.bestLoad) a.bestLoad=prk;
  }

  /* objectives */
  let bounty=0; const finished=[];
  S.daily.objs.forEach((o,i)=>{
    if(!o.done && progressOf(o,a)>=o.target){ o.done=true; bounty+=o.reward; finished.push(o.label); popObj.push(i); }
  });
  let perfect=false;
  if(!S.daily.perfect && S.daily.objs.every(o=>o.done)){
    S.daily.perfect=true; perfect=true; bounty+=Math.round(S.daily.quota/2);
  }

  /* week ledger */
  const wk=mondayOf(today);
  if(!S.weeks[wk]) S.weeks[wk]=[0,0,0,0,0,0,0];
  S.weeks[wk][S.daily.dow]=Math.max(S.weeks[wk][S.daily.dow], S.daily.perfect?2:1);
  let weekBonus=0;
  if(S.weeks[wk].every(v=>v===2) && !S.weeks[wk+":paid"]){
    S.weeks[wk+":paid"]=true; S.perfectWeeks++; S.power+=2; weekBonus=S.daily.quota*3; bounty+=weekBonus;
  }

  /* campaign damage */
  const boss=bossAt(S.ci);
  const pass=gatePass(boss.gate,{g:ex.g,mode:ex.mode,reps:U.reps,prk});
  const applied=Math.round(dmg*(pass?1:.25))+bounty;
  S.cd+=applied; S.totalTon+=ton;
  const cleared=[];
  while(S.cd>=bossAt(S.ci).hp){
    const b=bossAt(S.ci); S.cd-=b.hp; S.ci++; const nb=bossAt(S.ci);
    cleared.push(b.name);
    FXQ.push({n:b.i+1,name:b.name,flavor:b.flavor,
      act:(b.i<ROSTER.length && (b.i+1)%10===0) ? ACT_NAMES[Math.floor(b.i/10)] : null,
      next:nb.name,nextHp:nb.hp,nextGate:gateText(nb.gate)});
  }
  if(S.ci>S.peak) S.peak=S.ci;

  S.last[ex.id]={sets:U.sets,reps:U.reps,load:U.load,sd:U.sd};
  S.log.unshift({d:today,t:Date.now(),ex:ex.id,sets:U.sets,reps:U.reps,load:U.load,sd:U.sd,prk,ton,dmg,ap:applied,
    pr:broke.length?broke.slice():null});
  S.log=S.log.slice(0,900);

  U.flash={ton,dmg,applied,pass,bounty,cleared,broke,finished,perfect,weekBonus,boss:boss.name};
  /* a cleared boss swaps the bar for a different fight, so do not travel it */
  U.fx={objFrom,popObj,hpFrom:cleared.length?null:hpFrom};
  startRest(90);
  persist(); publish(); render();
  if(FXQ.length) playFx();
}

function startRest(n){ U.rest=n; clearInterval(U.restT);
  U.restT=setInterval(()=>{ U.rest--; if(U.rest<=0){clearInterval(U.restT);U.rest=0;} paintRest(); },1000); }
function paintRest(){ const e=document.getElementById("restBtn"); if(!e) return;
  if(U.rest<=0){ e.style.display="none"; return; }
  e.textContent=`rest ${Math.floor(U.rest/60)}:${pad(U.rest%60)} — tap to skip`; }

/* ══════════════════ DEFEAT SEQUENCE ══════════════════ */
const FXQ=[]; let FXT=null;
const REDUCE=()=>window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function playFx(){
  if(!FXQ.length) return;
  const it=FXQ.shift(), el=document.getElementById("fx"), r=REDUCE();
  let sparks="";
  if(!r){
    const cols=["#00E88C","#FFC53D","#FF3D9A","#3D6BFF","#F2EDFF"];
    for(let i=0;i<30;i++){
      const a=(i/30)*Math.PI*2+Math.random()*.4, d=150+Math.random()*280;
      sparks+=`<div class="spark" style="--dx:${(Math.cos(a)*d).toFixed(0)}px;--dy:${(Math.sin(a)*d).toFixed(0)}px;`
        +`background:${cols[i%5]};animation-delay:${(Math.random()*.2).toFixed(2)}s"></div>`;
    }
  }
  el.innerHTML=`${r?"":`<div class="ring"></div><div class="ring" style="animation-delay:.18s;border-color:var(--gold)"></div>`}${sparks}
    <div class="fxcard">
      <div class="fxpill" style="color:var(--green)">boss ${it.n} of 100 defeated</div>
      <div class="disp ${r?"":"slam"}" style="font-size:29px;margin:12px 0 0">${esc(it.name.toUpperCase())}</div>
      ${r?"":`<div class="crack"></div>`}
      <div class="rise muted">${esc(it.flavor)}</div>
      ${it.act?`<div style="margin-top:16px"><div class="actban">ACT ${esc(it.act.split(" · ")[0])} COMPLETE · ${esc(it.act.split(" · ")[1].toUpperCase())}</div></div>`:""}

      <div class="rise" style="margin-top:20px">
        <div class="fxpill">now entering</div>
        <div class="disp" style="font-size:18px;color:var(--gold);margin-top:5px">${esc(it.next.toUpperCase())}</div>
        <div class="mono" style="font-size:13px;color:var(--dim);margin-top:5px">${fmt(it.nextHp)} HP · ${esc(it.nextGate)}</div>
      </div>
      <div class="tapdis mono" style="font-size:12px;color:var(--dim);margin-top:22px">tap anywhere to continue</div>
    </div>`;
  el.classList.add("on");
  if(!r){ const app=document.getElementById("app");
    app.classList.add("shake"); setTimeout(()=>app.classList.remove("shake"),700); }
  clearTimeout(FXT); FXT=setTimeout(dismissFx, it.act?7000:4600);
}
function dismissFx(){
  clearTimeout(FXT);
  const el=document.getElementById("fx"); el.classList.remove("on"); el.innerHTML="";
  if(FXQ.length) setTimeout(playFx,200); else render();
}
document.getElementById("fx").addEventListener("click",dismissFx);

/* ══════════════════ EXPORT / IMPORT ══════════════════ */
function exportSave(){
  S.lastExport=Date.now(); persist();
  const blob=new Blob([JSON.stringify({app:"liftmania",ver:3,exported:dayKey(),save:S},null,1)],{type:"application/json"});
  const a=document.getElementById("dl");
  a.href=URL.createObjectURL(blob); a.download=`liftmania-${MP.me?MP.me.id:"save"}-${dayKey()}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000); render();
}
function loadSaveObj(o){
  if(o && (o.app==="liftmania"||o.app==="iron-run") && o.save) o=o.save;
  if(!o || typeof o!=="object" || !("log" in o)) { alert("That file isn't a LiftMania save."); return; }
  S=migrate(o); applyDecay(); rollDaily(); persist(); U.tab="train"; render();
  alert("Save restored.");
}
document.getElementById("fileIn").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ loadSaveObj(JSON.parse(r.result)); }catch(x){ alert("Couldn't read that file."); } };
  r.readAsText(f); e.target.value="";
});

    + `style="width:${clamp(pct)}%;background:${color}${anim?`;--from:${clamp(from)}%`:""}"></div></div>`;

const ico=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||""}</svg>`;

/* "2h", "3d" — the crew feed needs shorter stamps than agoText gives */
function relT(ms){
  if(!ms) return "";
  const s=(Date.now()-ms)/1000;
  if(s<90) return "now";
  if(s<5400) return Math.max(1,Math.round(s/60))+"m";
  if(s<172800) return Math.round(s/3600)+"h";
  return Math.round(s/86400)+"d";
}
/* "4×12 @ 16kg" — one line that describes a logged set anywhere it appears */
function setDesc(r){
  const e=byId(r.ex);
  return `${r.sets}×${e.mode==="time"?r.reps+"s":r.reps}`
    + (hasLoad(e)?` @ ${r.load}kg`:"")
    + (r.sd==="each"?" /side":"");
}

/* one-shot animation flags, set by a handler and consumed by the next render */
let FX={}, lastView=null;

/* Every card is one icon, one title, and content. Prose lives behind the ?
   and is shut by default — that is what keeps the screens from being walls. */
function card(o){
  return `<section class="card" style="--accent:${o.accent||"var(--gold)"}">
    <div class="chead">
      ${o.icon?`<span class="cicon">${ico(o.icon)}</span>`:""}
      <h2 class="ctitle${o.big?" big":""}">${esc(o.title)}</h2>
      ${o.meta?`<div class="cmeta">${o.meta}</div>`:""}
      ${o.help?`<button class="hbtn ${U.help[o.k]?"on":""}" data-a="help" data-k="${o.k}" title="What is this?" aria-label="What is this?">?</button>`:""}
    </div>
    ${o.sub?`<div class="csub">${o.sub}</div>`:""}
    ${o.help&&U.help[o.k]?`<div class="help${FX.help===o.k?" reveal":""}">${o.help}</div>`:""}
    ${o.body?`<div class="body">${o.body}</div>`:""}
  </section>`;
}
const cols=(a,b)=>`<div class="cols"><div class="col">${a}</div><div class="col">${b}</div></div>`;
const qualList=(list,note)=>`<div class="expand${FX.expand?" reveal":""}">
  ${note?`<div class="mini" style="margin-bottom:9px">${esc(note)}</div>`:""}
  <div>${list.map(e=>`<button class="qchip" data-a="jump" data-e="${e.id}">${esc(e.n)} ${exTag(e)}</button>`).join("")}</div></div>`;
const stepper=(label,field,step,min)=>`
 <div class="stepper"><span class="slabel">${label}</span><div class="srow">
   <button class="sbtn" data-a="dec" data-f="${field}" data-s="${step}" data-min="${min}">−</button>
   <input class="sval${FX.bump===field?" bump":""}" id="st_${field}" inputmode="decimal" autocomplete="off" value="${U[field]}">
   <button class="sbtn" data-a="inc" data-f="${field}" data-s="${step}">+</button>
 </div></div>`;

/* ══════════════════ ACTIVITY ══════════════════
   Everyone's last few sets ride along inside the board card they already
   push, so the feed needs no extra table and no extra request. */
function feedItems(withMe){
  const out=[];
  Object.values(MP.board).forEach(pl=>{
    const mine=MP.me&&pl.id===MP.me.id;
    if(mine&&!withMe) return;
    (pl.recent||[]).forEach(r=>{ if(hasEx(r.ex)) out.push(Object.assign({},r,{who:pl.name||pl.id,mine})); });
  });
  return out.sort((a,b)=>(b.t||0)-(a.t||0));
}
function feedRow(it){
  const e=byId(it.ex);
  return `<div class="fr">
    <div class="av ${it.mine?"me":""}">${esc(initial(it.who))}</div>
    <div class="ftxt"><b>${esc(it.mine?"You":it.who)}</b> · ${esc(e.n)}
      <span class="lsub">${setDesc(it)} · ${fmt(it.ton||0)}kg${it.pr&&it.pr.length?`<span class="prbadge">PR ${esc(it.pr.join(" · "))}</span>`:""}</span></div>
    <div class="ftime">${relT(it.t)}</div>
  </div>`;
}
const todaySets=()=>{const k=dayKey();return (S.log||[]).filter(r=>r.d===k);};

/* ══════════════════ RENDER ══════════════════ */
const TABS=[["train","TRAIN","dumbbell"],["week","WEEK","cal"],["bosses","BOSSES","skull"],
            ["crew","CREW","users"],["you","YOU","trophy"]];

function render(){
  rollDaily();
  FX=U.fx||{}; U.fx=null;
  const ex=byId(U.ex), boss=bossAt(S.ci), p=PLAN[S.daily.dow];
  let h=topBar()+tabBar()+alerts();
  if(U.tab==="train")  h+=tabTrain(ex,boss,p);
  else if(U.tab==="week")   h+=tabWeek();
  else if(U.tab==="bosses") h+=tabBosses();
  else if(U.tab==="crew")   h+=tabCrew();
  else if(U.tab==="you")    h+=tabYou();
  const app=document.getElementById("app");
  /* only a genuine view change earns the entrance run - otherwise every tap on
     a stepper would replay the whole page */
  app.className = lastView===U.tab ? "" : "enter";
  lastView=U.tab;
  app.innerHTML=h;
  wireInputs();
  paintRest();
}

function topBar(){
  return `<header class="topbar">
    <div class="brandline">
      <div class="brand">LIFTMANIA</div>
      <div class="mini" style="margin-top:3px">${esc((MP.me&&MP.me.name)||"guest")}</div>
    </div>
    <div class="themebox">${THEMES.map(t=>
      `<button class="theme-pill ${U.theme===t.id?"active":""}" data-a="theme" data-v="${t.id}" title="${t.title}" aria-label="${t.title}">${t.label}</button>`).join("")}</div>
  </header>`;
}
/* streak and power are damage modifiers on the set you are about to log, so
   they belong with the training screen rather than above the navigation */
function statStrip(){
  return `<div class="statstrip">
    <div class="stat" style="--accent:var(--gold)">${ico("flame")}
      <span class="sv"><b>${S.streak}d <i>×${flowMult(S.streak).toFixed(2)}</i></b><span class="k">streak</span></span></div>
    <div class="stat" style="--accent:var(--green)">${ico("bolt")}
      <span class="sv"><b>${S.power} <i>+${Math.min(S.power,60)}%</i></b><span class="k">power</span></span></div>
    <div class="stat" style="--accent:var(--cobalt)">${ico("weight")}
      <span class="sv"><b>${fmtK(S.totalTon)} <i>kg</i></b><span class="k">lifted</span></span></div>
  </div>`;
}
function tabBar(){
  return `<nav class="tabs">${TABS.map(t=>
    `<button class="tab ${U.tab===t[0]?"on":""}" data-a="tab" data-t="${t[0]}">${ico(t[2])}<span>${t[1]}</span></button>`).join("")}</nav>`;
}
/* only genuinely urgent things sit above the content; everything else has a home */
function alerts(){
  let h="";
  if(S.away){const w=S.away;
    h+=`<div class="banner warn">${ico("alert")}<div><b>Detrained — ${w.days} days off.</b> ${esc(bossAt(S.ci).name)} regained ${fmt(w.healed)} HP${w.revived.length?`, pushing you back onto ${esc(w.revived[w.revived.length-1])}`:""}. Log one set today to stop it.
      <button class="ghost" data-a="dismissaway">got it</button></div></div>`;}
  if(STORE.mode==="memory")
    h+=`<div class="banner warn">${ico("alert")}<div>This browser is blocking storage. Progress will vanish when you close the tab — download a backup from YOU after every session.</div></div>`;
  else if(MP.status==="error")
    h+=`<div class="banner warn">${ico("alert")}<div>Not syncing: ${esc(MP.err||"server unreachable")}. Your training is still saved on this device.</div></div>`;
  return h;
}

/* ══════════════════ TAB · TRAIN ══════════════════ */
function tabTrain(ex,boss,p){
  /* ── today's three missions ── */
  const done=S.daily.objs.filter(o=>o.done).length;
  const missions=card({
    title:"Today's missions", icon:"target", k:"daily", accent:"var(--gold)",
    meta:`${done}/3`,
    sub:`${DOWL[S.daily.dow]} · ${esc(p.name)} · ${esc(p.label)}`,
    help:`Three missions refresh every day and follow the muscle groups on today's plan. Each one you finish pays a <b>bounty</b> straight into the boss's health bar. Tap a mission to see exactly which exercises count toward it.`,
    body:`<div class="list">${S.daily.objs.map((o,i)=>{
      const v=progressOf(o,S.daily.acc), open=U.openObj===i;
      return `<button class="objrow ${o.done?"done":""}" data-a="obj" data-i="${i}">
        <span class="objbox${o.done&&(FX.popObj||[]).includes(i)?" justdone":""}">${o.done?"✓":i+1}</span>
        <span class="objtxt">
          <span class="objlab">${esc(o.label)}</span>
          <span class="objbar">${bar(o.t==="pr"?(v?100:0):v/o.target*100,o.done?"var(--greenF)":gcol(p.gs[0]),5,FX.objFrom&&FX.objFrom[i])}</span>
          <span class="lsub">${fmtProg(o,v)} · +${fmt(o.reward)} bounty · ${open?"hide":"what counts?"}</span>
        </span>
      </button>${open?qualList(objQualifiers(o,p,S.bw),OBJ_HINT[o.t]):""}`;
    }).join("")}</div>
    <div class="mini" style="margin-top:12px">All three → <b>+${fmt(Math.round(S.daily.quota/2))}</b> perfect-day bonus.</div>`
  });

  /* ── the boss ── */
  const out=weeklyOut(), eta=bossEta(), need=Math.round(boss.hp/paceDays()*7), ok=out>=need;
  const bossCard=card({
    title:boss.name, big:true, icon:"skull", k:"boss", accent:"var(--cobalt)",
    meta:`${S.ci+1}/100`,
    sub:`${esc(boss.act)} · ${esc(boss.flavor)}`,
    help:`Boss health is a week of <b>your</b> output, measured over your first six training days and then locked. Every kilo you move chips it down; mission bounties hit it too. Miss two days in a row and it starts healing.`,
    body:`
      <div class="mathrow"><span>hp remaining</span><span><b>${fmt(boss.hp-S.cd)}</b> / ${fmt(boss.hp)}</span></div>
      <div style="margin-top:10px">${bar((boss.hp-S.cd)/boss.hp*100,"linear-gradient(90deg,var(--cobaltF),var(--cobalt))",10,FX.hpFrom)}</div>
      <div class="kv" style="margin-top:12px">
        <div class="kvi"><span class="k">asks</span><b>${fmtK(need)}</b><span class="k2">kg / week</span></div>
        <div class="kvi"><span class="k">you make</span><b style="color:${ok?"var(--green)":"var(--gold)"}">${out?fmtK(out):"—"}</b><span class="k2">kg / week</span></div>
        <div class="kvi"><span class="k">falls in</span><b style="color:${eta&&eta<=paceDays()+2?"var(--green)":"var(--gold)"}">${eta?eta+"d":"—"}</b><span class="k2">${eta?"at this rate":"log some sets"}</span></div>
      </div>
      ${!S.calLocked?`<div class="mini" style="margin-top:10px;color:var(--magenta)">Calibrating · ${calDaysDone()}/${CAL_DAYS} training days.</div>`:""}
      <button class="gatechip" data-a="gate" style="margin-top:11px">
        <span style="color:var(--dim)">${boss.gate?"full damage only from":"every set lands in full"}</span>
        <b style="display:block;color:${boss.gate?"var(--magenta)":"var(--green)"}">${gateText(boss.gate)}</b>
        <span style="color:var(--dim)">${U.openGate?"tap to hide":"tap to see what hits it"}</span></button>
      ${U.openGate?qualList(gateQualifiers(boss.gate,S.bw),
        boss.gate?(boss.gate.minReps?`Only sets of ${boss.gate.minReps}+ reps land in full. Anything shorter chips for 25%.`
        :boss.gate.minLoad?`Each rep must carry ${boss.gate.minLoad}kg or more. Lighter sets chip for 25%.`
        :boss.gate.time?"Only timed holds land in full. Holds can't move the tonnage a dynamic lift does, so this boss carries about a quarter of the usual HP."
        :"Anything else chips for 25%.")
        :"No restriction — every set lands in full."):""}`
  });

  /* ── the logger ── */
  const logger=card({
    title:"Log a set", icon:"dumbbell", k:"logger", accent:"var(--green)",
    meta:esc(GROUPS[U.group].name),
    help:`<div class="legend">
      <span><span class="tag hold">HOLD</span> timed — you log seconds, not reps</span>
      <span><span class="tag kg">KG</span> you set the weight yourself</span>
      <span><span class="tag bw">BW</span> your bodyweight, scaled by leverage</span>
      <span><span class="side" style="color:var(--magenta);font-family:var(--m)">×2</span> log one side only — both get counted</span>
      <span><span class="swatch"></span> gold outline — damages the current boss</span>
      <span><span style="color:var(--gold);font-weight:700">●</span> on a muscle — something in it counts today</span></div>`,
    body:loggerBody(ex)
  });

  /* ── what you logged today ── */
  const ts=todaySets(), tton=ts.reduce((a,r)=>a+r.ton,0);
  const logged=card({
    title:"Logged today", icon:"receipt", k:"logged", accent:"var(--magenta)",
    meta:ts.length?`${ts.length} · ${kgs(tton)}`:"none yet",
    body:ts.length?`<div class="list">${ts.slice(0,8).map(r=>{
      const e=byId(r.ex);
      return `<button class="li" data-a="jump" data-e="${r.ex}">
        <span class="ldot" style="background:${gcol(e.g)}"></span>
        <span class="lmain"><span class="lname">${esc(e.n)}${r.pr&&r.pr.length?`<span class="prbadge">PR</span>`:""}</span>
          <span class="lsub">${setDesc(r)} · ${r.prk}kg per rep</span></span>
        <span class="lval">${fmt(r.ton)}<span class="u">kg</span></span></button>`;}).join("")}</div>
      ${ts.length>8?`<div class="mini" style="margin-top:10px">+ ${ts.length-8} more — full log in WEEK.</div>`:""}`
      :`<div class="empty">Nothing yet today. Your first set starts the streak.</div>`
  });

  /* ── what the crew just did ── */
  const feed=feedItems(false).slice(0,3);
  const crew=feed.length?card({
    title:"Crew, just now", icon:"users", accent:"var(--cobalt)",
    meta:`<button class="ghost" data-a="tab" data-t="crew" style="padding:4px 9px">see all</button>`,
    body:`<div class="list">${feed.map(feedRow).join("")}</div>`
  }):"";

  const rest=`<button id="restBtn" class="ghost wide" style="display:${U.rest>0?"block":"none"}" data-a="skiprest">rest</button>`;
  return statStrip() + cols(missions+bossCard+crew, logger+logged) + rest + (U.flash?flashCard(U.flash):"");
}

function loggerBody(ex){
  const cs=computeSet(ex,S.bw,U.sets,U.reps,U.load,sidesNow());
  const gq=gateQualifiers(bossAt(S.ci).gate,S.bw);
  let list=EX.filter(e=>e.g===U.group);
  if(U.only) list=list.filter(countsNow);
  const each=U.sd==="each", opt=ex.s==="opt";
  const pv=prPreview(ex,U.sets,U.reps,U.load), r=S.records[ex.id]||{};

  let status;
  if(pv.fresh) status=`<div class="prline" style="border-color:var(--green);color:var(--green)">First entry — this sets all four records.</div>`;
  else if(pv.hits.length) status=`<div class="prline" style="border-color:var(--gold);color:var(--gold)"><b>PR incoming:</b> ${pv.hits.map(x=>`${x.label} ${x.cur}${x.u}`).join(" · ")}</div>`;
  else{ const c=pv.closest, gap=Math.round((c.best-c.cur)*10)/10;
    status=gap<=0
      ? `<div class="prline" style="border-color:var(--cobalt)">Level with your <b>${c.label}</b> PB of ${c.best}${c.u}. One more and it's yours.</div>`
      : `<div class="prline">Closest record: <b style="color:var(--cream)">${c.label}</b> — need ${c.k==="reps"?`${gap+1} more`:`${gap}${c.u} more`} to beat ${c.best}${c.u}</div>`; }

  return `
    <div class="gchips">${GK.map(g=>{
      const flag=EX.some(e=>e.g===g&&countsNow(e));
      return `<button class="gchip" data-a="group" data-g="${g}"
        style="${U.group===g?`background:${gcol(g)};color:var(--onGroup)`:""}">${GROUPS[g].name}${flag?`<span class="cnt" style="${U.group===g?"color:var(--onGroup)":""}">●</span>`:""}</button>`;}).join("")}</div>

    <div class="chiprow" style="margin-top:10px">
      <button class="filt ${U.only?"on":""}" data-a="only">${U.only?"✓ only what counts today":"only what counts today"}</button>
    </div>

    <div class="exwrap" style="margin-top:10px">${
      list.length?list.map(e=>`<button class="exchip ${U.ex===e.id?"on":""} ${gq.includes(e)?"hit":""}" data-a="ex" data-e="${e.id}">${esc(e.n)} ${exTag(e)}${sideMode(e)==="each"?`<span class="side">×2</span>`:""}</button>`).join("")
      :`<div class="empty">Nothing in ${GROUPS[U.group].name} counts right now. Muscles with a ● do.</div>`}</div>

    <div class="steppers" style="margin-top:15px">
      ${stepper("sets","sets",1,1)}
      ${stepper(ex.mode==="time"?(each?"sec / side":"seconds"):(each?"reps / side":"reps"),"reps",ex.mode==="time"?5:1,1)}
      ${hasLoad(ex)?stepper(ex.mode==="bwload"?"added kg":(each?"kg / side":"kg"),"load",S.wstep,0):""}
    </div>

    <div class="chiprow" style="margin-top:10px">
      ${hasLoad(ex)?`<span class="mini">step</span>${[0.5,1,2.5,5].map(v=>
        `<button class="filt ${S.wstep===v?"on":""}" data-a="wstep" data-v="${v}">${v}</button>`).join("")}`:""}
      ${opt?`<div class="seg" style="margin-left:auto">
        <button class="${!each?"on":""}" data-a="side" data-v="both">both sides</button>
        <button class="${each?"on":""}" data-a="side" data-v="each">per side</button></div>`:""}
    </div>
    <div class="mini" style="margin-top:8px">${each
      ? `Enter one side only — both are counted (×2).`
      : `Enter the whole set together (×1).`}${opt?"":" This exercise is always logged this way."}</div>

    <div class="mathrow" style="margin-top:12px">
      <span>${U.sets}×${ex.mode==="time"?U.reps+"s":U.reps}${hasLoad(ex)?` @ ${U.load}kg`:""}</span>
      <span><b>${fmt(cs.ton)}</b> kg</span></div>

    <div class="kv" style="margin-top:10px">
      <div class="kvi"><span class="k">per rep</span><b>${cs.prk}kg</b><span class="k2">${each?"one side":"whole set"}</span></div>
      <div class="kvi"><span class="k">your PB</span><b>${r.load||0}kg</b><span class="k2">${r.reps||0}${ex.mode==="time"?"s":" reps"} · ${r.last?agoText(r.last):"never"}</span></div>
      <div class="kvi"><span class="k">e1RM</span><b>${r.e1rm||0}kg</b><span class="k2">best set ${kgs(r.vol||0)}</span></div>
    </div>

    <div style="margin-top:10px">${status}</div>
    <div class="mini" style="margin-top:9px;color:var(--gold)">Next target · ${esc(nextTarget(ex))}</div>
    <button class="cta" data-a="log" style="margin-top:13px">LOG SET</button>`;
}

/* ══════════════════ TAB · WEEK ══════════════════ */
function tabWeek(){
  const wk=mondayOf(dayKey()), w=S.weeks[wk]||[0,0,0,0,0,0,0], rs=restStatus();

  const weekCard=card({
    title:"This week", icon:"cal", k:"week", accent:"var(--gold)",
    meta:`${S.perfectWeeks} perfect`,
    help:`Seven days, each muscle group trained exactly twice. One tick is a day you trained, two is a day you cleared all three missions. All seven doubled is a <b>Perfect Week</b>: triple bounty and +2 permanent Power.`,
    body:`<div class="week">${DOWL.map((d,i)=>
      `<div class="wday ${w[i]===2?"f":w[i]===1?"p":""} ${i===S.daily.dow?"today":""}">${d}<br>${w[i]===2?"✓✓":w[i]===1?"✓":"·"}</div>`).join("")}</div>
      <div class="mini" style="margin-top:12px;color:${rs.t==="decay"?"var(--red)":rs.t==="ok"?"var(--green)":"var(--dim)"}">${esc(rs.msg)}</div>`
  });

  const ws={}; GK.forEach(g=>ws[g]=0);
  const t0=dayNum(dayKey());
  S.log.forEach(r=>{ if(t0-dayNum(r.d)<7) ws[byId(r.ex).g]+=r.sets; });
  const volCard=card({
    title:"Hard sets", icon:"bars", k:"vol", accent:"var(--magenta)", meta:"last 7 days",
    help:`10–20 hard sets per muscle per week is the range that actually builds size. Under 10 is maintenance. The bar fills toward 20.`,
    body:`<div class="list">${GK.map(g=>`<div class="li" style="display:block;padding:10px 0">
      <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px">
        <span>${GROUPS[g].name}</span>
        <span class="mini" style="color:${ws[g]>=10?"var(--green)":"var(--dim)"}">${ws[g]} / 10+</span></div>
      <div style="margin-top:7px">${bar(ws[g]/20*100,gcol(g),5)}</div></div>`).join("")}</div>`
  });

  const days=[]; const byDay={};
  (S.log||[]).forEach(r=>{ if(!byDay[r.d]){byDay[r.d]=[];days.push(r.d);} byDay[r.d].push(r); });
  const show=days.slice(0,U.logDays||5);
  const logCard=card({
    title:"Your log", icon:"receipt", k:"log", accent:"var(--green)",
    meta:`${(S.log||[]).length} sets`,
    body:show.length?`${show.map(d=>{
      const rows=byDay[d], ton=rows.reduce((a,r)=>a+r.ton,0), cut=rows.slice(0,12);
      return `<div class="daysep"><span>${d===dayKey()?"today":agoText(d)}</span><span class="ln"></span><span>${rows.length} sets · ${kgs(ton)}</span></div>
        <div class="list">${cut.map(r=>{const e=byId(r.ex);
          return `<button class="li" data-a="jump" data-e="${r.ex}">
            <span class="ldot" style="background:${gcol(e.g)}"></span>
            <span class="lmain"><span class="lname">${esc(e.n)}${r.pr&&r.pr.length?`<span class="prbadge">PR</span>`:""}</span>
              <span class="lsub">${setDesc(r)} · ${r.prk}kg per rep</span></span>
            <span class="lval">${fmt(r.ton)}<span class="u">kg</span></span></button>`;}).join("")}</div>
        ${rows.length>cut.length?`<div class="mini" style="margin-top:8px">+ ${rows.length-cut.length} more that day</div>`:""}`;
    }).join("")}
    ${days.length>show.length?`<button class="ghost wide" data-a="logmore" style="margin-top:13px">show more days</button>`:""}`
    :`<div class="empty">Nothing logged yet.</div>`
  });

  const rotCard=card({
    title:"The rotation", icon:"flag", k:"rot", accent:"var(--cobalt)",
    help:`Mission difficulty steps up every second week — rep targets, hold times, distinct-exercise counts and the load bar all climb. The volume quota tracks your own rolling 21-day median, so it stays hard as you get stronger without ever asking for a boss-sized session.`,
    body:`<div class="list">${PLAN.map((pl,i)=>`<div class="li">
      <span class="ldot" style="background:${gcol(pl.gs[0])}"></span>
      <span class="lmain"><span class="lname">${DOWL[i]} · ${esc(pl.name)}</span>
        <span class="lsub">${pl.gs.map(g=>GROUPS[g].name).join(" · ")}</span></span>
      ${i===S.daily.dow?`<span class="lval" style="color:var(--gold);font-size:10.5px">TODAY</span>`:""}</div>`).join("")}</div>`
  });

  const decayCard=card({
    title:"Detraining", icon:"clock", k:"decay", accent:"var(--red)",
    meta:`floor: boss ${Math.floor(S.ci/10)*10+1}`,
    help:`Beaten bosses revive when the current one heals past full — but never past the first boss of the act you're in. A week away costs about a week of work.`,
    body:`<div class="kv">
      <div class="kvi"><span class="k">day 1 off</span><b style="color:var(--green)">free</b><span class="k2">nothing moves</span></div>
      <div class="kvi"><span class="k">day 2+</span><b style="color:var(--red)">3–10%</b><span class="k2">healed per day</span></div>
      <div class="kvi"><span class="k">furthest</span><b>${(S.peak||S.ci)+1}</b><span class="k2">boss reached</span></div>
    </div>`
  });

  return cols(weekCard+volCard, logCard+rotCard+decayCard);
}

/* ══════════════════ CREWS ══════════════════
   A crew is an id every member carries on their own board card, so joining is
   writing that id to your own row and membership is everyone who has it. The
   owner's card also carries the removal list, which every client honours. */
const crewId=()=>S.crew?S.crew.id:null;
const newCrewCode=name=>{
  const base=slugify(name).slice(0,12)||"crew";
  let tail=""; for(let i=0;i<4;i++) tail+="abcdefghijkmnpqrstuvwxyz23456789"[Math.floor(Math.random()*32)];
  return base+"-"+tail;
};
/* your own card, so you show up in the crew before the first sync lands */
const selfRow=()=>({id:(MP.me&&MP.me.id)||"me",name:(MP.me&&MP.me.name)||"you",
  pwr:S.power|0,ci:S.ci|0,ton:Math.round(S.totalTon||0),streak:S.streak|0,
  prs:(S.prLog||[]).length,lastDay:S.lastDay,
  crew:crewId(),crewName:S.crew&&S.crew.name,crewOwner:!!S.crewOwner,crewBans:S.crewBans||[]});

/* the owner's own board card is a sync behind, so their local state wins for
   their own view; everyone else reads the list the owner published */
function crewBansOf(rows){
  if(S.crewOwner) return S.crewBans||[];
  const owner=rows.find(p=>p.crewOwner);
  return (owner&&owner.crewBans)||[];
}
function crewRows(){
  const id=crewId(); if(!id) return [];
  const rows=Object.values(MP.board).filter(p=>p.crew===id);
  if(!rows.some(p=>MP.me&&p.id===MP.me.id)) rows.push(selfRow());
  const bans=crewBansOf(rows);
  /* you always see yourself, even once you have been removed */
  return rows.filter(p=>!bans.includes(p.id)||(MP.me&&p.id===MP.me.id))
             .sort((a,b)=>(b.crewOwner?1:0)-(a.crewOwner?1:0)||(b.ton|0)-(a.ton|0));
}
function crewInfo(){
  const rows=crewRows(), owner=rows.find(p=>p.crewOwner);
  return {rows, owner,
    name:(S.crewOwner&&S.crew&&S.crew.name)||(owner&&owner.crewName)||(S.crew&&S.crew.name)||crewId(),
    removed: !!(MP.me && !S.crewOwner && crewBansOf(rows).includes(MP.me.id))};
}

        const mine=MP.me&&r.id===MP.me.id;
        return `<div class="lrow ${mine?"me":""}">
          <div class="rk ${i<3?"g"+(i+1):""}">${i+1}</div>
          <div class="lmain">
            <div class="pname">${esc(r.name)}${mine?`<span class="youtag">YOU</span>`:""}</div>

          </div>
          <div class="pbig">${fmtK(r[m.k]||0)}<span>${m.l}</span></div>
        </div>`;}).join("")
        :`<div class="empty">Nobody has logged a set yet. Send your friends this link, have them pick a name, and the board fills itself.</div>`}</div>
      ${myRank?`<div class="mini" style="margin-top:13px">You rank <b>#${myRank}</b> of ${rows.length} on ${m.l}.</div>`:""}`
  });

  const feed=feedItems(true).slice(0,25);
  const feedCard=card({
    title:"Live feed", icon:"users", k:"feed", accent:"var(--cobalt)",
    meta:feed.length?`${feed.length} sets`:"",
    help:`The last few sets from everyone on the board, newest first. It updates whenever anyone's app syncs — hit refresh on the board to pull the latest.`,
    body:feed.length?`<div class="list">${feed.map(feedRow).join("")}</div>`
      :`<div class="empty">No activity yet. Once anyone logs a set it shows up here.</div>`
  });

  const house=card({
    title:"House records", icon:"spark", k:"house", accent:"var(--magenta)",
    help:`The best estimated 1RM on each lift and who owns it. Beat one and it flips to your name after your next sync.`,
    body:`<div class="chiprow">
        <button class="filt ${U.rgroup==="all"?"on":""}" data-a="rgroup" data-v="all">all</button>
        ${GK.map(g=>`<button class="filt ${U.rgroup===g?"on":""}" data-a="rgroup" data-v="${g}">${GROUPS[g].name.toLowerCase()}</button>`).join("")}
      </div>${(()=>{
        const recs=[];
        EX.forEach(e=>{
          if(U.rgroup!=="all" && e.g!==U.rgroup) return;
          let best=null;
          rows.forEach(pl=>{ const v=pl.lifts&&pl.lifts[e.id];
            if(v&&v.e>0&&(!best||v.e>best.v)) best={v:v.e,who:pl.name,id:pl.id,reps:v.r,load:v.l}; });
          if(best) recs.push(Object.assign({e},best));
        });
        recs.sort((a,b)=>b.v-a.v);
        if(!recs.length) return `<div class="empty" style="margin-top:12px">No records on the board yet for this filter.</div>`;
        return `<div class="list" style="margin-top:13px">${recs.slice(0,30).map(r=>`<div class="li">

          <span class="lval" style="color:var(--gold)">${fmt(r.v)}<span class="u">kg 1RM</span></span></div>`).join("")}</div>`;
      })()}`
  });

  return cols(crewCard()+board, feedCard+house);
}
