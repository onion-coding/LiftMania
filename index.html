}

function tabTrain(ex){
  const dow=S.daily.dow, p=rotAt(dow), done=S.daily.objs.filter(o=>o.done).length;

  /* ── today's missions, or the permission not to have any ── */
  const missions = S.daily.rest ? card({
    title:"Rest day", icon:"clock", k:"daily", accent:"var(--dim)",
    sub:`${DOWF[dow]} · nothing on your rotation`,
    help:`A day with no muscle groups on the rotation asks nothing of you. It counts as kept for the week and the streak survives it. Put groups on it under <b>customise</b> if you would rather train.`,
    body:`<div class="empty">Nothing is asked of you today.<br><br>Train anyway if you feel like it — every set still moves your records and still counts as a run at the ten challenges.</div>`
  }) : card({
    title:"Today's missions", icon:"target", k:"daily", accent:"var(--gold)",
    meta:`${done}/3`,
    sub:`${esc(p.name)} · ${esc(p.label)}`,
    help:`Three missions refresh every day, drawn from the muscle groups your rotation puts on today. Clear all three for a <b>perfect day</b>; seven kept days is a perfect week. Tap a mission to see exactly which exercises count toward it.`,
    body:`<div class="list">${S.daily.objs.map((o,i)=>{
      const v=progressOf(o,S.daily.acc), open=U.openObj===i;
      return `<button class="objrow ${o.done?"done":""}" data-a="obj" data-i="${i}">
        <span class="objbox${o.done&&(FX.popObj||[]).includes(i)?" justdone":""}">${o.done?"✓":i+1}</span>
        <span class="objtxt">
          <span class="objlab">${esc(o.label)}</span>
          <span class="objbar">${bar(o.t==="pr"?(v?100:0):v/o.target*100,o.done?"var(--greenF)":gcol(p.gs[0]),5,FX.objFrom&&FX.objFrom[i])}</span>
          <span class="lsub">${fmtProg(o,v)} · ${open?"hide":"what counts?"}</span>
        </span>
      </button>${open?qualList(objQualifiers(o,p,S.bw),OBJ_HINT[o.t]):""}`;
    }).join("")}</div>
    <div class="mini" style="margin-top:12px">All three keeps the day — ${S.daily.perfect?`<b style="color:var(--green)">done</b>.`:`${3-done} to go.`}</div>`
  });

  /* ── the logger ── */
  const logger=card({
    title:"Log a set", icon:"dumbbell", k:"logger", accent:"var(--green)",
    meta:esc(GROUPS[U.group].name),
    help:`<div class="legend">
      <span><span class="tag hold">HOLD</span> timed — you log seconds, not reps</span>
      <span><span class="tag kg">KG</span> you set the weight yourself</span>
      <span><span class="tag bw">BW</span> your bodyweight, scaled by leverage</span>
      <span><span class="side" style="color:var(--magenta);font-family:var(--m)">×2</span> log one side only — both get counted</span>
      <span><span class="swatch"></span> gold outline — this lift carries a challenge</span>
      <span><span style="color:var(--gold);font-weight:700">●</span> on a muscle — something in it counts today</span></div>`,
    body:loggerBody(ex)
  });

  /* ── what you logged today ── */
  const ts=todaySets(), tton=ts.reduce((a,r)=>a+r.ton,0);
  const logged=card({
    title:"Logged today", icon:"receipt", k:"logged", accent:"var(--magenta)",
    meta:ts.length?`${ts.length} · ${kgs(tton)}`:"none yet",
    body:ts.length?`<div class="list">${ts.slice(0,8).map(r=>{
      const e=byId(r.ex);
      return `<button class="li" data-a="jump" data-e="${r.ex}">
        <span class="ldot" style="background:${gcol(e.g)}"></span>
        <span class="lmain"><span class="lname">${esc(e.n)}${r.att?`<span class="attbadge">ATTEMPT</span>`:""}${r.pr&&r.pr.length?`<span class="prbadge">PR</span>`:""}</span>
          <span class="lsub">${setDesc(r)} · ${r.prk}kg per rep</span></span>
        <span class="lval">${fmt(r.ton)}<span class="u">kg</span></span></button>`;}).join("")}</div>
      ${ts.length>8?`<div class="mini" style="margin-top:10px">+ ${ts.length-8} more — full log in WEEK.</div>`:""}`
      :`<div class="empty">Nothing yet today. Your first set starts the streak.</div>`
  });

  /* ── what the crew just did ── */
  const feed=feedItems(false).slice(0,3);
  const crew=feed.length?card({
    title:"Crew feed", icon:"users", accent:"var(--cobalt)",
    meta:`<button class="ghost" data-a="tab" data-t="feed" style="padding:4px 9px">see all</button>`,
    body:`<div class="list">${feed.map(feedRow).join("")}</div>`
  }):"";

  const receipt = U.flash && !U.flash.att ? flashCard(U.flash) : "";
  return statStrip() + todayCard() + cols(missions+crew, logger+receipt+logged);
}

function loggerBody(ex){
  const cs=computeSet(ex,S.bw,U.sets,U.reps,U.load,sidesNow());
  let list=EX.filter(e=>e.g===U.group);
  if(U.only) list=list.filter(countsNow);
  const each=U.sd==="each", opt=ex.s==="opt";
  const pv=prPreview(ex,U.sets,U.reps,U.load), r=S.records[ex.id]||{};

  let status;
  if(pv.fresh) status=`<div class="prline" style="border-color:var(--green);color:var(--green)">First entry — this sets all four records.</div>`;
  else if(pv.hits.length) status=`<div class="prline" style="border-color:var(--gold);color:var(--gold)"><b>PR incoming:</b> ${pv.hits.map(x=>`${x.label} ${x.cur}${x.u}`).join(" · ")}</div>`;
  else{ const c=pv.closest, gap=Math.round((c.best-c.cur)*10)/10;
    status=gap<=0
      ? `<div class="prline" style="border-color:var(--cobalt)">Level with your <b>${c.label}</b> PB of ${c.best}${c.u}. One more and it's yours.</div>`
      : `<div class="prline">Closest record: <b style="color:var(--cream)">${c.label}</b> — need ${c.k==="reps"?`${gap+1} more`:`${gap}${c.u} more`} to beat ${c.best}${c.u}</div>`; }

  return `
    <div class="gchips">${GK.map(g=>{
      const flag=EX.some(e=>e.g===g&&countsNow(e));
      return `<button class="gchip" data-a="group" data-g="${g}"
        style="${U.group===g?`background:${gcol(g)};color:var(--onGroup)`:""}">${GROUPS[g].name}${flag?`<span class="cnt" style="${U.group===g?"color:var(--onGroup)":""}">●</span>`:""}</button>`;}).join("")}</div>

    <div class="chiprow" style="margin-top:10px">
      <button class="filt ${U.only?"on":""}" data-a="only">${U.only?"✓ only what counts today":"only what counts today"}</button>
    </div>

    <div class="exwrap" style="margin-top:10px">${
      list.length?list.map(e=>`<button class="exchip ${U.ex===e.id?"on":""} ${CH_BY_EX[e.id]?"hit":""}" data-a="ex" data-e="${e.id}">${esc(e.n)} ${exTag(e)}${sideMode(e)==="each"?`<span class="side">×2</span>`:""}</button>`).join("")
      :`<div class="empty">Nothing in ${GROUPS[U.group].name} counts right now. Muscles with a ● do.</div>`}</div>

    <div class="steppers" style="margin-top:15px">
      ${stepper("sets","sets",1,1)}
      ${stepper(ex.mode==="time"?(each?"sec / side":"seconds"):(each?"reps / side":"reps"),"reps",ex.mode==="time"?5:1,1)}
      ${hasLoad(ex)?stepper(ex.mode==="bwload"?"added kg":(each?"kg / side":"kg"),"load",1,0):""}
    </div>

    ${opt?`<div class="chiprow" style="margin-top:11px">
      <div class="seg">
        <button class="${!each?"on":""}" data-a="side" data-v="both">both sides</button>
        <button class="${each?"on":""}" data-a="side" data-v="each">per side</button></div>
    </div>`:""}
    <div class="mini" style="margin-top:8px">${each
      ? `Enter one side only — both are counted (×2).`
      : `Enter the whole set together (×1).`}${opt?"":" This exercise is always logged this way."}</div>

    <div class="mathrow" style="margin-top:12px">
      <span>${U.sets}×${ex.mode==="time"?U.reps+"s":U.reps}${hasLoad(ex)?` @ ${U.load}kg`:""}</span>
      <span><b>${fmt(cs.ton)}</b> kg</span></div>

    <div class="kv" style="margin-top:10px">
      <div class="kvi"><span class="k">per rep</span><b>${cs.prk}kg</b><span class="k2">${each?"one side":"whole set"}</span></div>
      <div class="kvi"><span class="k">your PB</span><b>${r.load||0}kg</b><span class="k2">${r.reps||0}${ex.mode==="time"?"s":" reps"} · ${r.last?agoText(r.last):"never"}</span></div>
      <div class="kvi"><span class="k">e1RM</span><b>${r.e1rm||0}kg</b><span class="k2">best set ${kgs(r.vol||0)}</span></div>
    </div>

    <div style="margin-top:10px">${status}</div>
    <div class="mini" style="margin-top:9px;color:var(--gold)">Next target · ${esc(nextTarget(ex))}</div>

    ${(()=>{const c=CH_BY_EX[ex.id]; if(!c) return "";
      const i=CHALLENGES.indexOf(c)+1;
      return `<div class="chalbox">
        <div class="chalhead">
          <span class="chalname">CHALLENGE ${pad(i)} · ${esc(c.name.toUpperCase())}</span>
          <span class="mini">${chalVal(c.id)?`your record ${esc(chalFmt(c,chalVal(c.id)))}`:"never attempted"}</span>
        </div>
        <div class="mini" style="margin-top:7px">${esc(CH_KIND[c.kind].verb)}. Sets logged here are training and are not measured — the record only moves when you sit the test.</div>
        <button class="ghost wide" data-a="goch" data-c="${c.id}" style="margin-top:10px">attempt it</button>
      </div>`;})()}

    <button class="cta" data-a="log" style="margin-top:13px">LOG SET</button>`;
}

/* What you just did, how long until the next one, and the one button that
   does it again. It sits directly under whatever you pressed to get here —
   the log button on TRAIN, the attempt button on CHALLENGES — because a
   receipt at the bottom of the page is a receipt nobody reads. */
function flashCard(f){
  const c=f.chId?chalOf(f.chId):null;
  const r=f.rep, again = r ? `${r.sets}×${byId(r.ex).mode==="time"?r.reps+"s":r.reps}`
    + (hasLoad(byId(r.ex))?` @ ${r.load}kg`:"") : "";
  return `<section class="card pop" style="--accent:var(--green);background:var(--panel2)">
    <div class="chead"><span class="cicon">${ico("bolt")}</span>
      <h2 class="ctitle big" style="color:var(--green)">${fmt(f.ton)} KG MOVED</h2>
      <button class="hbtn" data-a="flashoff" title="Dismiss" aria-label="Dismiss">×</button></div>
    <div class="body">
      ${f.chal?`<div class="banner ${f.chal.up?"pop":"info"}" style="margin-bottom:8px;align-items:center;gap:11px">
          ${f.chal.tier>=0?medalImg(f.chal.tier,"fbig"):""}
          <span style="font-family:var(--d);font-size:12.5px;line-height:1.5">
            ${esc(f.chal.name.toUpperCase())} · ${esc(chalFmt(c,f.chal.v))}
            <span style="display:block;font-family:var(--b);font-size:12px;opacity:.85">
              ${f.chal.up?`${esc(MEDALS[f.chal.tier].n.toUpperCase())} MEDAL`
                :`new record — was ${esc(chalFmt(c,f.chal.prev))}`}</span></span>
        </div>`
      :c?`<div class="mini" style="color:var(--dim)">${esc(chalFmt(c,f.run))} on ${esc(c.name)} — your record stands at ${esc(chalFmt(c,chalVal(c.id)))}.</div>`:""}
      ${f.broke.length?`<div class="banner" style="margin-top:8px;font-family:var(--d);font-size:11.5px">NEW RECORD · ${esc(f.broke.join(", "))}</div>`:""}
      ${f.finished.map(t=>`<div class="banner info" style="margin-top:8px">✓ ${esc(t)}</div>`).join("")}
      ${f.perfect?`<div class="banner pop" style="margin-top:8px;background:var(--greenF);color:var(--onGreen);font-family:var(--d);font-size:12px">PERFECT DAY</div>`:""}
      ${f.weekDone?`<div class="banner pop" style="margin-top:8px;font-family:var(--d);font-size:12px">PERFECT WEEK</div>`:""}

      <div id="restBox" class="restbox${U.rest<=0?" done":""}">
        <div class="restrow">
          <button id="restClock" class="restclock" data-a="skiprest" title="Skip the rest">${
            U.rest>0?`${Math.floor(U.rest/60)}:${pad(U.rest%60)}`:"go"}</button>
          <span class="restlab">rest</span>
          <button class="restplus" data-a="restplus" title="Longer rest, and remember it">+30s</button>
        </div>
        <div class="resttrack"><div id="restFill" class="restfill" style="width:${
          U.rest>0?(U.rest/Math.max(1,U.restTotal||S.restLen||30)*100):0}%"></div></div>
      </div>

      ${r?`<button class="cta alt" data-a="again" style="margin-top:11px">${
          f.att?"ATTEMPT AGAIN":"ANOTHER SET"} · ${esc(again)}</button>`:""}
      <div class="mini" style="margin-top:8px">Resting <b id="restLen">${S.restLen}s</b> between sets — <b>+30s</b> makes that the new default.</div>
    </div></section>`;
}

/* ══════════════════ TAB · WEEK ══════════════════ */
function tabWeek(){
  const wk=mondayOf(dayKey()), w=S.weeks[wk]||[0,0,0,0,0,0,0], rs=restStatus();
  const kept=w.filter((v,i)=>v===2||isRest(i)).length;

  const weekCard=card({
    title:"This week", icon:"cal", k:"week", accent:"var(--gold)",
    meta:`${S.perfectWeeks} perfect`,
    help:`Seven days of your own rotation. One tick is a day you trained, two is a day you cleared all three missions, and a rest day you scheduled yourself counts as kept without either. All seven kept is a <b>perfect week</b>.`,
    body:`<div class="week">${DOWL.map((d,i)=>{
      const r=isRest(i);
      return `<div class="wday ${r?"r":w[i]===2?"f":w[i]===1?"p":""} ${i===S.daily.dow?"today":""}" title="${esc(rotAt(i).name)}">${d}<br>${
        r?"rest":w[i]===2?"✓✓":w[i]===1?"✓":"·"}</div>`;}).join("")}</div>
      <div class="mini" style="margin-top:12px">${kept}/7 kept · today is <b>${esc(rotAt(S.daily.dow).name)}</b>.</div>
      <div class="mini" style="margin-top:6px;color:${rs.t==="decay"?"var(--red)":rs.t==="ok"?"var(--green)":"var(--dim)"}">${esc(rs.msg)}</div>`
  });

  const ws={}; GK.forEach(g=>ws[g]=0);
  const t0=dayNum(dayKey());
  S.log.forEach(r=>{ if(t0-dayNum(r.d)<7) ws[byId(r.ex).g]+=r.sets; });
  const volCard=card({
    title:"Hard sets", icon:"bars", k:"vol", accent:"var(--magenta)", meta:"last 7 days",
    help:`10–20 hard sets per muscle per week is the range that actually builds size. Under 10 is maintenance. The bar fills toward 20.`,
    body:`<div class="list">${GK.map(g=>`<div class="li" style="display:block;padding:10px 0">
      <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px">
        <span>${GROUPS[g].name}</span>
        <span class="mini" style="color:${ws[g]>=10?"var(--green)":"var(--dim)"}">${ws[g]} / 10+</span></div>
      <div style="margin-top:7px">${bar(ws[g]/20*100,gcol(g),5)}</div></div>`).join("")}</div>`
  });

  const days=[]; const byDay={};
  (S.log||[]).forEach(r=>{ if(!byDay[r.d]){byDay[r.d]=[];days.push(r.d);} byDay[r.d].push(r); });
  const show=days.slice(0,U.logDays||5);
  const logCard=card({
    title:"Your log", icon:"receipt", k:"log", accent:"var(--green)",
    meta:`${(S.log||[]).length} sets`,
    body:show.length?`${show.map(d=>{
      const rows=byDay[d], ton=rows.reduce((a,r)=>a+r.ton,0), cut=rows.slice(0,12);
      return `<div class="daysep"><span>${d===dayKey()?"today":agoText(d)}</span><span class="ln"></span><span>${rows.length} sets · ${kgs(ton)}</span></div>
        <div class="list">${cut.map(r=>{const e=byId(r.ex);
          return `<button class="li" data-a="jump" data-e="${r.ex}">
            <span class="ldot" style="background:${gcol(e.g)}"></span>
            <span class="lmain"><span class="lname">${esc(e.n)}${r.att?`<span class="attbadge">ATTEMPT</span>`:""}${r.pr&&r.pr.length?`<span class="prbadge">PR</span>`:""}</span>
              <span class="lsub">${setDesc(r)} · ${r.prk}kg per rep</span></span>
            <span class="lval">${fmt(r.ton)}<span class="u">kg</span></span></button>`;}).join("")}</div>
        ${rows.length>cut.length?`<div class="mini" style="margin-top:8px">+ ${rows.length-cut.length} more that day</div>`:""}`;
    }).join("")}
    ${days.length>show.length?`<button class="ghost wide" data-a="logmore" style="margin-top:13px">show more days</button>`:""}`
    :`<div class="empty">Nothing logged yet.</div>`
  });

  const rotCard=card({
    title:"The rotation", icon:"flag", k:"rot", accent:"var(--cobalt)",
    meta:`<button class="ghost" data-a="editrot" style="padding:4px 9px">${U.editRot?"done":"edit"}</button>`,
    help:`The muscle groups each day of the week is meant to hit. Today's three missions are drawn from it, so it decides what the app asks of you. Edit it freely — the default is only a starting shape, and a day with nothing on it is a rest day.`,
    body:U.editRot?rotEditor():`<div class="list">${DOWL.map((d,i)=>{const r=rotAt(i), rest=!r.gs.length;
      return `<div class="li">
        <span class="ldot" style="background:${rest?"var(--line)":gcol(r.gs[0])}"></span>
        <span class="lmain"><span class="lname">${esc(DOWF[i])} · ${esc(r.name)}</span>
          <span class="lsub">${rest?"rest day — nothing asked":esc(r.gs.map(g=>GROUPS[g].name).join(" · "))}</span></span>
        ${i===S.daily.dow?`<span class="lval" style="color:var(--gold);font-size:10.5px">TODAY</span>`:""}</div>`;}).join("")}</div>`
  });

  const offCard=card({
    title:"Time off", icon:"clock", k:"off", accent:"var(--dim)",
    meta:S.lastDay?agoText(S.lastDay):"never",
    help:`Nothing you have earned decays. Records stand, medals stay cut, and the ten challenges never claw a number back. A long gap costs you the streak and the week's ticks — and quietly moves lifts onto the going-stale list in YOU.`,
    body:`<div class="kv">
      <div class="kvi"><span class="k">last set</span><b>${S.lastDay?agoText(S.lastDay):"—"}</b><span class="k2">${(S.log||[]).length} logged</span></div>
      <div class="kvi"><span class="k">streak</span><b style="color:${S.streak?"var(--green)":"var(--dim)"}">${S.streak}d</b><span class="k2">${S.streak?"running":"cold"}</span></div>
      <div class="kvi"><span class="k">records</span><b>${S.power}</b><span class="k2">broken, all time</span></div>
    </div>
    <div class="mini" style="margin-top:13px">${esc(rs.msg)}</div>`
  });

  return cols(weekCard+volCard, logCard+rotCard+offCard);
}

/* ══════════════════ TAB · CHALLENGES ══════════════════
   The competitive half of the app. Ten tests, everyone's record on each, and
   the one button that puts a number on the board. */
/* Four things and no prose: what counts, what the cuts are, the box that puts
   a number on the board, and who else has one. Everything about how points
   work lives behind the ? on the card, not in front of every challenge. */
function attemptBox(c){
  const isLoad=c.kind==="load", pb=chalVal(c.id);
  const val=isLoad?Math.round(U.attV*2)/2:Math.round(U.attV);
  const reps=Math.max(1,Math.round(isLoad?U.attR:U.attV));
  const legal=!isLoad||reps>=8;
  const mine=isLoad?val:reps;
  const t=legal&&mine>0?chalMedal(c,mine):-1;
  return `<div class="attbox">
    <div class="steppers">
      ${stepper(isLoad?"kg per rep":CH_KIND[c.kind].unit,"attV",isLoad?1:c.kind==="hold"?5:1,isLoad?0:1)}
      ${isLoad?stepper("reps","attR",1,8):""}
    </div>
    <div class="verdict">${!legal
      ? `<span style="color:var(--magenta)">Needs eight reps or more.</span>`
      : `${t>=0?`Takes <b style="color:var(--gold)">${esc(MEDALS[t].n)}</b>`
              :`No medal — Bronze is ${esc(chalFmt(c,chalCut(c,0)))}`}${
          mine>pb&&pb?` · beats your ${esc(chalFmt(c,pb))}`:""}`}</div>
    <button class="cta" data-a="attempt" data-c="${c.id}">SUBMIT ATTEMPT</button>
  </div>
  ${U.flash&&U.flash.att&&U.flash.chId===c.id?flashCard(U.flash):""}`;
}

function chalDetail(c){
  const rows=chalBoard(c), t=chalTier(c.id), mine=MP.me&&MP.me.id;
  return `<div class="expand${FX.expand?" reveal":""}">
    <div class="crule">${esc(c.rule)}</div>
    <div class="medalrow" style="margin-top:13px">${MEDALS.map((m,i)=>
      `<span class="medal ${m.k} ${i<=t?"on":""} ${i===t?"now":""}">${medalImg(i)}<b>${chalFmt(c,chalCut(c,i))}</b></span>`).join("")}</div>
    ${attemptBox(c)}
    ${rows.length?`<div class="mini" style="margin-top:16px">Board</div>
      <div style="margin-top:4px">${rows.map((pl,i)=>{
        const v=pl.chal[c.id].v, pt=chalMedal(c,v), me=pl.id===mine;
        return `<div class="lrow ${me?"me":""}">
          <div class="rk ${i<3?"g"+(i+1):""}">${i+1}</div>
          <div class="lmain"><div class="pname">${esc(pl.name)}${me?`<span class="youtag">YOU</span>`:""}</div></div>
          <div class="pbig">${esc(chalFmt(c,v))}${pt>=0?medalImg(pt,"mbimg"):""}</div>
        </div>`;}).join("")}</div>`:""}
  </div>`;
}

function chalRow(c,i){
  const v=chalVal(c.id), t=chalMedal(c,v), open=U.openChal===c.id, e=chalEx(c);
  const to=t<4?chalCut(c,t+1):null, from=t>=0?chalCut(c,t):0;
  const pct=to?Math.max(0,Math.min(100,(v-from)/Math.max(1,to-from)*100)):100;
  const board=chalBoard(c), lead=board[0], mine=MP.me&&MP.me.id;
  const pos=board.findIndex(r=>r.id===mine)+1;

  /* where you stand — said only when somebody is actually standing there */
  const race = !lead || (board.length===1 && lead.id===mine) ? ""
    : lead.id===mine ? `you lead · ${board.length} have run it`
    : `${pos?`#${pos} of ${board.length}`:`${board.length} ${board.length===1?"has":"have"} run it`} · <b>${esc(lead.name)}</b> leads on ${esc(chalFmt(c,lead.chal[c.id].v))}`;

  return `<div class="crow${t>=0?" med":""}${open?" open":""}">
    <button class="chit" data-a="chal" data-c="${c.id}">
      <span class="cnum">${pad(i+1)}</span>
      <span class="lmain">
        <span class="cname">${esc(c.name.toUpperCase())}</span>
        <span class="lsub">${esc(e.n)} · ${esc(CH_KIND[c.kind].verb)}</span>
        <span class="cbar">${bar(pct,t>=0?"linear-gradient(90deg,var(--goldF),var(--gold))":gcol(e.g),5)}</span>
        <span class="lsub">${v?`<b style="color:var(--cream)">${esc(chalFmt(c,v))}</b>`
            :`<span style="color:var(--magenta)">not attempted</span>`}${
          to?` · ${esc(MEDALS[t+1].n)} at ${esc(chalFmt(c,to))}`:` · <b style="color:var(--gold)">maxed out</b>`}</span>
        ${race?`<span class="lsub">${race}</span>`:""}
      </span>
      <span class="cmed">${t>=0?medalImg(t,"crm"):`<span class="nomed">—</span>`}<span class="cpts">${t>=0?"+"+CUM_PTS[t]:""}</span></span>
    </button>
    ${open?chalDetail(c):""}
  </div>`;
}

function tabChal(){
  const me=myStanding(), board=standings(), mine=MP.me&&MP.me.id;
  const pos=board.findIndex(r=>r.id===mine)+1;

  const head=card({
    title:"Challenge board", big:true, icon:"medal", k:"score", accent:"var(--gold)",
    meta:`${me.score} pts`,
    sub:`all time · you have ${me.score} points, ${me.mpts} from medals and ${me.rpts} from position`,
    help:`Strength, all time — what everyone can actually do. Two things add up to a score. <b>Medals</b>: every cut you pass is worth points and is yours for good — Bronze 1, Silver +2, Gold +3, Author +5, Champion +8, so a Champion holds all five and pays 19 on that challenge alone. <b>Position</b>: each challenge pays again for where you stand on its board, ${RANK_PTS.join(", ")} down the podium and 1 below that — but only once two or more people have run it, because being alone on a board is not a win. First place is deliberately worth less than a Gold: being strong beats being early. The medals stop at Champion. The positions never do: after the last cut the only thing left to take is somebody else's place.<br><br>This board barely moves, because a record is permanent. The one that moves week to week — who is turning up — is the training board on CREW.`,
    body:`<div class="medalrow">${MEDALS.map((m,i)=>
        `<span class="medal ${m.k} ${me.med[i]?"on":""}">${medalImg(i)}<b>${me.med[i]}</b></span>`).join("")}</div>
      <div style="margin-top:16px">${board.length?board.map((pl,i)=>`<div class="lrow ${pl.id===mine?"me":""}">
          <div class="rk ${i<3?"g"+(i+1):""}">${i+1}</div>
          ${ava(pl.pic, pl.name, pl.id===mine?"me":"")}
          <div class="lmain"><div class="pname">${esc(pl.name)}${pl.id===mine?`<span class="youtag">YOU</span>`:""}</div>
            <div class="lsub">${pl.ran}/${CHALLENGES.length} challenges</div></div>
          <div class="pbig">${pl.score}<span>points</span></div>
        </div>`).join("")
        :`<div class="empty">Nobody on the board yet.</div>`}</div>
      <button class="ghost wide" data-a="tab" data-t="crew" style="margin-top:12px">who is training most is on CREW</button>`
  });

  const list=card({
    title:"The ten", icon:"flag", k:"ten", accent:"var(--cobalt)",
    meta:`${me.ran}/${CHALLENGES.length}`,
    help:`Every one is uncapped — no time limit, no rep cap, nothing that stops at a target — and every one is a single all-out set, which is why a normal 3×20 does not count as one. Tap a challenge to read its rules, see everyone's record, and sit the test.<br><br>Passing a cut takes your total on that challenge to ${CUM_PTS.join(", then ")} and it is yours for good. Where you finish on its board pays a further ${RANK_PTS.join(" · ")} down the podium, 1 below that, once two people have run it.`,
    body:`<div class="roster">${CHALLENGES.map(chalRow).join("")}</div>`
  });

  return cols(head, list);
}

/* ══════════════════ TAB · FEED ══════════════════ */
function tabFeed(){
  const feed=feedItems(true).slice(0,40);
  const feedCard=card({
    title:"Feed", icon:"news", k:"feed", accent:"var(--cobalt)",
    meta:feed.length?`${feed.length} sets`:"",
    help:`Every set anyone has logged recently, newest first, with the medal it took. It refreshes whenever an app syncs — pull the latest from the refresh button on CREW.`,
    body:feed.length?`<div class="list">${feed.map(feedRow).join("")}</div>`
      :`<div class="empty">Nothing yet. The moment anyone logs a set it lands here.</div>`
  });

  /* a roster rather than a ranking - who is here and when they last lifted */
  const all=standings().slice().sort((a,b)=>{
    const la=a.lastDay?dayNum(a.lastDay):-9e9, lb=b.lastDay?dayNum(b.lastDay):-9e9;
    return lb-la || (b.ton|0)-(a.ton|0);
  });
  const mine=MP.me&&MP.me.id, myCrew=crewId();
  const players=card({
    title:"Players", icon:"users", k:"players", accent:"var(--magenta)",
    meta:`${all.length}`,
    help:`Everyone signed in to this board, most recently active first. Not a ranking — the ranking lives on CREW.`,
    body:all.length?`<div class="list">${all.map(pl=>`<div class="li">
        ${ava(pl.id===mine?S.pic:pl.pic, pl.name, pl.id===mine?"me":"")}
        <span class="lmain"><span class="lname">${esc(pl.name)}${pl.id===mine?`<span class="rolebadge">you</span>`:
            (myCrew&&pl.crew===myCrew?`<span class="rolebadge">crew</span>`:"")}</span>
          <span class="lsub">${pl.score|0} pts · ${kgs(pl.ton||0)} · ${pl.streak|0}d streak</span></span>
        <span class="lval" style="font-size:11px;color:var(--dim)">${pl.lastDay?agoText(pl.lastDay):"never"}</span>
      </div>`).join("")}</div>`
      :`<div class="empty">Nobody on the board yet. Share the link and it fills itself.</div>`
  });
  return cols(feedCard, players);
}

/* ══════════════════ CREWS ══════════════════
   A crew is an id every member carries on their own board card, so joining is
   writing that id to your own row and membership is everyone who has it. The
   owner's card also carries the removal list, which every client honours. */
const crewId=()=>S.crew?S.crew.id:null;
const newCrewCode=name=>{
  const base=slugify(name).slice(0,12)||"crew";
  let tail=""; for(let i=0;i<4;i++) tail+="abcdefghijkmnpqrstuvwxyz23456789"[Math.floor(Math.random()*32)];
  return base+"-"+tail;
};
/* your own card, so you show up in the crew before the first sync lands */
const selfRow=()=>({id:(MP.me&&MP.me.id)||"me",name:(MP.me&&MP.me.name)||"you",
  pwr:S.power|0,chal:S.chal||{},pic:S.pic||null,tr:trainStats(),
  ton:Math.round(S.totalTon||0),streak:S.streak|0,
  prs:(S.prLog||[]).length,lastDay:S.lastDay,
  crew:crewId(),crewName:S.crew&&S.crew.name,crewOwner:!!S.crewOwner,crewBans:S.crewBans||[]});

/* the owner's own board card is a sync behind, so their local state wins for
   their own view; everyone else reads the list the owner published */
function crewBansOf(rows){
  if(S.crewOwner) return S.crewBans||[];
  const owner=rows.find(p=>p.crewOwner);
  return (owner&&owner.crewBans)||[];
}
function crewRows(){
  const id=crewId(); if(!id) return [];
  const rows=standings().filter(p=>p.crew===id);
  const bans=crewBansOf(rows);
  /* you always see yourself, even once you have been removed */
  return rows.filter(p=>!bans.includes(p.id)||(MP.me&&p.id===MP.me.id))
             .sort((a,b)=>(b.crewOwner?1:0)-(a.crewOwner?1:0)||(b.ton|0)-(a.ton|0));
}
function crewInfo(){
  const rows=crewRows(), owner=rows.find(p=>p.crewOwner);
  return {rows, owner,
    name:(S.crewOwner&&S.crew&&S.crew.name)||(owner&&owner.crewName)||(S.crew&&S.crew.name)||crewId(),
    removed: !!(MP.me && !S.crewOwner && crewBansOf(rows).includes(MP.me.id))};
}

function crewCard(){
  if(!crewId()) return card({
    title:"Your crew", icon:"users", k:"crewnew", accent:"var(--magenta)",
    help:`A crew is a private group inside the board. Make one and share its code, or paste a code someone sent you. Everything you already track stays exactly as it is — the crew just gives it a smaller room.`,
    body:`<div class="mini">Start a crew and invite people, or join one with a code.</div>
      <input type="text" id="crewName" placeholder="Crew name" maxlength="22" style="width:100%;margin-top:12px">
      <button class="cta small" data-a="crewcreate" style="margin-top:9px">CREATE CREW</button>
      <div class="daysep"><span class="ln"></span><span>or</span><span class="ln"></span></div>
      <input type="text" id="crewCode" placeholder="Paste an invite code" style="width:100%">
      <button class="ghost wide" data-a="crewjoin" style="margin-top:9px">join crew</button>`
  });

  const ci=crewInfo(), rows=ci.rows, mine=MP.me&&MP.me.id;
  const ton=rows.reduce((a,p)=>a+(p.ton|0),0), pts=rows.reduce((a,p)=>a+(p.score|0),0);
  const form=rows.reduce((a,p)=>a+(p.form|0),0);
  const best=rows.reduce((a,p)=>Math.max(a,p.streak|0),0);
  return card({
    title:ci.name, icon:"users", k:"crew", accent:"var(--magenta)",
    meta:`${rows.length} member${rows.length===1?"":"s"}`,
    help:`Anyone with the code below can join. Members show up here once their app syncs. ${S.crewOwner?"As the owner you can rename the crew and remove members.":"The owner can rename the crew and remove members."}`,
    body:`
      ${ci.removed?`<div class="banner warn" style="margin-bottom:12px">${ico("alert")}<div>You were removed from this crew. Leave to pick another.</div></div>`:""}
      <div class="kv">
        <div class="kvi"><span class="k">together</span><b>${fmtK(ton)}</b><span class="k2">kg moved</span></div>
        <div class="kvi"><span class="k">score</span><b>${pts}</b><span class="k2">challenge points</span></div>
        <div class="kvi"><span class="k">form</span><b>${form}</b><span class="k2">last ${FORM_WIN} days</span></div>
        <div class="kvi"><span class="k">best streak</span><b>${best}d</b><span class="k2">in the crew</span></div>
      </div>

      <button class="cta soon" data-a="crewmission" style="margin-top:13px">START CREW MISSION<span>coming soon</span></button>

      <div class="list" style="margin-top:14px">${rows.map(p=>`<div class="li">
        ${ava(p.id===mine?S.pic:p.pic, p.name, p.id===mine?"me":"")}
        <span class="lmain"><span class="lname">${esc(p.name)}${p.crewOwner?`<span class="rolebadge own">owner</span>`:""}${p.id===mine?`<span class="rolebadge">you</span>`:""}</span>
          <span class="lsub">${p.score|0} pts · ${kgs(p.ton||0)} · ${p.streak|0}d · ${p.lastDay?agoText(p.lastDay):"never"}</span></span>
        ${S.crewOwner&&p.id!==mine?`<button class="xbtn" data-a="crewkick" data-i="${esc(p.id)}" title="Remove ${esc(p.name)}" aria-label="Remove ${esc(p.name)}">×</button>`:""}
      </div>`).join("")}</div>

      <div class="mini" style="margin-top:14px">Invite code</div>
      <div class="chiprow" style="margin-top:7px;flex-wrap:nowrap">
        <span class="code">${esc(crewId())}</span>

/* ══════════════════ TAB · CREW ══════════════════ */
function tabCrew(){
  /* Form first, because that is what this board is for; the rest are the
     ingredients and the two lifetime totals, in case you want to sort by one. */
  const METRICS=[{k:"form",l:"form",u:"form"},{k:"trd",l:"days",u:"days"},
                 {k:"trst",l:"sets",u:"sets"},{k:"trtn",l:"kg (28d)",u:"kg"},
                 {k:"streak",l:"streak",u:"days"},{k:"ton",l:"kg all time",u:"kg"}];
  const m=METRICS.find(x=>x.k===U.metric)||METRICS[0];
  const inCrew=!!crewId();
  const scope=(inCrew&&U.scope==="crew")?"crew":"all";
  const pool=(scope==="crew"?crewRows():standings()).map(r=>Object.assign({},r,{
    trd:r.tr.d|0, trst:r.tr.st|0, trtn:r.tr.tn|0}));
  const rows=pool.slice().sort((a,b)=>(b[m.k]||0)-(a[m.k]||0));
  const myRank=rows.findIndex(r=>MP.me&&r.id===MP.me.id)+1;

  const board=card({
    title:"Training board", big:true, icon:"flame", k:"board", accent:"var(--green)",
    meta:`<button class="ghost" data-a="sync" style="padding:4px 9px">${MP.loading?"syncing…":"refresh"}</button>`,
    sub:`last ${FORM_WIN} days · ${MP.status==="live"?`<span style="color:var(--green)">synced ${MP.synced?new Date(MP.synced).toLocaleTimeString():"just now"}</span>`
       :MP.status==="error"?`<span style="color:var(--red)">sync failed — ${esc(MP.err)}</span>`
       :`offline — connect a server in YOU`}`,
    help:`Who is actually training, over the last ${FORM_WIN} days only — nothing older counts toward it. <b>Form</b> is ${FORM_D} per day you trained, ${FORM_P} more for each day you cleared all three missions, and 1 per hard set.<br><br>It is a rolling window on purpose. Lifetime kilos only ever climb, so ranking on that would just rank everybody by who signed up first and nobody new could ever take the top. This one resets under you, so it is winnable every month by whoever turns up.<br><br>How <i>strong</i> everyone is, rather than how much they turn up, is the board on CHALLENGES.`,
    body:`${inCrew?`<div class="seg" style="margin-bottom:11px">
        <button class="${scope==="all"?"on":""}" data-a="scope" data-v="all">everyone</button>
        <button class="${scope==="crew"?"on":""}" data-a="scope" data-v="crew">my crew</button></div>`:""}
      <div class="chiprow">${METRICS.map(x=>
        `<button class="filt ${U.metric===x.k?"on":""}" data-a="metric" data-v="${x.k}">${x.l}</button>`).join("")}</div>
      <div style="margin-top:13px">${rows.length?rows.map((r,i)=>{
        const mine=MP.me&&r.id===MP.me.id;
        return `<div class="lrow ${mine?"me":""}">
          <div class="rk ${i<3?"g"+(i+1):""}">${i+1}</div>
          ${ava(r.pic, r.name, mine?"me":"")}
          <div class="lmain">
            <div class="pname">${esc(r.name)}${mine?`<span class="youtag">YOU</span>`:""}</div>
            <div class="lsub">${r.trd|0} day${(r.trd|0)===1?"":"s"} · ${r.tr.pd|0} perfect · ${r.trst|0} set${(r.trst|0)===1?"":"s"} · ${kgs(r.trtn||0)}</div>
          </div>
          <div class="pbig">${fmtK(r[m.k]||0)}<span>${m.u}</span></div>
        </div>`;}).join("")
        :`<div class="empty">Nobody has logged a set yet. Send your friends this link, have them pick a name, and the board fills itself.</div>`}</div>
      ${myRank?`<div class="mini" style="margin-top:13px">You rank <b>#${myRank}</b> of ${rows.length} on ${m.l}.</div>`:""}
      <button class="ghost wide" data-a="tab" data-t="chal" style="margin-top:12px">strength rankings are on CHALLENGES</button>`
  });

  const house=card({
    title:"House records", icon:"spark", k:"house", accent:"var(--magenta)",
    help:`The best estimated 1RM on each lift and who owns it. Beat one and it flips to your name after your next sync.`,
    body:`<div class="chiprow">
        <button class="filt ${U.rgroup==="all"?"on":""}" data-a="rgroup" data-v="all">all</button>
        ${GK.map(g=>`<button class="filt ${U.rgroup===g?"on":""}" data-a="rgroup" data-v="${g}">${GROUPS[g].name.toLowerCase()}</button>`).join("")}
      </div>${(()=>{
        const recs=[];
        EX.forEach(e=>{
          if(U.rgroup!=="all" && e.g!==U.rgroup) return;
          let best=null;
          rows.forEach(pl=>{ const v=pl.lifts&&pl.lifts[e.id];
            if(v&&v.e>0&&(!best||v.e>best.v)) best={v:v.e,who:pl.name,id:pl.id,reps:v.r,load:v.l}; });
          if(best) recs.push(Object.assign({e},best));
        });
        recs.sort((a,b)=>b.v-a.v);
        if(!recs.length) return `<div class="empty" style="margin-top:12px">No records on the board yet for this filter.</div>`;
        return `<div class="list" style="margin-top:13px">${recs.slice(0,30).map(r=>`<div class="li">
          <span class="ldot" style="background:${gcol(r.e.g)}"></span>
          <span class="lmain"><span class="lname">${esc(r.e.n)}</span>
            <span class="lsub" style="color:${MP.me&&r.id===MP.me.id?"var(--green)":"var(--dim)"}">${esc(r.who)} · ${r.reps}${r.e.mode==="time"?"s":" reps"} @ ${fmt(r.load)}kg</span></span>
          <span class="lval" style="color:var(--gold)">${fmt(r.v)}<span class="u">kg 1RM</span></span></div>`).join("")}</div>`;
      })()}`
  });

  return cols(crewCard()+board, house);
}

/* ══════════════════ POST-RENDER WIRING ══════════════════ */
function wireInputs(){
  ["sets","reps","load","attV","attR"].forEach(f=>{
    const el=document.getElementById("st_"+f); if(!el) return;
    const commit=()=>{
      let v=parseFloat(String(el.value).replace(",","."));
      if(!isFinite(v)) v=U[f];
      U[f]=Math.max(f==="load"||f==="attV"?0:1, Math.round(v*10)/10);
      render();
    };
    el.addEventListener("change",commit);
    el.addEventListener("focus",()=>el.select());
    el.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); el.blur(); } });
  });
  document.querySelectorAll(".rotname").forEach(el=>{
    const i=Number(el.id.slice(4));
    el.addEventListener("change",()=>{
      if(!S.rot) S.rot=normRot(DEFAULT_ROT);
      S.rot[i].name=String(el.value||"").trim().slice(0,22)||DEFAULT_ROT[i].name;
      persist(); publish(); render();
    });
    el.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); el.blur(); } });
  });
  const bwIn=document.getElementById("bwIn");
  if(bwIn) bwIn.addEventListener("change",e=>{ S.bw=Number(String(e.target.value).replace(/[^0-9.]/g,""))||75; persist(); render(); });
}

/* the ● on a muscle chip: something in it still moves an unfinished mission.
   Challenges are marked separately, by the gold outline on the chip itself. */
function countsNow(e){
  const p=rotAt(S.daily.dow);
  return S.daily.objs.some(o=>!o.done && objQualifiers(o,p,S.bw).includes(e));
}
function nextTarget(ex){
  const l=S.last[ex.id];
  if(!l) return "First entry sets your baseline.";
  if(ex.mode==="time") return `Beat ${l.reps}s. Past 60s, pick a harder hold.`;
  if(ex.mode==="bw") return l.reps>=15?"Switch to a harder variation.":`Target ${l.reps+1} reps.`;
  return l.reps>=12?`Go to ${l.load+1}kg and drop back to 8 reps.`:`Target ${l.reps+1} reps at ${l.load}kg.`;
}

/* ══════════════════ EVENTS ══════════════════ */
document.getElementById("app").addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b||!S) return;
  const a=b.dataset.a;
  if(a==="tab"){ U.tab=b.dataset.t; U.flash=null; U.logDays=5; render(); window.scrollTo(0,0); }
  else if(a==="theme"){ U.theme=b.dataset.v||"night"; applyTheme(); render(); }
  else if(a==="help"){ const k=b.dataset.k; U.help[k]=!U.help[k]; U.fx={help:k}; render(); }
  else if(a==="group"){ U.group=b.dataset.g;
    const first=(U.only?EX.filter(x=>x.g===U.group&&countsNow(x)):EX.filter(x=>x.g===U.group))[0]||EX.find(x=>x.g===U.group);
    pickEx(first.id); render(); }
  else if(a==="ex"){ pickEx(b.dataset.e); render(); }
  else if(a==="obj"){ const i=Number(b.dataset.i); U.openObj = U.openObj===i?null:i; U.fx={expand:true}; render(); }
  else if(a==="chal"){ openChal(U.openChal===b.dataset.c?null:b.dataset.c); U.fx={expand:true}; render(); }
  else if(a==="goch"){ U.tab="chal"; openChal(b.dataset.c); U.flash=null; render(); window.scrollTo(0,0); }
  else if(a==="attempt") submitAttempt(b.dataset.c);
  else if(a==="editrot"){ U.editRot=!U.editRot; U.fx={expand:true}; render(); }
  else if(a==="rotg"){
    const i=Number(b.dataset.i), g=b.dataset.g;
    if(!S.rot) S.rot=normRot(DEFAULT_ROT);
    const day=S.rot[i], at=day.gs.indexOf(g);
    if(at>=0) day.gs.splice(at,1); else if(day.gs.length<4) day.gs.push(g);
    rollDaily(); persist(); publish(); render();
  }
  else if(a==="rotreset"){
    if(!confirm("Put every day back to the default week? Your training and medals are untouched.")) return;
    S.rot=null; rollDaily(); persist(); publish(); render();
  }
  else if(a==="only"){ U.only=!U.only; render(); }
  else if(a==="logmore"){ U.logDays=(U.logDays||5)+10; render(); }
  else if(a==="server"){ U.openServer=!U.openServer; render(); }
  else if(a==="side"){ U.sd=b.dataset.v;
    S.last[U.ex]=Object.assign({sets:U.sets,reps:U.reps,load:U.load},S.last[U.ex],{sd:U.sd}); persist(); render(); }
  else if(a==="jump"){ const e=byId(b.dataset.e); U.group=e.g; pickEx(e.id); U.openObj=null;
    U.tab="train"; render(); document.querySelector(".exwrap")?.scrollIntoView({behavior:"smooth",block:"center"}); }
  else if(a==="inc"||a==="dec"){
    const f=b.dataset.f, s=Number(b.dataset.s), min=Number(b.dataset.min||0);
    U[f]=Math.round(Math.max(a==="inc"?0:min, U[f]+(a==="inc"?s:-s))*10)/10;
    if(a==="dec") U[f]=Math.max(min,U[f]);
    U.fx={bump:f};
    render();
  }
  else if(a==="log") logSet();
  else if(a==="skiprest"){ U.rest=0; clearInterval(U.restT); paintRest(); }
  else if(a==="restplus") restPlus();
  else if(a==="flashoff"){ U.flash=null; render(); }
  else if(a==="again") againSet();
  else if(a==="export") exportSave();
  else if(a==="import") document.getElementById("fileIn").click();
  else if(a==="pic") document.getElementById("picIn").click();
  else if(a==="picdel"){ if(confirm("Remove your photo?")){ S.pic=null; persist(); publish(); render(); } }
  else if(a==="std"){ S.stdScale=Number(b.dataset.v); persist(); publish(); render(); }
  else if(a==="dismissaway"){ S.away=null; persist(); render(); }
  else if(a==="saveserver"){ saveServer(document.getElementById("sbUrl").value,document.getElementById("sbKey").value,()=>{
      MP.status="offline"; render(); if(cloudOn()) alert("Server saved. Switch account and sign back in with your name and PIN to link this device to it."); }); }
  else if(a==="metric"){ U.metric=b.dataset.v; render(); }
  else if(a==="scope"){ U.scope=b.dataset.v; render(); }
  else if(a==="crewcreate"){
    const nm=String(document.getElementById("crewName").value||"").trim();
    if(nm.length<2) return alert("Give the crew a name first.");
    S.crew={id:newCrewCode(nm),name:nm.slice(0,22)}; S.crewOwner=true; S.crewBans=[];
    persist(); publish(); render();
  }
  else if(a==="crewjoin"){
    const code=slugify0(document.getElementById("crewCode").value);
    if(code.length<3) return alert("Paste the invite code you were sent.");
    const hit=Object.values(MP.board).find(p=>p.crew===code);
    if(!hit && !confirm("Nobody with that code is on the board yet. Join anyway?")) return;
    S.crew={id:code,name:(hit&&hit.crewName)||code}; S.crewOwner=false; S.crewBans=[];
    persist(); publish(); render();
  }
  else if(a==="crewleave"){
    if(!confirm("Leave this crew? Your training and records are untouched.")) return;
    S.crew=null; S.crewOwner=false; S.crewBans=[]; U.scope="all";
    persist(); publish(); render();
  }
  else if(a==="crewrename"){
    const nm=(prompt("New crew name",(S.crew&&S.crew.name)||"")||"").trim();
    if(nm.length<2) return;
    S.crew.name=nm.slice(0,22); persist(); publish(); render();
  }
  else if(a==="crewkick"){
    const id=b.dataset.i, who=(MP.board[id]&&MP.board[id].name)||id;
    if(!confirm("Remove "+who+" from the crew?")) return;
    if(!S.crewBans.includes(id)) S.crewBans.push(id);
    persist(); publish(); render();
  }
  else if(a==="crewcopy"){
    const code=crewId();
    if(navigator.clipboard) navigator.clipboard.writeText(code).then(()=>alert("Invite code copied:\n"+code),()=>prompt("Invite code",code));
    else prompt("Invite code",code);
  }
  else if(a==="crewmission"){ /* deliberately inert until crew missions ship */ }
  else if(a==="rgroup"){ U.rgroup=b.dataset.v; render(); }
  else if(a==="sync"){ if(!MP.loading){ MP.loading=true; render();
      publish().then(refreshBoard).then(()=>{ MP.loading=false; render(); }); } }
  else if(a==="logout"){ if(confirm("Switch account? This device keeps every account's training separately.")){
      MP.board={}; MP.ready=false; clearTimeout(MP.pushT);
      STORE.set("null","liftmania:me").then(()=>{ S=null; MP.me=null; U.tab="train"; lastView=null; renderLogin(); }); } }
  else if(a==="wipe"){ if(confirm("Wipe all progress on this account? This cannot be undone.")){
    S=migrate(null); rollDaily(); persist(); U.tab="train"; render(); } }
});

/* opening a challenge loads the steppers with the number you would have to
   beat, so the first tap is already aimed at your own record */
function openChal(id){
  U.openChal=id; if(!id) return;
  const c=chalOf(id), pb=chalVal(id);
  if(c.kind==="load"){ U.attV=pb||10; U.attR=8; }
  else U.attV=pb||(c.kind==="hold"?30:10);
}

function pickEx(id){
  U.ex=id; const l=S.last[id], e=byId(id);
  if(l){ U.sets=l.sets; U.reps=l.reps; U.load=l.load; }
  else { U.sets=3; U.reps=e.mode==="time"?30:10; U.load=e.mode==="load"?10:0; }
  U.sd = e.s==="opt" ? ((l&&l.sd)||e.sd) : e.s;
}

/* ══════════════════ SIGN IN ══════════════════ */
function saveServer(url,key,done){
  url=String(url||"").trim().replace(/\/$/,""); key=String(key||"").trim();
  if(!url||!key){ try{ localStorage.removeItem("liftmania:server"); }catch(e){} }
  else{ try{ localStorage.setItem("liftmania:server",JSON.stringify({url,key})); }
        catch(e){ alert("This browser is blocking storage, so the server settings can't be saved here. Paste them into the file instead."); } }
  done&&done();
}
function renderLogin(err,busy,keepName){
  document.getElementById("app").innerHTML=`<div class="login">
    <div style="text-align:center">
      <div class="disp" style="font-size:36px">LIFTMANIA</div>
      <div class="mini" style="margin-top:6px">ten challenges · one crew · one board</div>
      <div class="themebox" style="display:inline-flex;margin-top:14px">${THEMES.map(t=>`<button class="theme-pill ${U.theme===t.id?"active":""}" data-l="theme" data-v="${t.id}" title="${t.title}" aria-label="${t.title}">${t.label}</button>`).join("")}</div>
    </div>
    <section class="card">
      <div class="chead"><h2 class="ctitle">Who's lifting?</h2></div>
      <div class="body">
        <input class="lin" id="inName" placeholder="NAME" maxlength="14" autocomplete="off" autocapitalize="characters" value="${esc(keepName||"")}">
        <div class="lreveal" id="lreveal">
          <div class="lstate" id="lstate"></div>
          <input class="lin" id="inPin" inputmode="numeric" maxlength="4" placeholder="4-DIGIT PIN" autocomplete="off" style="margin-top:12px">
          ${err?`<div class="prline" style="margin-top:9px;border-color:var(--red);color:var(--red)">${esc(err)}</div>`:""}
          <button class="cta" id="loginCta" style="margin-top:12px" data-l="go">${busy?"CHECKING…":"START LIFTING"}</button>
        </div>
        <div class="mini" id="lhint" style="margin-top:12px">Type your name. A new one starts a new account.</div>
      </div>
    </section>
    <section class="card" style="--accent:${cloudOn()?"var(--green)":"var(--dim)"}">
      <div class="chead"><h2 class="ctitle">${cloudOn()?"Server connected":"No server"}</h2></div>
      <div class="body">${cloudOn()
        ?`<div class="mini">Accounts, the board and the live feed all run off your Supabase project. Nothing to save by hand.</div>`
        :`<div class="mini">Without a server your account and records stay on this device.</div>
          <input type="text" id="sbUrl" placeholder="https://xxxx.supabase.co" style="width:100%;margin-top:9px">
          <input type="text" id="sbKey" placeholder="anon public key" style="width:100%;margin-top:7px">
          <button class="ghost wide" style="margin-top:9px" data-l="server">connect server</button>`}
      </div>
    </section>
  </div>`;
  document.getElementById("app").className="enter";
  const pin=document.getElementById("inPin"), nm=document.getElementById("inName");
  pin.addEventListener("keydown",ev=>{ if(ev.key==="Enter") doLogin(nm.value,pin.value); });
  /* Enter on the name skips the wait */
  nm.addEventListener("keydown",ev=>{ if(ev.key==="Enter"){ ev.preventDefault(); clearTimeout(LG.t); clearTimeout(LG.t2); startSearch(true); } });
  nm.addEventListener("input",()=>{
    clearTimeout(LG.t); clearTimeout(LG.t2);
    hideReveal();
    LG.t=setTimeout(startSearch,SETTLE_MS);
  });
  LG.mode=null;
  loadRoll();
  /* a name carried over from a failed attempt should not make you wait again */
  if(keepName) startSearch(true); else hideReveal();
}

/* ══════════════════ SIGN-IN REVEAL ══════════════════
   Nothing but the name field while you type. Stop, and a spinner shows the
   lookup running; then the PIN and a button that already knows whether it is
   a log-in or a sign-up fade in. Roughly 1.4s end to end. */
const SETTLE_MS=420, SEARCH_MS=520;

const hintEl=()=>document.getElementById("lhint");
function setHint(html){ const h=hintEl(); if(h){ h.style.display=""; h.innerHTML=html; } }

function hideReveal(){
  const r=document.getElementById("lreveal");
  if(r) r.classList.remove("on");
  LG.pending=false;
  setHint("Type your name. A new one starts a new account.");
  LG.mode=null;
}
/* stage one: the name has settled, show that we are looking it up */
function startSearch(now){
  const nm=document.getElementById("inName"), r=document.getElementById("lreveal");
  if(!nm||!r) return;
  if(slugify(nm.value).length<2){
    r.classList.remove("on");
    setHint("Names need at least two letters or numbers.");
    return;
  }
  setHint('<span class="spin"></span><span>Checking that name\u2026</span>');
  clearTimeout(LG.t2);
  LG.t2=setTimeout(openReveal, now?0:SEARCH_MS);
}
/* stage two: the answer is in (or the roll never arrives) */
function openReveal(){
  const r=document.getElementById("lreveal"), hint=hintEl();
  if(!r) return;
  if(cloudOn() && !LG.ids){ LG.pending=true; return; }   /* keep spinning */
  LG.pending=false;
  paintLoginState();
  /* clear it, or the spinner keeps turning inside a hidden element */
  if(hint){ hint.style.display="none"; hint.innerHTML=""; }
  r.classList.add("on");
}

/* ══════════════════ IS THAT NAME TAKEN? ══════════════════ */
const LG={ids:null,err:false,mode:null,t:null,t2:null,pending:false,loading:false};

async function loadRoll(){
  if(LG.ids||LG.loading) return;
  if(!cloudOn()){ LG.ids=new Set(); return; }
  LG.loading=true;
  try{
    const rows=await rpc("lm_board",{});
    LG.ids=new Set((rows||[]).map(r=>String(r.id)));
    LG.err=false;
  }catch(e){ LG.ids=new Set(); LG.err=true; }
  LG.loading=false;
  LG.mode=null;
  const r=document.getElementById("lreveal");
  if(LG.pending) openReveal();                       /* it was waiting on this */
  else if(r&&r.classList.contains("on")) paintLoginState();
}

/* [button, icon, headline, detail, accent] */
const LOGIN_COPY={
  empty:  ["START LIFTING","","","","var(--line)"],
  looking:["CHECKING…","clock","Checking that name","One moment.","var(--line)"],
  known:  ["LOG IN","users","NAME already has an account",
           "Welcome back. Enter the 4-digit PIN you set for it.","var(--cobalt)"],
  fresh:  ["CREATE ACCOUNT","spark","NAME is not taken yet",
           "This will be a brand new account. Choose a 4-digit PIN for it — you'll need it to sign in anywhere else.","var(--green)"],
  local:  ["START LIFTING","gear","No server connected",
           "This account stays on this device only.","var(--line)"],
  unknown:["START LIFTING","alert","Couldn't check that name",
           "The server didn't answer. Signing in will still work.","var(--red)"]
};

function paintLoginState(){
  const nm=document.getElementById("inName"), cta=document.getElementById("loginCta"),
        st=document.getElementById("lstate"), pin=document.getElementById("inPin");
  if(!nm||!cta||!st) return;
  const raw=String(nm.value||"").trim(), id=slugify(raw);
  let mode;
  if(id.length<2)      mode="empty";
  else if(!cloudOn())  mode="local";
  else if(!LG.ids)     mode="looking";
  else if(LG.err)      mode="unknown";
  else                 mode=LG.ids.has(id)?"known":"fresh";

  if(mode===LG.mode) return;          /* nothing changed, do not replay */
  LG.mode=mode;
  const c=LOGIN_COPY[mode], who=esc(raw.toUpperCase());
  cta.textContent=c[0];
  cta.className="cta"+(mode==="known"?" alt":"");
  st.style.setProperty("--accent",c[4]);
  st.innerHTML=(c[1]?ico(c[1]):"")
    +`<div><b>${c[2].replace("NAME",who)}</b><em>${c[3].replace("NAME",who)}</em></div>`;
  if(pin) pin.placeholder = mode==="known" ? "YOUR PIN" : mode==="fresh" ? "CHOOSE A NEW PIN" : "4-DIGIT PIN";
  /* restart both animations from the top */
  [cta,st].forEach(el=>{ el.classList.remove("swap"); void el.offsetWidth; el.classList.add("swap"); });
}

document.getElementById("app").addEventListener("click",e=>{
  const b=e.target.closest("[data-l]"); if(!b) return;
  if(b.dataset.l==="go") doLogin(document.getElementById("inName").value,document.getElementById("inPin").value);
  else if(b.dataset.l==="server") saveServer(document.getElementById("sbUrl").value,document.getElementById("sbKey").value,()=>renderLogin());
  else if(b.dataset.l==="theme"){ const n=document.getElementById("inName"); const keep=n?n.value:"";
    U.theme=b.dataset.v||"night"; applyTheme(); renderLogin("",false,keep); }
});

async function doLogin(name,pin){
  name=String(name||"").trim().slice(0,14);
  pin=String(pin||"").trim();
  const id=slugify(name);
  if(id.length<2) return renderLogin("Names need at least 2 letters or numbers.",false,name);
  if(!/^\d{4}$/.test(pin)) return renderLogin("The PIN is exactly 4 digits.",false,name);

  if(cloudOn()){
    renderLogin("",true,name);
    try{
      const rows=await rpc("lm_login",{p_id:id,p_name:name,p_pin:pin});
      const row=Array.isArray(rows)?rows[0]:rows;
      if(!row||!row.token) throw new Error("Server didn't return an account");
      MP.me={id:row.id||id,name:row.name||name,token:row.token};
      MP.status="live";
      if(LG.ids) LG.ids.add(MP.me.id);
    }catch(e){
      const m=String(e.message||e);
      return renderLogin(/bad pin/i.test(m)
        ? `${name.toUpperCase()} already has an account and that isn't its PIN. Try again, or pick a different name to start a new account.`
        : `Couldn't reach the server: ${m}`, false, name);
    }
  } else {
    MP.me={id,name,token:null};
  }
  await STORE.set(JSON.stringify(MP.me),"liftmania:me");
  await startSession();
}

/* ══════════════════ BOOT ══════════════════ */
async function startSession(){
  KEY="liftmania:save:"+MP.me.id;
  let raw=await STORE.get(KEY);
  if(!raw && !(await STORE.get("liftmania:claimed"))){
    for(const k of LEGACY){ const v=await STORE.get(k); if(v){ raw=v; break; } }
    if(raw) await STORE.set("1","liftmania:claimed");
  }
  let parsed=null;
  if(raw){ try{ parsed=JSON.parse(raw); }catch(e){} }
  if(parsed && (parsed.app==="liftmania"||parsed.app==="iron-run") && parsed.save) parsed=parsed.save;
  S=migrate(parsed);
  const away=applyDecay();
  if(away) S.away=away;
  rollDaily(); pickEx(U.ex); await persist();
  render();
  if(cloudOn()){ await cloudPull(); await refreshBoard(); rollDaily(); render(); }
  else MP.ready=true;
}

(async function(){
  try{ const savedTheme=localStorage.getItem("liftmania:theme"); if(savedTheme && THEMES.some(t=>t.id===savedTheme)) U.theme=savedTheme; }catch(e){}
  applyTheme();
  await STORE.init();
  let me=null;
  try{ me=JSON.parse(await STORE.get("liftmania:me")||"null"); }catch(e){}
  if(me && me.id && (!cloudOn() || me.token)){ MP.me=me; await startSession(); }
  else renderLogin();
})();
</script>
