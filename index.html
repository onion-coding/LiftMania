<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12102B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LiftMania">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LiftMania</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap');

:root{
  --night:#12102B; --panel:#1E1946; --panel2:#2A2361; --line:#38307A; --deep:#0C0A20;
  --cobalt:#3D6BFF; --magenta:#FF3D9A; --green:#00E88C; --gold:#FFC53D;
  --cream:#F2EDFF; --dim:#B6ADDD; --red:#FF6B5E;
  --d:'Bungee',Impact,'Haettenschweiler','Arial Narrow Bold',sans-serif;
  --b:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --m:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--night);color:var(--cream);font-family:var(--b);
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
#app{max-width:480px;margin:0 auto;padding:18px 14px 40px;display:flex;flex-direction:column;gap:12px}
button{cursor:pointer;font-family:inherit;border:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px}
.eyebrow{font-family:var(--m);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.disp{font-family:var(--d);line-height:1.05}
.mono{font-family:var(--m)}
.row{display:flex;justify-content:space-between;align-items:baseline}
.muted{color:var(--dim);font-size:13px;line-height:1.45}
.track{position:relative;background:var(--deep);border-radius:99px;overflow:hidden;width:100%}
.fill{position:absolute;inset:0 auto 0 0;border-radius:99px;transition:width .7s cubic-bezier(.2,.8,.2,1)}

header{display:flex;justify-content:space-between;align-items:flex-end}
.tabs{display:flex;gap:6px}
.tab{flex:1;border-radius:12px;padding:9px 1px;background:transparent;color:var(--dim);
  border:1px solid var(--line);font-family:var(--d);font-size:9.5px;letter-spacing:-.01em}
.tab.on{background:var(--gold);color:var(--night);border-color:var(--gold)}

/* league */
.lrow{display:flex;align-items:center;gap:9px;padding:10px 8px;border-top:1px solid var(--line)}
.lrow:first-of-type{border-top:none}
.lrow.me{background:linear-gradient(90deg,rgba(255,197,61,.14),transparent);border-radius:10px}
.rk{width:27px;height:27px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;
  font-family:var(--d);font-size:11px;background:var(--panel2);color:var(--dim)}
.rk.g1{background:var(--gold);color:var(--night)}
.rk.g2{background:#CFC7EE;color:var(--night)}
.rk.g3{background:#C4813C;color:var(--night)}
.pname{font-weight:700;font-size:14px;line-height:1.2}
.pstat{font-family:var(--m);font-size:10px;color:var(--dim);margin-top:2px}
.pbig{font-family:var(--m);font-size:15px;color:var(--gold);margin-left:auto;flex:none;text-align:right}
.pbig span{font-size:10px;color:var(--dim)}
.login{min-height:72vh;display:flex;flex-direction:column;justify-content:center;gap:14px}
.lin{width:100%;height:46px;text-align:center;font-size:17px;letter-spacing:.06em}

.chips{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.gchip{border-radius:9px;padding:6px 9px;white-space:nowrap;font-size:12px;font-weight:700;
  background:var(--panel2);color:var(--dim)}
.exwrap{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.exchip{border-radius:9px;padding:7px 9px;font-size:13px;background:transparent;color:var(--cream);
  border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.exchip.on{background:var(--cream);color:var(--night);border-color:var(--cream)}
.exchip.hit{border-color:var(--gold)}
.tag{font-family:var(--m);font-size:9px;letter-spacing:.06em;padding:2px 4px;border-radius:4px;
  background:var(--panel2);color:var(--dim);flex:none}
.exchip.on .tag{background:var(--night);color:var(--cream)}
.tag.hold{background:#4A2E6E;color:#E6C9FF}
.tag.kg{background:#1F3F7A;color:#B9D2FF}
.tag.bw{background:#2E4A3C;color:#B6F0D4}
.exchip.on .tag.hold,.exchip.on .tag.kg,.exchip.on .tag.bw{opacity:.85}
.sidebox{margin-top:10px;padding:9px 11px;border-radius:10px;border:1px solid;background:var(--deep)}
.exchip .side{font-family:var(--m);font-size:9px;color:var(--magenta);flex:none}
.prline{margin-top:8px;padding:8px 10px;border-radius:10px;border:1px solid;font-size:12px;line-height:1.45;background:var(--deep)}
.recrow{padding:10px 0;border-bottom:1px solid var(--line)}
.recstats{display:flex;flex-wrap:wrap;gap:10px;margin-top:5px;font-family:var(--m);font-size:11px;color:var(--dim)}
.recstats b{color:var(--gold);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px;font-family:var(--m);font-size:10px;color:var(--dim)}
.expand{margin-top:9px;padding:10px;border-radius:10px;background:var(--deep);border:1px solid var(--line)}
.qhead{font-family:var(--m);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:7px}
.qchip{border-radius:8px;padding:5px 8px;font-size:12px;background:var(--panel2);color:var(--cream);
  border:1px solid var(--line);margin:0 4px 4px 0}
.tapme{font-family:var(--m);font-size:10px;color:var(--gold);margin-top:4px}
.objbtn{width:100%;text-align:left;background:transparent;padding:0}
.filt{border-radius:8px;padding:5px 9px;font-size:11px;font-family:var(--m);background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
.filt.on{background:var(--gold);color:var(--night);border-color:var(--gold)}

.steppers{display:flex;gap:8px;margin-top:12px}
.stepper{flex:1;min-width:0}
.sbtn{width:34px;height:44px;border-radius:10px;background:var(--panel2);color:var(--cream);font-size:19px}
input.sval{flex:1;height:44px;border-radius:10px;background:var(--deep);color:var(--cream);
  font-family:var(--m);font-size:16px;text-align:center;border:1px solid transparent;
  min-width:0;width:100%;padding:0;-webkit-appearance:none}
input.sval:focus{border-color:var(--gold);outline:none;background:#0A0818}
.srow{display:flex;align-items:center;gap:4px;margin-top:5px}

.cta{width:100%;border-radius:12px;padding:14px 0;background:var(--green);color:var(--night);
  font-family:var(--d);font-size:15px;margin-top:12px}
.ghost{border-radius:10px;padding:9px 12px;background:transparent;color:var(--dim);
  border:1px solid var(--line);font-family:var(--m);font-size:11px}
.gate{display:inline-block;border-radius:8px;padding:4px 8px;background:var(--panel2);
  font-family:var(--m);font-size:11px;margin-top:9px}

.obj{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.obj:first-of-type{border-top:none}
.box{width:20px;height:20px;border-radius:6px;border:1px solid var(--line);flex:none;margin-top:2px;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--night)}
.box.done{background:var(--green);border-color:var(--green)}

.bosscard{border-radius:12px;padding:11px;border:1px solid var(--line)}
.bosscard.cur{background:var(--panel2);border-color:var(--cobalt)}
.bosscard.done{opacity:.4}
.bosscard.done .bname{text-decoration:line-through}
.acthead{font-family:var(--d);font-size:12px;color:var(--gold);margin:14px 0 4px;letter-spacing:.04em}

#fx{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 45%,rgba(0,232,140,.14),rgba(6,4,18,.93) 60%);
  padding:24px;text-align:center;overflow:hidden}
#fx.on{display:flex}
.shake{animation:shake .65s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.slam{animation:slam .6s cubic-bezier(.2,1.5,.3,1) both}
@keyframes slam{0%{transform:scale(2.7);opacity:0;letter-spacing:.45em;filter:blur(7px)}
  55%{opacity:1}100%{transform:scale(1);opacity:1;letter-spacing:.01em;filter:blur(0)}}
.ring{position:absolute;border-radius:50%;border:2px solid var(--green);animation:ring 1.2s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes ring{from{width:0;height:0;opacity:.95}to{width:150vmax;height:150vmax;opacity:0}}
.spark{position:absolute;width:7px;height:7px;border-radius:2px;animation:spark 1.2s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes spark{from{transform:translate(0,0) scale(1.2) rotate(0);opacity:1}
  to{transform:translate(var(--dx),var(--dy)) scale(.15) rotate(220deg);opacity:0}}
.fxcard{position:relative;z-index:2;max-width:340px}
.rise{animation:rise .55s .3s both}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.actban{display:inline-block;border-radius:12px;padding:10px 18px;background:var(--gold);color:var(--night);
  font-family:var(--d);font-size:13px;transform-origin:center;animation:sweepin .75s .4s both}
@keyframes sweepin{from{transform:scaleX(.04) skewX(-18deg);opacity:0}}
.crack{height:14px;margin:14px 0;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--gold),var(--magenta));
  animation:crack .7s cubic-bezier(.6,0,.9,.2) forwards}
@keyframes crack{0%{transform:scaleX(1);opacity:1}70%{transform:scaleX(1.05);opacity:1}
  100%{transform:scaleX(0);opacity:0}}
.tapdis{animation:fadein 1s 1.3s both}
@keyframes fadein{from{opacity:0}}
.pop{animation:pop .4s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.86);opacity:0}}
@keyframes popdup{from{transform:scale(.86);opacity:0}}
.week{display:flex;gap:4px}
.wday{flex:1;text-align:center;border-radius:9px;padding:7px 2px;border:1px solid var(--line);
  font-family:var(--m);font-size:10px;color:var(--dim)}
.wday.p{background:var(--panel2);color:var(--cream)}
.wday.f{background:var(--green);color:var(--night);border-color:var(--green)}
.wday.today{border-color:var(--gold);border-width:2px}
input[type=text],input[type=number]{background:var(--deep);color:var(--cream);border:1px solid var(--line);
  border-radius:9px;padding:8px;font-family:var(--m);font-size:14px}
textarea{width:100%;background:var(--deep);color:var(--cream);border:1px solid var(--line);
  border-radius:9px;padding:8px;font-family:var(--m);font-size:11px;min-height:70px}
.banner{border-radius:12px;padding:11px;background:var(--gold);color:var(--night);font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="fx"></div>
<a id="dl" style="display:none"></a>
<input id="fileIn" type="file" accept=".json,application/json" style="display:none">

<script>
"use strict";

/* ══════════════════ MUSCLE GROUPS ══════════════════ */
const GROUPS = {
  chest:{name:"Chest",c:"#FF6B5E"}, back:{name:"Back",c:"#3D6BFF"},
  shoulders:{name:"Shoulders",c:"#FFC53D"}, biceps:{name:"Biceps",c:"#00E88C"},
  triceps:{name:"Triceps",c:"#00C4E8"}, legs:{name:"Legs",c:"#FF3D9A"},
  core:{name:"Core",c:"#B78CFF"}
};
const GK = Object.keys(GROUPS);

/* mode: bw = bodyweight × leverage · load = external kg · bwload = bodyweight + added · time = seconds */
const EX = [
  {id:"pushup",n:"Push-up",g:"chest",mode:"bw",f:.64,s:"both"},
  {id:"incpush",n:"Incline push-up",g:"chest",mode:"bw",f:.50,s:"both"},
  {id:"decpush",n:"Decline push-up",g:"chest",mode:"bw",f:.75,s:"both"},
  {id:"defpush",n:"Deficit push-up",g:"chest",mode:"bw",f:.70,s:"both"},
  {id:"archer",n:"Archer push-up",g:"chest",mode:"bw",f:.85,s:"each"},
  {id:"cpress",n:"Cable chest press",g:"chest",mode:"load",s:"opt",sd:"both"},
  {id:"cfly",n:"Cable fly",g:"chest",mode:"load",s:"opt",sd:"both"},

  {id:"crow",n:"Cable row",g:"back",mode:"load",s:"opt",sd:"both"},
  {id:"clat",n:"Cable lat pulldown",g:"back",mode:"load",s:"opt",sd:"both"},
  {id:"csap",n:"Straight-arm pulldown",g:"back",mode:"load",s:"opt",sd:"both"},
  {id:"cpullover",n:"Cable pullover",g:"back",mode:"load",s:"both"},
  {id:"trow",n:"Inverted row (table)",g:"back",mode:"bw",f:.60,s:"both"},
  {id:"sman",n:"Superman hold",g:"back",mode:"time",f:.20,s:"both"},

  {id:"pike",n:"Pike push-up",g:"shoulders",mode:"bw",f:.60,s:"both"},
  {id:"cohp",n:"Cable shoulder press",g:"shoulders",mode:"load",s:"opt",sd:"both"},
  {id:"lat",n:"Lateral raise",g:"shoulders",mode:"load",s:"opt",sd:"each"},
  {id:"front",n:"Front raise",g:"shoulders",mode:"load",s:"opt",sd:"each"},
  {id:"face",n:"Face pull",g:"shoulders",mode:"load",s:"both"},
  {id:"upright",n:"Upright row",g:"shoulders",mode:"load",s:"both"},

  {id:"curl",n:"Bicep curl",g:"biceps",mode:"load",s:"opt",sd:"each"},
  {id:"hammer",n:"Hammer curl",g:"biceps",mode:"load",s:"opt",sd:"each"},
  {id:"ccurl",n:"Cable curl",g:"biceps",mode:"load",s:"opt",sd:"each"},
  {id:"conc",n:"Concentration curl",g:"biceps",mode:"load",s:"each"},
  {id:"rcurl",n:"Reverse curl",g:"biceps",mode:"load",s:"opt",sd:"each"},
  {id:"21s",n:"Twenty-ones",g:"biceps",mode:"load",s:"opt",sd:"each"},

  {id:"diamond",n:"Diamond push-up",g:"triceps",mode:"bw",f:.70,s:"both"},
  {id:"dip",n:"Chair dip",g:"triceps",mode:"bw",f:.70,s:"both"},
  {id:"pdown",n:"Cable pushdown",g:"triceps",mode:"load",s:"opt",sd:"both"},
  {id:"ohext",n:"Overhead extension",g:"triceps",mode:"load",s:"opt",sd:"both"},
  {id:"kickback",n:"Cable kickback",g:"triceps",mode:"load",s:"each"},

  {id:"squat",n:"Bodyweight squat",g:"legs",mode:"bw",f:.50,s:"both"},
  {id:"goblet",n:"Goblet squat",g:"legs",mode:"bwload",f:.50,s:"both"},
  {id:"split",n:"Split squat",g:"legs",mode:"bw",f:.85,s:"each"},
  {id:"bulg",n:"Bulgarian split squat",g:"legs",mode:"bw",f:.95,s:"each"},
  {id:"lunge",n:"Reverse lunge",g:"legs",mode:"bw",f:.60,s:"opt",sd:"each"},
  {id:"rdl",n:"Romanian deadlift",g:"legs",mode:"load",s:"opt",sd:"both"},
  {id:"pthru",n:"Cable pull-through",g:"legs",mode:"load",s:"both"},
  {id:"nordic",n:"Hamstring slider curl",g:"legs",mode:"bw",f:.70,s:"opt",sd:"both"},
  {id:"calf",n:"Calf raise",g:"legs",mode:"bw",f:.90,s:"opt",sd:"both"},
  {id:"bridge",n:"Glute bridge",g:"legs",mode:"bw",f:.40,s:"opt",sd:"both"},
  {id:"wallsit",n:"Wall sit",g:"legs",mode:"time",f:.50,s:"both"},
  {id:"burpee",n:"Burpee",g:"legs",mode:"bw",f:.70,s:"both"},
  {id:"jsquat",n:"Jump squat",g:"legs",mode:"bw",f:.70,s:"both"},
  {id:"stepup",n:"Step-up",g:"legs",mode:"bwload",f:.65,s:"each"},

  {id:"plank",n:"Plank",g:"core",mode:"time",f:.30,s:"both"},
  {id:"splank",n:"Side plank",g:"core",mode:"time",f:.42,s:"each"},
  {id:"hollow",n:"Hollow hold",g:"core",mode:"time",f:.35,s:"both"},
  {id:"lsit",n:"L-sit / tuck hold",g:"core",mode:"time",f:.60,s:"both"},
  {id:"lraise",n:"Leg raise",g:"core",mode:"bw",f:.30,s:"both"},
  {id:"ccrunch",n:"Cable crunch",g:"core",mode:"load",s:"both"},
  {id:"chop",n:"Cable woodchop",g:"core",mode:"load",s:"each"},
  {id:"pallof",n:"Pallof press",g:"core",mode:"load",s:"each"},
  {id:"twist",n:"Russian twist",g:"core",mode:"load",s:"opt",sd:"both"},
  {id:"mclimb",n:"Mountain climbers",g:"core",mode:"bw",f:.25,s:"opt",sd:"both"},
  {id:"deadbug",n:"Dead bug",g:"core",mode:"bw",f:.20,s:"opt",sd:"both"}
];
const byId = id => EX.find(e=>e.id===id) || EX[0];

/* ══════════════════ 100 BOSSES ══════════════════ */
const G=(g)=>({g}), L=(g,minLoad)=>({g,minLoad}), R=(g,minReps)=>({g,minReps}),
      T=(g)=>({g,time:true}), RA=(minReps)=>({minReps}), LA=(minLoad)=>({minLoad}), TA=()=>({time:true});

const ACT_NAMES=["I · Foundation","II · The Push","III · The Pull","IV · The Base","V · The Core",
                 "VI · The Furnace","VII · Iron","VIII · Endurance","IX · The Mirror","X · Ripped"];

const ROSTER = [
/* I */
["The Snooze Button",null,"Undefeated every morning so far."],
["Bad Form",null,"Slow the rep down. It hates that."],
["Cold Start",null,"The first two minutes are the worst."],
["The Two-Week Wall",null,"Where most attempts quietly end."],
["Rest Day Forever",null,"Very convincing. Very patient."],
["Sock Drawer Squats",G("legs"),"Ten squats before socks. That's the whole fight."],
["Wall Pusher",G("chest"),"Any chest work lands."],
["Dead Hang Doubt",G("back"),"Pull something toward you."],
["The Shaky Plank",T("core"),"Thirty seconds is a start."],
["Consistency",null,"The only boss that never gets weaker."],
/* II */
["Pancake Chest",G("chest"),"Flat, and proud of it."],
["The Floor Says No",R("chest",10),"Chest to the ground or nothing."],
["Shoulder Gremlin",G("shoulders"),"Lives in your rear delts."],
["Tricep Ghost",G("triceps"),"Two-thirds of your arm, ignored."],
["Bench Envy",R("chest",12),"Volume beats ego here."],
["The Lockout",R("triceps",12),"Finish every single rep."],
["Deltoid Drought",L("shoulders",8),"Load it, even lightly."],
["Incline Denial",G("chest"),"Feet up. Now try."],
["Pike Warden",R("shoulders",10),"Hips high, head down."],
["The Press",L("chest",15),"Fifteen kilos through the palms."],
/* III */
["Desk Posture",G("back"),"Eight hours a day of quiet damage."],
["The Lat Void",G("back"),"Nothing there yet. Fill it."],
["Sleeve Filler",G("biceps"),"Curls. Just curls."],
["The Curl Judge",L("biceps",12),"Under 12kg it doesn't look up."],
["Rowing Debt",R("back",12),"You owe your back a decade."],
["Iron Elbow",L("biceps",18),"Load it or leave."],
["Rear Delt Recluse",R("shoulders",15),"High reps or it hides."],
["Grip Slip",L("back",20),"Every pull ends at your hands."],
["The Peak",R("biceps",12),"Squeeze at the top. It's watching."],
["Scapular Silence",G("back"),"Nobody trains what they can't see."],
/* IV */
["Chicken Legs",G("legs"),"The oldest insult there is."],
["Stair Dread",G("legs"),"Third floor. No lift."],
["Quad Tyrant",R("legs",15),"Rules the front of the thigh."],
["Hamstring Hermit",R("legs",12),"Never trained, always injured."],
["Calf Skeptic",R("legs",25),"Doesn't believe in low reps."],
["The Bulgarian",R("legs",10),"One leg. All of it."],
["Glute Amnesia",G("legs"),"It forgot how to fire."],
["Knee Whisper",R("legs",20),"Blood, not load."],
["Wall Sit Warden",T("legs"),"Time is the only currency it takes."],
["Load Bearing",L("legs",20),"Hold something heavy and squat."],
/* V */
["The Soft Middle",G("core"),"Last to go. First to be seen."],
["Hollow King",T("core"),"Only holds land here."],
["Oblique Serpent",G("core"),"Coils around the ribs."],
["Breathing Room",R("core",20),"Twenty or it doesn't count."],
["The Lower Two",R("core",15),"Everyone stops at four."],
["Anti-Rotation",L("core",10),"Resist the twist."],
["Dead Bug Dominion",R("core",20),"Boring. Effective. Undefeated."],
["Side Gate",T("core"),"Both sides. Every time."],
["The Brace",L("core",12),"Loaded, or it's just a stretch."],
["Midline",G("core"),"Everything else runs through here."],
/* VI */
["Lung Burner",RA(25),"Any muscle. Twenty-five a set."],
["The Sweat Line",null,"Everything you have, all week."],
["Set Seven",RA(15),"The one you usually skip."],
["The Long Tuesday",null,"Nothing special happened. You trained anyway."],
["Burpee Tax",R("legs",20),"Nobody enjoys paying it."],
["Second Round",RA(20),"Go back and do the whole thing again."],
["The Drop Set",RA(30),"Thirty. No rest to hide in."],
["Heart Rate",R("legs",25),"Legs move the most blood."],
["The Finisher",RA(20),"Last thing before the shower."],
["No Excuses Left",null,"It has read all of them."],
/* VII */
["Mirror Check",L("chest",20),"Heavy chest only."],
["The Pump Thief",L("biceps",22),"22kg curls. Non-negotiable."],
["Shoulder Vault",L("shoulders",15),"Locked from the outside."],

const HOLD_HP=0.28;
const ENDLESS=[null,G("legs"),G("chest"),G("back"),RA(25),L("biceps",32),T("core"),G("shoulders"),LA(35),R("legs",30)];
/* Boss HP is not an absolute number — it's a week of YOUR output.
   baseWeek is calibrated from your first six training days, then locked.
   The demand then climbs on a decelerating curve: ~2.5% per boss early,
   under 1% per boss late, reaching ~2.9× your starting output by boss 100.
   Keep up and each boss falls in about a week. Coast and they don't. */
const DEMAND_BASE=6000;
const demandMult = i => Math.pow(1+i*0.035, 0.72);
const baseWeek = () => Math.max(2500, (S && S.baseWeek) || DEMAND_BASE);
const paceDays = () => (S && S.pace) || 7;
const bossHp = i => Math.round(baseWeek()*(paceDays()/7)*demandMult(i)/10)*10;
function bossAt(i){
  if(i<ROSTER.length){
    const [name,gate,flavor]=ROSTER[i];
    return {i,name,gate,flavor,hp:Math.round(bossHp(i)*(gate&&gate.time?HOLD_HP:1)/10)*10,act:ACT_NAMES[Math.floor(i/10)]};
  }
  const k=i-ROSTER.length;
  return {i,name:"The Ceiling +"+(k+1),gate:ENDLESS[k%ENDLESS.length],flavor:"Nobody has cleared this one yet.",
    hp:Math.round(bossHp(99)*Math.pow(1.12,k+1)*(ENDLESS[k%ENDLESS.length]&&ENDLESS[k%ENDLESS.length].time?HOLD_HP:1)/50)*50, act:"XI · Endless"};
}
function gateText(gt){
  if(!gt) return "Takes any work";
  const b=[];
  if(gt.g) b.push(GROUPS[gt.g].name.toLowerCase()+" only");
  if(gt.minLoad) b.push(gt.minLoad+"kg+ per rep");
  if(gt.minReps) b.push("sets of "+gt.minReps+"+");
  if(gt.time) b.push("holds only");
  return b.join(" · ");
}
const gatePass=(gt,e)=> !gt ? true :
  !((gt.g&&e.g!==gt.g)||(gt.minLoad&&e.prk<gt.minLoad)
    ||(gt.minReps&&(e.mode==="time"||e.reps<gt.minReps))||(gt.time&&e.mode!=="time"));

/* which exercises can ever satisfy a gate, given your bodyweight */
function gateQualifiers(gt,bw){
  if(!gt) return EX;
  return EX.filter(e=>{
    if(gt.g && e.g!==gt.g) return false;
    if(gt.time && e.mode!=="time") return false;
    if(gt.minReps && e.mode==="time") return false;
    if(gt.minLoad){
      if(e.mode==="bw" && bw*e.f < gt.minLoad) return false;
      if(e.mode==="time") return false;
    }
    return true;
  });
}

function computeSet(ex,bw,sets,reps,load,sides){
  const prk=perRepKg(ex,bw,load);
  const units= ex.mode==="time" ? reps/SEC_PER_REP : reps;
  return {ton:Math.round(prk*units*sets*(sides||1)), prk:Math.round(prk*10)/10};

const TASKS=[
 {t:"set_reps", mk:(T,p)=>({target:12+T*2, label:`One set of ${12+T*2}+ reps · ${p.label}`})},
 {t:"total_reps", mk:(T,p)=>({target:60+T*15, label:`${60+T*15} total reps · ${p.label}`})},
 {t:"distinct", mk:(T,p)=>({target:Math.min(6,3+Math.floor(T/3)), label:`${Math.min(6,3+Math.floor(T/3))} different ${p.label} exercises`})},
 {t:"hold", mk:(T)=>({target:45+T*15, label:`${45+T*15}s of holds — any muscle`})},
 {t:"top_load", mk:(T,p,S)=>{const b=bestLoadIn(S,p.gs); const tg=Math.max(5,Math.round(b*(.82+T*.012)*2)/2);
    return {target:tg, label:`One set at ${tg}kg+ per rep · ${p.label}`};}},
 {t:"pr", mk:()=>({target:1, label:"Set a new record on anything"})},
 {t:"sets", mk:(T,p)=>({target:9+T, label:`${9+T} hard sets · ${p.label}`})}

function bestLoadIn(S,gs){
  let b=0; for(const id in S.records){ if(gs.includes(byId(id).g)) b=Math.max(b,S.records[id].load||0); }
  return b|| Math.max(8, S.bw*.4);
}
function baseTonnage(S){
  const today=dayNum(dayKey()); const per={};
  S.log.forEach(r=>{ if(today-dayNum(r.d)<21) per[r.d]=(per[r.d]||0)+r.ton; });
  const v=Object.values(per).sort((a,b)=>a-b);
  if(v.length<3) return 900;
  return Math.max(700, v[Math.floor(v.length/2)]);
}
function weekIndex(S,k){ return S.start ? Math.max(0,Math.floor((dayNum(k)-dayNum(S.start))/7)) : 0; }

function makeDaily(S,k){
  const dow=dowOf(k), p=PLAN[dow], W=weekIndex(S,k), T=Math.min(9,Math.floor(W/2));
  const quota=Math.max(400, Math.round(baseTonnage(S)*.6*(1+.02*Math.min(W,25))/10)*10);
  const n=dayNum(k), NT=TASKS.length;
  let i1=(n*3+W*2)%NT, i2=(n*5+W*4+3)%NT;
  if(i2===i1) i2=(i2+1)%NT;
  const a=TASKS[i1], b=TASKS[i2];
  const oa=a.mk(T,p,S), ob=b.mk(Math.min(9,T+2),p,S);
  return {k,dow,plan:p.id,week:W,tier:T,quota,
    acc:{ton:0,focusTon:0,reps:0,sec:0,sets:0,ex:[],pr:false,bestSetReps:0,bestLoad:0},
    objs:[
      {t:"quota",target:quota,label:`Move ${fmt(quota)}kg of ${p.label}`,done:false,reward:Math.round(quota/3)},
      {t:a.t,target:oa.target,label:oa.label,done:false,reward:Math.round(quota/4)},
      {t:b.t,target:ob.target,label:ob.label,done:false,reward:Math.round(quota/3)}
    ],
    perfect:false};
}
function progressOf(o,acc){
  switch(o.t){
    case "quota":return acc.focusTon; case "set_reps":return acc.bestSetReps;
    case "total_reps":return acc.reps; case "distinct":return acc.ex.length;
    case "hold":return acc.sec; case "top_load":return acc.bestLoad;
    case "pr":return acc.pr?1:0; case "sets":return acc.sets; default:return 0;

}

function objQualifiers(o,plan,bw){

    default: return [];
  }
}

let KEY="liftmania:save";
const LEGACY=["ironrun:save","ironrun:v2","ironrun:v1"];
const STORE={mode:"memory",mem:{},
  async init(){
    if(window.storage && typeof window.storage.set==="function"){
      try{ await window.storage.set(KEY+":probe","1"); this.mode="claude"; return; }catch(e){}
    }
    try{ localStorage.setItem(KEY+":probe","1"); localStorage.removeItem(KEY+":probe"); this.mode="local"; return; }catch(e){}
    this.mode="memory";
  },
  async get(k){
    const key=k||KEY;
    try{
      if(this.mode==="claude"){ const r=await window.storage.get(key); return r?r.value:null; }
      if(this.mode==="local") return localStorage.getItem(key);
      return this.mem[key]||null;
    }catch(e){ return null; }
  },
  async getAny(){
    let v=await this.get(KEY);
    if(v) return v;
    for(const k of LEGACY){ v=await this.get(k); if(v) return v; }
    return null;
  },
  async set(v,k){
    const key=k||KEY;
    try{
      if(this.mode==="claude") await window.storage.set(key,v);
      else if(this.mode==="local") localStorage.setItem(key,v);
      else this.mem[key]=v;
      return true;
    }catch(e){ this.mem[key]=v; return false; }
  },
  /* shared = visible to everyone using this app: the league board lives here */
  async sget(k){ if(this.mode!=="claude") return null;
    try{ const r=await window.storage.get(k,true); return r?r.value:null; }catch(e){ return null; } },
  async sset(k,v){ if(this.mode!=="claude") return false;
    try{ await window.storage.set(k,v,true); return true; }catch(e){ return false; } },
  async slist(pre){ if(this.mode!=="claude") return [];
    try{ const r=await window.storage.list(pre,true); const ks=(r&&r.keys)||[];
      return ks.map(x=>typeof x==="string"?x:(x&&(x.key||x.name))).filter(Boolean); }catch(e){ return []; } }
};

async function rpc(fn,body){
  const c=cloudCfg(); if(!c) throw new Error("No server configured");

/* forward-compatible: unknown keys from newer saves are kept, missing ones defaulted */
function migrate(o){
  const s=Object.assign(JSON.parse(JSON.stringify(EMPTY)),o||{});
  if(!Array.isArray(s.log)) s.log=[];
  if(!s.records||typeof s.records!=="object") s.records={};
  if(!Array.isArray(s.prLog)) s.prLog=[];
  if(!s.last||typeof s.last!=="object") s.last={};
  if(!s.weeks||typeof s.weeks!=="object") s.weeks={};
  if(!s.pace||![4,7,10].includes(s.pace)) s.pace=7;
  if(![0.5,1,2.5,5].includes(s.wstep)) s.wstep=2.5;
  if(typeof s.bw!=="number"||!isFinite(s.bw)||s.bw<=0) s.bw=75;
  s.ci=Math.max(0,s.ci|0); s.cd=Math.max(0,s.cd||0);
  s.peak=Math.max(s.peak|0,s.ci);
  s.ver=4;
  return s;
}

/* what the numbers currently on the steppers would do to your records */
function prPreview(ex,sets,reps,load){
  const {prk}=computeSet(ex,S.bw,sets,reps,load);
  const r=S.records[ex.id]||{};
  const units = ex.mode==="time" ? reps/SEC_PER_REP : reps;
  const rows=[
    {k:"load",  label:"load",                      cur:prk,                    best:r.load||0,  u:"kg"},
    {k:"reps",  label:ex.mode==="time"?"hold":"reps", cur:reps,                best:r.reps||0,  u:ex.mode==="time"?"s":""},
    {k:"vol",   label:"set volume",                cur:Math.round(prk*units),  best:r.vol||0,   u:"kg"},
    {k:"e1rm",  label:"est. 1RM",                  cur:e1rm(prk,units),        best:r.e1rm||0,  u:"kg"}
  ];
  const hits=rows.filter(x=>x.cur>x.best);
  const miss=rows.filter(x=>x.cur<=x.best && x.best>0)
                 .map(x=>({...x,gap:x.best-x.cur+ (x.k==="reps"?1:0.1), rel:(x.best-x.cur)/x.best}))
                 .sort((a,b)=>a.rel-b.rel);
  return {rows,hits,closest:miss[0]||null,fresh:!rows.some(x=>x.best>0)};
}

}
function dailyRate(){
  const t=dayNum(dayKey());
  const w=S.log.filter(r=>t-dayNum(r.d)<14);
  if(!w.length) return 0;
  const span=Math.max(1,Math.min(14,t-dayNum(w[w.length-1].d)+1));
  return w.reduce((a,r)=>a+(r.ap||r.dmg||0),0)/span;
}
const weeklyOut = () => Math.round(dailyRate()*7);
function bossEta(){
  const r=dailyRate();
  return r<=0 ? null : Math.max(1,Math.ceil((bossAt(S.ci).hp-S.cd)/r));
}

/* ══════════════════ DETRAINING ══════════════════
   One rest day is free. From the second day off, the current boss heals a
   growing share of its max HP each day: 3%, 4%, 5% … capped at 10% a day.
   Enough regeneration rolls you back onto bosses you'd already beaten, but
   never out of the act you're standing in. */
function decayRate(off){ return Math.min(.10, .02+.01*(off-1)); }
function applyDecay(){
  const t=dayNum(dayKey());
  if(!S.lastDay){ S.decayedThrough=t; return null; }
  const last=dayNum(S.lastDay);
  const from=Math.max(last+2,(S.decayedThrough||last)+1);
  if(t<from){ S.decayedThrough=Math.max(S.decayedThrough||0,t); return null; }
  const floor=Math.floor(S.ci/10)*10;
  let healed=0; const revived=[];
  for(let d=from; d<=t; d++){
    const heal=Math.round(bossAt(S.ci).hp*decayRate(d-last));
    healed+=heal; S.cd-=heal;
    while(S.cd<0){
      if(S.ci<=floor){ S.cd=0; break; }
      S.ci--; revived.push(bossAt(S.ci).name); S.cd=bossAt(S.ci).hp+S.cd;
    }
  }
  S.decayedThrough=t; S.streak=0;
  return {days:t-last,healed,revived,atFloor:S.ci<=floor&&S.cd===0};
}
function restStatus(){
  if(!S.lastDay) return {t:"new",msg:"Nothing logged yet. The clock starts on your first set."};
  const gap=dayNum(dayKey())-dayNum(S.lastDay);
  if(gap===0) return {t:"ok",msg:"Trained today. Nothing decays."};
  if(gap===1) return {t:"grace",msg:"Rest day — free. Miss tomorrow too and the boss starts healing."};
  return {t:"decay",msg:`${gap} days off. ${bossAt(S.ci).name} is healing ${Math.round(decayRate(gap)*100)}% of its HP a day.`};
}
function logSet(){
  const ex=byId(U.ex), sides=sidesNow(), {ton,prk}=computeSet(ex,S.bw,U.sets,U.reps,U.load,sides);
  if(ton<=0) return;
  const today=dayKey();
  if(S.lastDay!==today) S.streak = S.lastDay===yKey() ? S.streak+1 : 1;
  S.lastDay=today; S.decayedThrough=dayNum(today); S.away=null;
  updateCalibration();
  rollDaily();

  /* records */
  const rec=S.records[ex.id]||{};
  const units = ex.mode==="time" ? U.reps/SEC_PER_REP : U.reps;
  const setVol=Math.round(prk*units), est=e1rm(prk,units);
  const broke=[];
  const nr={load:rec.load||0,loadD:rec.loadD,reps:rec.reps||0,repsD:rec.repsD,
            vol:rec.vol||0,volD:rec.volD,e1rm:rec.e1rm||0,e1rmD:rec.e1rmD,
            n:rec.n||0,last:rec.last,seen:(rec.seen||0)+1};
  if(prk>nr.load){ nr.load=prk; nr.loadD=today; broke.push("load"); }
  if(U.reps>nr.reps){ nr.reps=U.reps; nr.repsD=today; broke.push(ex.mode==="time"?"hold":"reps"); }
  if(setVol>nr.vol){ nr.vol=setVol; nr.volD=today; broke.push("set volume"); }
  if(est>nr.e1rm){ nr.e1rm=est; nr.e1rmD=today; broke.push("est. 1RM"); }
  if(broke.length){
    nr.n+=broke.length; nr.last=today; S.power++;
    S.prLog=[{d:today,ex:ex.id,k:broke.slice(),prk,reps:U.reps},...(S.prLog||[])].slice(0,80);
  }
  S.records[ex.id]=nr;

  let dmg=Math.round((ton/5)*(1+Math.min(S.power,60)*.01)*flowMult(S.streak));

  /* daily accumulators */
  const p=PLAN[S.daily.dow], inFocus=p.gs.includes(ex.g), a=S.daily.acc;
  a.ton+=ton;
  if(ex.mode==="time") a.sec+=U.reps*U.sets*sides;
  if(broke.length) a.pr=true;
  if(inFocus){
    a.focusTon+=ton; a.sets+=U.sets;
    if(ex.mode!=="time") a.reps+=U.reps*U.sets*sides;
    if(!a.ex.includes(ex.id)) a.ex.push(ex.id);
    if(ex.mode!=="time" && U.reps>a.bestSetReps) a.bestSetReps=U.reps;
    if(prk>a.bestLoad) a.bestLoad=prk;
  }

  /* objectives */
  let bounty=0; const finished=[];
  S.daily.objs.forEach(o=>{
    if(!o.done && progressOf(o,a)>=o.target){ o.done=true; bounty+=o.reward; finished.push(o.label); }
  });
  let perfect=false;
  if(!S.daily.perfect && S.daily.objs.every(o=>o.done)){
    S.daily.perfect=true; perfect=true; bounty+=Math.round(S.daily.quota/2);
  }

  /* week ledger */
  const wk=mondayOf(today);
  if(!S.weeks[wk]) S.weeks[wk]=[0,0,0,0,0,0,0];
  S.weeks[wk][S.daily.dow]=Math.max(S.weeks[wk][S.daily.dow], S.daily.perfect?2:1);
  let weekBonus=0;
  if(S.weeks[wk].every(v=>v===2) && !S.weeks[wk+":paid"]){
    S.weeks[wk+":paid"]=true; S.perfectWeeks++; S.power+=2; weekBonus=S.daily.quota*3; bounty+=weekBonus;
  }

  /* campaign damage */
  const boss=bossAt(S.ci);
  const pass=gatePass(boss.gate,{g:ex.g,mode:ex.mode,reps:U.reps,prk});
  const applied=Math.round(dmg*(pass?1:.25))+bounty;
  S.cd+=applied; S.totalTon+=ton;
  const cleared=[];
  while(S.cd>=bossAt(S.ci).hp){
    const b=bossAt(S.ci); S.cd-=b.hp; S.ci++; const nb=bossAt(S.ci);
    cleared.push(b.name);
    FXQ.push({n:b.i+1,name:b.name,flavor:b.flavor,
      act:(b.i<ROSTER.length && (b.i+1)%10===0) ? ACT_NAMES[Math.floor(b.i/10)] : null,
      next:nb.name,nextHp:nb.hp,nextGate:gateText(nb.gate)});
  }
  if(S.ci>S.peak) S.peak=S.ci;

  S.last[ex.id]={sets:U.sets,reps:U.reps,load:U.load,sd:U.sd};
  S.log.unshift({d:today,ex:ex.id,sets:U.sets,reps:U.reps,load:U.load,sd:U.sd,prk,ton,dmg,ap:applied});
  S.log=S.log.slice(0,900);

  U.flash={ton,dmg,applied,pass,bounty,cleared,broke,finished,perfect,weekBonus,boss:boss.name};
  startRest(90);
  persist(); publish(); render();
  if(FXQ.length) playFx();
}

function startRest(n){ U.rest=n; clearInterval(U.restT);
  U.restT=setInterval(()=>{ U.rest--; if(U.rest<=0){clearInterval(U.restT);U.rest=0;} paintRest(); },1000); }
function paintRest(){ const e=document.getElementById("restBtn"); if(!e) return;
  if(U.rest<=0){ e.style.display="none"; return; }
  e.textContent=`rest ${Math.floor(U.rest/60)}:${pad(U.rest%60)} — tap to skip`; }

/* ══════════════════ DEFEAT SEQUENCE ══════════════════ */
const FXQ=[]; let FXT=null;
const REDUCE=()=>window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function playFx(){
  if(!FXQ.length) return;
  const it=FXQ.shift(), el=document.getElementById("fx"), r=REDUCE();
  let sparks="";
  if(!r){
    const cols=["#00E88C","#FFC53D","#FF3D9A","#3D6BFF","#F2EDFF"];
    for(let i=0;i<30;i++){
      const a=(i/30)*Math.PI*2+Math.random()*.4, d=150+Math.random()*280;
      sparks+=`<div class="spark" style="--dx:${(Math.cos(a)*d).toFixed(0)}px;--dy:${(Math.sin(a)*d).toFixed(0)}px;`
        +`background:${cols[i%5]};animation-delay:${(Math.random()*.2).toFixed(2)}s"></div>`;
    }
  }
  el.innerHTML=`${r?"":`<div class="ring"></div><div class="ring" style="animation-delay:.18s;border-color:var(--gold)"></div>`}${sparks}
    <div class="fxcard">
      <div class="eyebrow" style="color:var(--green)">boss ${it.n} of 100 defeated</div>
      <div class="disp ${r?"":"slam"}" style="font-size:29px;margin:12px 0 0">${esc(it.name.toUpperCase())}</div>
      ${r?"":`<div class="crack"></div>`}
      <div class="rise muted">${esc(it.flavor)}</div>
      ${it.act?`<div style="margin-top:16px"><div class="actban">ACT ${esc(it.act.split(" · ")[0])} COMPLETE · ${esc(it.act.split(" · ")[1].toUpperCase())}</div></div>`:""}

      <div class="rise" style="margin-top:20px">
        <div class="eyebrow">now entering</div>
        <div class="disp" style="font-size:17px;color:var(--gold);margin-top:5px">${esc(it.next.toUpperCase())}</div>
        <div class="mono" style="font-size:12px;color:var(--dim);margin-top:5px">${fmt(it.nextHp)} HP · ${esc(it.nextGate)}</div>
      </div>
      <div class="tapdis mono" style="font-size:11px;color:var(--dim);margin-top:22px">tap anywhere to continue</div>
    </div>`;
  el.classList.add("on");
  if(!r){ const app=document.getElementById("app");
    app.classList.add("shake"); setTimeout(()=>app.classList.remove("shake"),700); }
  clearTimeout(FXT); FXT=setTimeout(dismissFx, it.act?7000:4600);
}
function dismissFx(){
  clearTimeout(FXT);
  const el=document.getElementById("fx"); el.classList.remove("on"); el.innerHTML="";
  if(FXQ.length) setTimeout(playFx,200); else render();
}
document.getElementById("fx").addEventListener("click",dismissFx);

/* ══════════════════ EXPORT / IMPORT ══════════════════ */
function exportSave(){
  S.lastExport=Date.now(); persist();
  const blob=new Blob([JSON.stringify({app:"liftmania",ver:3,exported:dayKey(),save:S},null,1)],{type:"application/json"});
  const a=document.getElementById("dl");
  a.href=URL.createObjectURL(blob); a.download=`liftmania-${MP.me?MP.me.id:"save"}-${dayKey()}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000); render();
}
function copySave(){
  const t=JSON.stringify({app:"liftmania",ver:3,exported:dayKey(),save:S});
  navigator.clipboard?.writeText(t).then(()=>alert("Save copied. Paste it somewhere safe."))
    .catch(()=>{ U.paste=true; U.pasteText=t; render(); });
  S.lastExport=Date.now(); persist();
}
function loadSaveObj(o){
  if(o && (o.app==="liftmania"||o.app==="iron-run") && o.save) o=o.save;
  if(!o || typeof o!=="object" || !("log" in o)) { alert("That file isn't a LiftMania save."); return; }
  S=migrate(o); applyDecay(); rollDaily(); persist(); U.tab="train"; render();
  alert("Save restored.");
}
document.getElementById("fileIn").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ loadSaveObj(JSON.parse(r.result)); }catch(x){ alert("Couldn't read that file."); } };
  r.readAsText(f); e.target.value="";
});

            <b>PR incoming:</b> ${p.hits.map(x=>`${x.label} ${x.cur}${x.u} <span style="opacity:.65">(was ${x.best}${x.u})</span>`).join(" · ")}</div>`;
        const c=p.closest, gap=Math.round((c.best-c.cur)*10)/10;

    if(U.flash){const f=U.flash;

        ${f.finished.map(t=>`<div style="margin-top:6px;border-radius:8px;padding:6px 8px;background:var(--cobalt);font-size:12px">✓ ${esc(t)}</div>`).join("")}

        ${f.weekBonus?`<div class="pop" style="margin-top:6px;border-radius:8px;padding:8px;background:var(--gold);color:var(--night);font-family:var(--d);font-size:12px">PERFECT WEEK · +2 POWER</div>`:""}

  /* ─── DAILY / WEEK ─── */
  if(U.tab==="daily"){
    const wk=mondayOf(dayKey()), w=S.weeks[wk]||[0,0,0,0,0,0,0];
    h+=`<div class="panel">
      <div class="eyebrow" style="color:var(--gold)">this week</div>
      <div class="week" style="margin-top:9px">${DOWL.map((d,i)=>`<div class="wday ${w[i]===2?"f":w[i]===1?"p":""} ${i===S.daily.dow?"today":""}">${d}<br>${w[i]===2?"✓✓":w[i]===1?"✓":"·"}</div>`).join("")}</div>
      <div class="muted" style="margin-top:9px">Seven days, each muscle group trained exactly twice. Finish all three challenges on all seven days for a Perfect Week: triple bounty and +2 permanent Power.</div>
      <div class="mono" style="font-size:11px;color:var(--dim);margin-top:7px">perfect weeks: ${S.perfectWeeks}</div>
    </div>
    <div class="panel"><div class="eyebrow" style="color:var(--cobalt)">the rotation</div>
      ${PLAN.map((pl,i)=>`<div class="obj"><div class="box" style="border:none;color:var(--dim);font-family:var(--m);font-size:11px">${DOWL[i]}</div>
        <div style="flex:1"><div style="font-size:13px">${esc(pl.name)}</div>
        <div class="mono" style="font-size:10px;color:var(--dim)">${pl.gs.map(g=>GROUPS[g].name).join(" · ")}</div></div></div>`).join("")}
      <div class="muted" style="margin-top:9px">Challenge difficulty steps up every second week: rep targets, hold times, distinct-exercise counts and the load bar all climb, and the volume quota tracks your own rolling 21-day median — so it stays hard as you get stronger, without ever asking for a boss-sized session.</div>
    </div>
    <div class="panel"><div class="eyebrow" style="color:var(--red)">detraining</div>
      <div class="muted" style="margin-top:7px">${esc(restStatus().msg)}</div>
      <div class="obj" style="margin-top:8px"><div class="box" style="border:none;color:var(--green)">1</div><div style="flex:1">
        <div style="font-size:14px">One day off is free</div>
        <div class="mono" style="font-size:11px;color:var(--dim);margin-top:2px">Nothing moves. Recovery is part of training.</div></div></div>
      <div class="obj"><div class="box" style="border:none;color:var(--red)">2</div><div style="flex:1">
        <div style="font-size:14px">From day two, the boss heals</div>
        <div class="mono" style="font-size:11px;color:var(--dim);margin-top:2px">3% of its max HP on day two, then 4%, 5% … capped at 10% a day.</div></div></div>
      <div class="obj"><div class="box" style="border:none;color:var(--magenta)">3</div><div style="flex:1">
        <div style="font-size:14px">Enough healing pushes you back</div>
        <div class="mono" style="font-size:11px;color:var(--dim);margin-top:2px">Beaten bosses revive — but never past the first boss of the act you're in. A week away costs about a week of work.</div></div></div>
      <div class="mono" style="font-size:11px;color:var(--dim);margin-top:9px">furthest reached: boss ${(S.peak||S.ci)+1} · act floor: boss ${Math.floor(S.ci/10)*10+1}</div>
    </div>`;
  }

  /* ─── BOSSES ─── */
  if(U.tab==="bosses"){
    h+=`<div class="panel"><div class="eyebrow" style="color:var(--cobalt)">the campaign · ${S.ci}/100 down</div>`;
    ROSTER.forEach((b,i)=>{
      if(i%10===0) h+=`<div class="acthead">${ACT_NAMES[i/10]}</div>`;
      const done=i<S.ci, cur=i===S.ci, hp=bossAt(i).hp;
      h+=`<div class="bosscard ${done?"done":""} ${cur?"cur":""}" style="margin-bottom:6px">
        <div class="row"><span class="bname disp" style="font-size:12px">${pad(i+1)} ${esc(b[0].toUpperCase())}</span>
        <span class="mono" style="font-size:10px;color:var(--dim)">${fmt(hp)}</span></div>
        <div class="mono" style="font-size:10px;margin-top:3px;color:${b[1]?"var(--magenta)":"var(--dim)"}">${gateText(b[1])}</div>

  /* ─── BODY ─── */
  if(U.tab==="body"){
    const ws={}; GK.forEach(g=>ws[g]=0);
    const t0=dayNum(dayKey());
    S.log.forEach(r=>{ if(t0-dayNum(r.d)<7) ws[byId(r.ex).g]+=r.sets; });
    h+=`<div class="panel"><div class="eyebrow" style="color:var(--magenta)">hard sets · last 7 days</div>
      <div class="muted" style="margin:6px 0 10px">10–20 sets per muscle per week is the range that actually builds size. Under 10 is maintenance.</div>
      ${GK.map(g=>`<div style="margin-bottom:8px">
        <div class="row" style="font-size:12px"><span>${GROUPS[g].name}</span>
        <span class="mono" style="color:${ws[g]>=10?"var(--green)":"var(--dim)"}">${ws[g]} / 10</span></div>
        <div style="margin-top:3px">${bar(ws[g]/20*100,GROUPS[g].c,7)}</div></div>`).join("")}
    </div>
    ${(()=>{const st=staleRecords(); if(!st.length) return "";
      return `<div class="panel" style="border-color:var(--magenta)">
        <div class="eyebrow" style="color:var(--magenta)">going stale</div>
        <div class="muted" style="margin:7px 0 9px">No record broken on these in three weeks or more. Pick one off — every PR is +1 Power, permanently.</div>

      ${Object.keys(S.records).length?Object.entries(S.records)
        .sort((a,b)=>(daysAgo(a[1].last)??999)-(daysAgo(b[1].last)??999)).map(([id,r])=>{
        const e=byId(id), cold=daysAgo(r.last)>=21;
        return `<div class="recrow">
          <div class="row">
            <span style="font-size:13px;display:flex;align-items:center;gap:7px">
              <span class="dot" style="background:${GROUPS[e.g].c}"></span>${esc(e.n)}</span>
            <span class="mono" style="font-size:10px;color:${cold?"var(--magenta)":"var(--dim)"}">${agoText(r.last)}</span></div>
          <div class="recstats">
            <span>load <b>${r.load||0}kg</b></span>
            <span>${e.mode==="time"?"hold":"reps"} <b>${r.reps||0}${e.mode==="time"?"s":""}</b></span>
            <span>set <b>${fmt(r.vol||0)}kg</b></span>
            <span>e1RM <b>${r.e1rm||0}kg</b></span>
            <span style="opacity:.7">${r.n||0} PRs</span></div>
        </div>`;}).join("")
        :`<div class="muted" style="margin-top:6px">Nothing logged yet.</div>`}
    </div>
    ${(S.prLog&&S.prLog.length)?`<div class="panel"><div class="eyebrow" style="color:var(--green)">pr timeline</div>
      <div style="margin-top:8px">${S.prLog.slice(0,12).map(p=>`
        <div class="row" style="padding:5px 0;font-family:var(--m);font-size:11px">
          <span style="color:var(--cream)">${esc(byId(p.ex).n)}</span>
          <span style="color:var(--dim)">${esc(p.k.join(", "))} · ${agoText(p.d)}</span></div>`).join("")}</div>
    </div>`:""}
    <div class="panel"><div class="eyebrow" style="color:var(--cobalt)">pace</div>
      <div class="muted" style="margin:7px 0 10px">How long one boss should take. Boss HP is a multiple of your own weekly output, so this sets the rhythm, not the difficulty of any single session.</div>
      <div style="display:flex;gap:6px">
        ${[[4,"4 days","~1 year"],[7,"1 week","~2 years"],[10,"10 days","~2.7 years"]].map(([v,l,t])=>
          `<button class="filt ${S.pace===v?"on":""}" data-a="pace" data-v="${v}" style="flex:1;padding:9px 4px;line-height:1.5">${l}<br><span style="opacity:.7">${t}</span></button>`).join("")}
      </div>
      <div class="mono" style="font-size:11px;color:var(--dim);margin-top:11px">
        ${S.calLocked
          ? `standard locked at ${fmt(baseWeek())}/week · current output ${fmt(weeklyOut())}/week`

      </div>
      <div class="muted" style="margin-top:8px">The demand climbs about 2.5% a boss early on and under 1% a boss by the end — roughly 2.9× your starting output by boss 100. Standing still means bosses take longer than the pace you picked.</div>
      ${S.calLocked?`<button class="ghost" data-a="recal" style="margin-top:10px">recalibrate to current output</button>`:""}
    </div>
    <div class="panel"><div class="eyebrow">lifetime</div>
      <div class="mono" style="font-size:13px;color:var(--dim);margin-top:6px">
        <div>${fmt(S.totalTon)} kg moved</div><div>${S.log.length} entries logged</div>
        <div>${S.ci} bosses down · ${S.perfectWeeks} perfect weeks</div></div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:12px">

  }

  /* ─── LEAGUE ─── */
  if(U.tab==="league"){
    const METRICS=[{k:"pwr",l:"power",u:""},{k:"ci",l:"bosses",u:""},{k:"ton",l:"kg moved",u:"kg"},
                   {k:"streak",l:"streak",u:"d"},{k:"prs",l:"records",u:""}];
    const m=METRICS.find(x=>x.k===U.metric)||METRICS[0];
    const rows=Object.values(MP.board).sort((a,b)=>(b[m.k]||0)-(a[m.k]||0));
    const myRank=rows.findIndex(r=>MP.me&&r.id===MP.me.id)+1;

    h+=`<div class="panel">
      <div class="row"><div class="eyebrow" style="color:var(--gold)">the crew</div>

      </div>
      <div style="margin-top:8px">
        ${rows.length?rows.map((r,i)=>{
          const mine=MP.me&&r.id===MP.me.id, ago=r.lastDay?agoText(r.lastDay):"never";
          return `<div class="lrow ${mine?"me":""}">
            <div class="rk ${i<3?"g"+(i+1):""}">${i+1}</div>
            <div style="min-width:0">
              <div class="pname">${esc(r.name)}${mine?" <span class=\"mono\" style=\"font-size:10px;color:var(--gold)\">you</span>":""}</div>
              <div class="pstat">boss ${(r.ci|0)+1} · ${fmt(r.ton||0)}kg · ${r.streak|0}d streak · lifted ${ago}</div>
            </div>

        }).join(""):`<div class="muted" style="padding:10px 0">Nobody has logged a set yet. Send your friends this app, have them pick a name, and the board fills itself.</div>`}
      </div>

    <div class="panel">

      ${(()=>{
        const recs=[];
        EX.forEach(e=>{
          if(U.rgroup!=="all" && e.g!==U.rgroup) return;

            if(v&&v.e>0&&(!best||v.e>best.v)) best={v:v.e,who:p.name,id:p.id,reps:v.r,load:v.l}; });

        });
        recs.sort((a,b)=>b.v-a.v);
        if(!recs.length) return `<div class="muted" style="padding:8px 0">No records on the board yet for this filter.</div>`;
        return recs.slice(0,30).map(r=>`<div class="recrow">
          <div class="row"><div style="font-weight:700;font-size:13px">${esc(r.e.n)}</div>
            <div class="mono" style="font-size:12px;color:var(--gold)">${fmt(r.v)}kg 1RM</div></div>
          <div class="recstats"><span style="color:${MP.me&&r.id===MP.me.id?"var(--green)":"var(--dim)"}">held by ${esc(r.who)}</span>
            <span>best set <b>${r.reps}</b>${r.e.mode==="time"?"s":" reps"} @ <b>${fmt(r.load)}</b>kg</span></div>
        </div>`).join("");
      })()}
    </div>`;
  }

  /* ─── SAVE ─── */
  if(U.tab==="save"){
    const where={claude:"inside this preview",local:"in this browser",memory:"nowhere — storage is blocked"}[STORE.mode];
    h+=`<div class="panel"><div class="eyebrow" style="color:var(--green)">your progress</div>
      <div class="muted" style="margin:7px 0 12px">Auto-saving ${where}. Browser storage can be cleared without warning, so download a save file after any session you'd hate to lose. The file restores everything: bosses, records, streak, week ledger.</div>
      <button class="cta" data-a="export">DOWNLOAD SAVE FILE</button>
      <button class="cta" style="background:var(--cobalt);color:var(--cream)" data-a="import">RESTORE FROM FILE</button>
      <div style="display:flex;gap:6px;margin-top:10px">
        <button class="ghost" style="flex:1" data-a="copy">copy save as text</button>
        <button class="ghost" style="flex:1" data-a="pastetoggle">paste save text</button>
      </div>
      ${U.paste?`<div style="margin-top:9px"><textarea id="pasteBox" placeholder="Paste your save text here…">${U.pasteText?esc(U.pasteText):""}</textarea>
        <button class="ghost" style="margin-top:6px" data-a="pasteload">restore from pasted text</button></div>`:""}
      <div class="mono" style="font-size:10px;color:var(--dim);margin-top:10px">last backup: ${S.lastExport?new Date(S.lastExport).toLocaleDateString():"never"}</div>
    </div>
    <div class="panel"><div class="eyebrow">account</div>
      <div class="muted" style="margin-top:7px">Signed in as <b>${esc((MP.me&&MP.me.name)||"—")}</b>. ${cloudOn()?"Your save syncs to the server, so the same name and PIN picks up where you left off on any device.":"No server connected — this account lives on this device only."}</div>
      <button class="ghost" style="margin-top:9px" data-a="logout">switch account</button>
    </div>
    <div class="panel"><div class="eyebrow" style="color:var(--cobalt)">server</div>
      <div class="muted" style="margin:7px 0 10px">${cloudOn()?"Connected. Everyone using this link shares one board.":"Paste your Supabase project URL and anon key to turn on cross-device saves and the shared board."}</div>
      <input type="text" id="sbUrl" placeholder="https://xxxx.supabase.co" value="${esc((cloudCfg()&&cloudCfg().url)||"")}" style="width:100%">
      <input type="text" id="sbKey" placeholder="anon public key" value="${esc((cloudCfg()&&cloudCfg().key)||"")}" style="width:100%;margin-top:7px">
      <button class="ghost" style="margin-top:9px" data-a="saveserver">save server settings</button>
      <div class="muted" style="margin-top:9px">Saved here, this only applies on your device. Paste the same two values into the top of the HTML file before you host it and everyone gets them automatically.</div>
    </div>
    <div class="panel"><div class="eyebrow">use it offline</div>
      <div class="muted" style="margin-top:7px">This whole app is one file with nothing to install. Save it to your phone and open it from Files — it works with no connection. For a real home-screen icon, drop the file on <b>app.netlify.com/drop</b>, open the link it gives you, then use Share → Add to Home Screen.</div>
    </div>
    <button class="ghost" style="margin:0 auto" data-a="wipe">wipe save</button>`;
  }

  document.getElementById("app").innerHTML=h;
  ["sets","reps","load"].forEach(f=>{
    const el=document.getElementById("st_"+f); if(!el) return;
    const commit=()=>{
      let v=parseFloat(String(el.value).replace(",","."));
      if(!isFinite(v)) v=U[f];
      U[f]=Math.max(f==="load"?0:1, Math.round(v*10)/10);
      render();
    };
    el.addEventListener("change",commit);
    el.addEventListener("focus",()=>el.select());
    el.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); el.blur(); } });
  });
  const bwIn=document.getElementById("bwIn");
  if(bwIn) bwIn.addEventListener("change",e=>{ S.bw=Number(String(e.target.value).replace(/[^0-9.]/g,""))||75; persist(); render(); });
  paintRest();
}

function countsNow(e){
  if(gateQualifiers(bossAt(S.ci).gate,S.bw).includes(e)) return true;
  const p=PLAN[S.daily.dow];
  return S.daily.objs.some(o=>!o.done && objQualifiers(o,p,S.bw).includes(e));
}
function nextTarget(ex){
  const l=S.last[ex.id];
  if(!l) return "First entry sets your baseline.";
  if(ex.mode==="time") return `Beat ${l.reps}s. Past 60s, pick a harder hold.`;
  if(ex.mode==="bw") return l.reps>=15?"Switch to a harder variation.":`Target ${l.reps+1} reps.`;
  return l.reps>=12?`Go to ${l.load+2.5}kg and drop back to 8 reps.`:`Target ${l.reps+1} reps at ${l.load}kg.`;
}

/* ══════════════════ EVENTS ══════════════════ */
document.getElementById("app").addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b||!S) return;
  const a=b.dataset.a;
  if(a==="tab"){ U.tab=b.dataset.t; U.flash=null; render(); }
  else if(a==="group"){ U.group=b.dataset.g;
    const first=(U.only?EX.filter(x=>x.g===U.group&&countsNow(x)):EX.filter(x=>x.g===U.group))[0]||EX.find(x=>x.g===U.group);
    pickEx(first.id); render(); }
  else if(a==="ex"){ pickEx(b.dataset.e); render(); }
  else if(a==="obj"){ const i=Number(b.dataset.i); U.openObj = U.openObj===i?null:i; render(); }
  else if(a==="gate"){ U.openGate=!U.openGate; render(); }
  else if(a==="only"){ U.only=!U.only; render(); }
  else if(a==="wstep"){ S.wstep=Number(b.dataset.v); persist(); render(); }
  else if(a==="side"){ U.sd=b.dataset.v;
    S.last[U.ex]=Object.assign({sets:U.sets,reps:U.reps,load:U.load},S.last[U.ex],{sd:U.sd}); persist(); render(); }
  else if(a==="jump"){ const e=byId(b.dataset.e); U.group=e.g; pickEx(e.id); U.openObj=null; U.openGate=false;
    U.tab="train"; render(); document.querySelector(".exwrap")?.scrollIntoView({behavior:"smooth",block:"center"}); }
  else if(a==="inc"||a==="dec"){
    const f=b.dataset.f, s=Number(b.dataset.s), min=Number(b.dataset.min||0);
    U[f]=Math.round(Math.max(a==="inc"?0:min, U[f]+(a==="inc"?s:-s))*10)/10;
    if(a==="dec") U[f]=Math.max(min,U[f]);
    render();
  }
  else if(a==="log") logSet();
  else if(a==="skiprest"){ U.rest=0; clearInterval(U.restT); paintRest(); }
  else if(a==="export") exportSave();
  else if(a==="import") document.getElementById("fileIn").click();
  else if(a==="copy") copySave();
  else if(a==="pastetoggle"){ U.paste=!U.paste; U.pasteText=""; render(); }
  else if(a==="pasteload"){
    const v=document.getElementById("pasteBox").value.trim();
    try{ loadSaveObj(JSON.parse(v)); }catch(x){ alert("That text isn't a valid save."); }
  }
  else if(a==="pace"){ S.pace=Number(b.dataset.v); persist(); render(); }
  else if(a==="recal"){
    if(confirm("Reset the standard to your current output? Future bosses get bigger. Your progress stays.")){
      const r=dailyRate(); if(r>0){ S.baseWeek=Math.max(2500,Math.round(r*7/10)*10); persist(); render(); }
      else alert("Log a couple of sessions first.");
    } }
  else if(a==="dismissaway"){ S.away=null; persist(); render(); }
  else if(a==="saveserver"){ saveServer(document.getElementById("sbUrl").value,document.getElementById("sbKey").value,()=>{
      MP.status="offline"; render(); if(cloudOn()) alert("Server saved. Sign out and back in with your name and PIN to link this device to it."); }); }
  else if(a==="metric"){ U.metric=b.dataset.v; render(); }
  else if(a==="rgroup"){ U.rgroup=b.dataset.v; render(); }
  else if(a==="sync"){ if(!MP.loading){ MP.loading=true; render();
      publish().then(refreshBoard).then(()=>{ MP.loading=false; render(); }); } }
  else if(a==="logout"){ if(confirm("Switch account? This device keeps every account's training separately.")){
      MP.board={}; MP.ready=false; clearTimeout(MP.pushT);
      STORE.set("null","liftmania:me").then(()=>{ S=null; MP.me=null; U.tab="train"; renderLogin(); }); } }
  else if(a==="wipe"){ if(confirm("Wipe all progress? Download a save file first if you're not sure.")){
    S=migrate(null); rollDaily(); persist(); U.tab="train"; render(); } }
});
function pickEx(id){
  U.ex=id; const l=S.last[id], e=byId(id);
  if(l){ U.sets=l.sets; U.reps=l.reps; U.load=l.load; }
  else { U.sets=3; U.reps=e.mode==="time"?30:10; U.load=e.mode==="load"?10:0; }
  U.sd = e.s==="opt" ? ((l&&l.sd)||e.sd) : e.s;
}

/* ══════════════════ SIGN IN ══════════════════ */
function saveServer(url,key,done){
  url=String(url||"").trim().replace(/\/$/,""); key=String(key||"").trim();
  if(!url||!key){ try{ localStorage.removeItem("liftmania:server"); }catch(e){} }
  else{ try{ localStorage.setItem("liftmania:server",JSON.stringify({url,key})); }
        catch(e){ alert("This browser is blocking storage, so the server settings can't be saved here. Paste them into the file instead."); } }
  done&&done();
}
function renderLogin(err,busy,keepName){
  document.getElementById("app").innerHTML=`<div class="login">
    <div style="text-align:center">
      <div class="disp" style="font-size:36px">LIFTMANIA</div>
      <div class="eyebrow" style="margin-top:4px">100 bosses · one crew · one board</div>
    </div>
    <div class="panel">
      <div class="eyebrow" style="color:var(--gold)">who's lifting</div>
      <div class="muted" style="margin:7px 0 11px">Pick a name and a 4-digit PIN. A new name starts a new account. The same name and PIN gets you back in on any device.</div>
      <input class="lin" id="inName" placeholder="NAME" maxlength="14" autocomplete="off" autocapitalize="characters" value="${esc(keepName||"")}">
      <input class="lin" id="inPin" inputmode="numeric" maxlength="4" placeholder="PIN" autocomplete="off" style="margin-top:8px">
      ${err?`<div class="prline" style="border-color:var(--red);color:var(--red)">${esc(err)}</div>`:""}
      <button class="cta" data-l="go">${busy?"CHECKING…":"START LIFTING"}</button>
    </div>
    <div class="panel">
      <div class="eyebrow" style="color:${cloudOn()?"var(--green)":"var(--dim)"}">${cloudOn()?"server connected":"no server"}</div>
      ${cloudOn()
        ?`<div class="muted" style="margin-top:7px">Accounts and the leaderboard live on your Supabase project.</div>`
        :`<div class="muted" style="margin-top:7px">Without a server your account and records stay on this device. Paste your Supabase URL and anon key to share a board with friends.</div>
          <input type="text" id="sbUrl" placeholder="https://xxxx.supabase.co" style="width:100%;margin-top:9px">
          <input type="text" id="sbKey" placeholder="anon public key" style="width:100%;margin-top:7px">
          <button class="ghost" style="margin-top:9px" data-l="server">connect server</button>`}
    </div>
  </div>`;
  const pin=document.getElementById("inPin");
  pin.addEventListener("keydown",ev=>{ if(ev.key==="Enter") doLogin(document.getElementById("inName").value,pin.value); });
}

document.getElementById("app").addEventListener("click",e=>{
  const b=e.target.closest("[data-l]"); if(!b) return;
  if(b.dataset.l==="go") doLogin(document.getElementById("inName").value,document.getElementById("inPin").value);
  else if(b.dataset.l==="server") saveServer(document.getElementById("sbUrl").value,document.getElementById("sbKey").value,()=>renderLogin());
});

async function doLogin(name,pin){
  name=String(name||"").trim().slice(0,14);
  pin=String(pin||"").trim();
  const id=slugify(name);
  if(id.length<2) return renderLogin("Names need at least 2 letters or numbers.",false,name);
  if(!/^\d{4}$/.test(pin)) return renderLogin("The PIN is exactly 4 digits.",false,name);

  if(cloudOn()){
    renderLogin("",true,name);
    try{
      const rows=await rpc("lm_login",{p_id:id,p_name:name,p_pin:pin});
      const row=Array.isArray(rows)?rows[0]:rows;
      if(!row||!row.token) throw new Error("Server didn't return an account");
      MP.me={id:row.id||id,name:row.name||name,token:row.token};
      MP.status="live";
    }catch(e){
      const m=String(e.message||e);
      return renderLogin(/bad pin/i.test(m)
        ? `That name is taken and the PIN doesn't match. Use your PIN, or pick another name.`
        : `Couldn't reach the server: ${m}`, false, name);
    }
  } else {
    MP.me={id,name,token:null};
  }
  await STORE.set(JSON.stringify(MP.me),"liftmania:me");
  await startSession();
}

/* ══════════════════ BOOT ══════════════════ */
async function startSession(){
  KEY="liftmania:save:"+MP.me.id;
  let raw=await STORE.get(KEY);
  if(!raw && !(await STORE.get("liftmania:claimed"))){
    for(const k of LEGACY){ const v=await STORE.get(k); if(v){ raw=v; break; } }
    if(raw) await STORE.set("1","liftmania:claimed");
  }
  let parsed=null;
  if(raw){ try{ parsed=JSON.parse(raw); }catch(e){} }
  if(parsed && (parsed.app==="liftmania"||parsed.app==="iron-run") && parsed.save) parsed=parsed.save;
  S=migrate(parsed);
  const away=applyDecay();
  if(away && (away.healed>0||away.revived.length)) S.away=away;
  rollDaily(); pickEx(U.ex); await persist();
  render();
  if(cloudOn()){ await cloudPull(); await refreshBoard(); rollDaily(); render(); }
  else MP.ready=true;
}

(async function(){
  await STORE.init();
  let me=null;
  try{ me=JSON.parse(await STORE.get("liftmania:me")||"null"); }catch(e){}
  if(me && me.id && (!cloudOn() || me.token)){ MP.me=me; await startSession(); }
  else renderLogin();
})();
</script>
