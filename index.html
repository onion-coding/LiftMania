/* ══════════════════ POST-RENDER WIRING ══════════════════ */
function wireInputs(){
  ["sets","reps","load"].forEach(f=>{
    const el=document.getElementById("st_"+f); if(!el) return;
    const commit=()=>{
      let v=parseFloat(String(el.value).replace(",","."));
      if(!isFinite(v)) v=U[f];
      U[f]=Math.max(f==="load"?0:1, Math.round(v*10)/10);
      render();
    };
    el.addEventListener("change",commit);
    el.addEventListener("focus",()=>el.select());
    el.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); el.blur(); } });
  });
  const bwIn=document.getElementById("bwIn");
  if(bwIn) bwIn.addEventListener("change",e=>{ S.bw=Number(String(e.target.value).replace(/[^0-9.]/g,""))||75; persist(); render(); });
}

function countsNow(e){
  /* an ungated boss takes everything, which would mark every muscle - only
     a real gate narrows the field */
  const gt=bossAt(S.ci).gate;
  if(gt && gateQualifiers(gt,S.bw).includes(e)) return true;
  const p=PLAN[S.daily.dow];
  return S.daily.objs.some(o=>!o.done && objQualifiers(o,p,S.bw).includes(e));
}
function nextTarget(ex){
  const l=S.last[ex.id];
  if(!l) return "First entry sets your baseline.";
  if(ex.mode==="time") return `Beat ${l.reps}s. Past 60s, pick a harder hold.`;
  if(ex.mode==="bw") return l.reps>=15?"Switch to a harder variation.":`Target ${l.reps+1} reps.`;
  return l.reps>=12?`Go to ${l.load+2.5}kg and drop back to 8 reps.`:`Target ${l.reps+1} reps at ${l.load}kg.`;
}

/* ══════════════════ EVENTS ══════════════════ */
document.getElementById("app").addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b||!S) return;
  const a=b.dataset.a;
  if(a==="tab"){ U.tab=b.dataset.t; U.flash=null; U.logDays=5; render(); window.scrollTo(0,0); }
  else if(a==="theme"){ U.theme=b.dataset.v||"night"; applyTheme(); render(); }
  else if(a==="help"){ const k=b.dataset.k; U.help[k]=!U.help[k]; U.fx={help:k}; render(); }
  else if(a==="group"){ U.group=b.dataset.g;
    const first=(U.only?EX.filter(x=>x.g===U.group&&countsNow(x)):EX.filter(x=>x.g===U.group))[0]||EX.find(x=>x.g===U.group);
    pickEx(first.id); render(); }
  else if(a==="ex"){ pickEx(b.dataset.e); render(); }
  else if(a==="obj"){ const i=Number(b.dataset.i); U.openObj = U.openObj===i?null:i; U.fx={expand:true}; render(); }
  else if(a==="gate"){ U.openGate=!U.openGate; U.fx={expand:true}; render(); }
  else if(a==="only"){ U.only=!U.only; render(); }
  else if(a==="logmore"){ U.logDays=(U.logDays||5)+10; render(); }
  else if(a==="server"){ U.openServer=!U.openServer; render(); }
  else if(a==="wstep"){ S.wstep=Number(b.dataset.v); persist(); render(); }
  else if(a==="side"){ U.sd=b.dataset.v;
    S.last[U.ex]=Object.assign({sets:U.sets,reps:U.reps,load:U.load},S.last[U.ex],{sd:U.sd}); persist(); render(); }
  else if(a==="jump"){ const e=byId(b.dataset.e); U.group=e.g; pickEx(e.id); U.openObj=null; U.openGate=false;
    U.tab="train"; render(); document.querySelector(".exwrap")?.scrollIntoView({behavior:"smooth",block:"center"}); }
  else if(a==="inc"||a==="dec"){
    const f=b.dataset.f, s=Number(b.dataset.s), min=Number(b.dataset.min||0);
    U[f]=Math.round(Math.max(a==="inc"?0:min, U[f]+(a==="inc"?s:-s))*10)/10;
    if(a==="dec") U[f]=Math.max(min,U[f]);
    U.fx={bump:f};
    render();
  }
  else if(a==="log") logSet();
  else if(a==="skiprest"){ U.rest=0; clearInterval(U.restT); paintRest(); }
  else if(a==="export") exportSave();
  else if(a==="import") document.getElementById("fileIn").click();
  else if(a==="pace"){ S.pace=Number(b.dataset.v); persist(); render(); }
  else if(a==="recal"){
    if(confirm("Reset the standard to your current output? Future bosses get bigger. Your progress stays.")){
      const r=dailyRate(); if(r>0){ S.baseWeek=Math.max(2500,Math.round(r*7/10)*10); persist(); render(); }
      else alert("Log a couple of sessions first.");
    } }
  else if(a==="dismissaway"){ S.away=null; persist(); render(); }
  else if(a==="saveserver"){ saveServer(document.getElementById("sbUrl").value,document.getElementById("sbKey").value,()=>{
      MP.status="offline"; render(); if(cloudOn()) alert("Server saved. Switch account and sign back in with your name and PIN to link this device to it."); }); }
  else if(a==="metric"){ U.metric=b.dataset.v; render(); }
  else if(a==="scope"){ U.scope=b.dataset.v; render(); }
  else if(a==="crewcreate"){
    const nm=String(document.getElementById("crewName").value||"").trim();
    if(nm.length<2) return alert("Give the crew a name first.");
    S.crew={id:newCrewCode(nm),name:nm.slice(0,22)}; S.crewOwner=true; S.crewBans=[];
    persist(); publish(); render();
  }
  else if(a==="crewjoin"){
    const code=slugify0(document.getElementById("crewCode").value);
    if(code.length<3) return alert("Paste the invite code you were sent.");
    const hit=Object.values(MP.board).find(p=>p.crew===code);
    if(!hit && !confirm("Nobody with that code is on the board yet. Join anyway?")) return;
    S.crew={id:code,name:(hit&&hit.crewName)||code}; S.crewOwner=false; S.crewBans=[];
    persist(); publish(); render();
  }
  else if(a==="crewleave"){
    if(!confirm("Leave this crew? Your training and records are untouched.")) return;
    S.crew=null; S.crewOwner=false; S.crewBans=[]; U.scope="all";
    persist(); publish(); render();
  }
  else if(a==="crewrename"){
    const nm=(prompt("New crew name",(S.crew&&S.crew.name)||"")||"").trim();
    if(nm.length<2) return;
    S.crew.name=nm.slice(0,22); persist(); publish(); render();
  }
  else if(a==="crewkick"){
    const id=b.dataset.i, who=(MP.board[id]&&MP.board[id].name)||id;
    if(!confirm("Remove "+who+" from the crew?")) return;
    if(!S.crewBans.includes(id)) S.crewBans.push(id);
    persist(); publish(); render();
  }
  else if(a==="crewcopy"){
    const code=crewId();
    if(navigator.clipboard) navigator.clipboard.writeText(code).then(()=>alert("Invite code copied:\n"+code),()=>prompt("Invite code",code));
    else prompt("Invite code",code);
  }
  else if(a==="crewmission"){ /* deliberately inert until crew missions ship */ }
  else if(a==="rgroup"){ U.rgroup=b.dataset.v; render(); }
  else if(a==="sync"){ if(!MP.loading){ MP.loading=true; render();
      publish().then(refreshBoard).then(()=>{ MP.loading=false; render(); }); } }
  else if(a==="logout"){ if(confirm("Switch account? This device keeps every account's training separately.")){
      MP.board={}; MP.ready=false; clearTimeout(MP.pushT);
      STORE.set("null","liftmania:me").then(()=>{ S=null; MP.me=null; U.tab="train"; lastView=null; renderLogin(); }); } }
  else if(a==="wipe"){ if(confirm("Wipe all progress on this account? This cannot be undone.")){
    S=migrate(null); rollDaily(); persist(); U.tab="train"; render(); } }
});

function pickEx(id){
  U.ex=id; const l=S.last[id], e=byId(id);
  if(l){ U.sets=l.sets; U.reps=l.reps; U.load=l.load; }
  else { U.sets=3; U.reps=e.mode==="time"?30:10; U.load=e.mode==="load"?10:0; }
  U.sd = e.s==="opt" ? ((l&&l.sd)||e.sd) : e.s;
}

/* ══════════════════ SIGN IN ══════════════════ */
function saveServer(url,key,done){
  url=String(url||"").trim().replace(/\/$/,""); key=String(key||"").trim();
  if(!url||!key){ try{ localStorage.removeItem("liftmania:server"); }catch(e){} }
  else{ try{ localStorage.setItem("liftmania:server",JSON.stringify({url,key})); }
        catch(e){ alert("This browser is blocking storage, so the server settings can't be saved here. Paste them into the file instead."); } }
  done&&done();
}
function renderLogin(err,busy,keepName){
  document.getElementById("app").innerHTML=`<div class="login">
    <div style="text-align:center">
      <div class="disp" style="font-size:36px">LIFTMANIA</div>
      <div class="mini" style="margin-top:6px">100 bosses · one crew · one board</div>
      <div class="themebox" style="display:inline-flex;margin-top:14px">${THEMES.map(t=>`<button class="theme-pill ${U.theme===t.id?"active":""}" data-l="theme" data-v="${t.id}" title="${t.title}" aria-label="${t.title}">${t.label}</button>`).join("")}</div>
    </div>
    <section class="card">
      <div class="chead"><h2 class="ctitle">Who's lifting?</h2></div>
      <div class="body">
        <input class="lin" id="inName" placeholder="NAME" maxlength="14" autocomplete="off" autocapitalize="characters" value="${esc(keepName||"")}">
        <div class="lreveal" id="lreveal">
          <div class="lstate" id="lstate"></div>
          <input class="lin" id="inPin" inputmode="numeric" maxlength="4" placeholder="4-DIGIT PIN" autocomplete="off" style="margin-top:12px">
          ${err?`<div class="prline" style="margin-top:9px;border-color:var(--red);color:var(--red)">${esc(err)}</div>`:""}
          <button class="cta" id="loginCta" style="margin-top:12px" data-l="go">${busy?"CHECKING…":"START LIFTING"}</button>
        </div>
        <div class="mini" id="lhint" style="margin-top:12px">Type your name. A new one starts a new account.</div>
      </div>
    </section>
    <section class="card" style="--accent:${cloudOn()?"var(--green)":"var(--dim)"}">
      <div class="chead"><h2 class="ctitle">${cloudOn()?"Server connected":"No server"}</h2></div>
      <div class="body">${cloudOn()
        ?`<div class="mini">Accounts, the board and the live feed all run off your Supabase project. Nothing to save by hand.</div>`
        :`<div class="mini">Without a server your account and records stay on this device.</div>
          <input type="text" id="sbUrl" placeholder="https://xxxx.supabase.co" style="width:100%;margin-top:9px">
          <input type="text" id="sbKey" placeholder="anon public key" style="width:100%;margin-top:7px">
          <button class="ghost wide" style="margin-top:9px" data-l="server">connect server</button>`}
      </div>
    </section>
  </div>`;
  document.getElementById("app").className="enter";
  const pin=document.getElementById("inPin"), nm=document.getElementById("inName");
  pin.addEventListener("keydown",ev=>{ if(ev.key==="Enter") doLogin(nm.value,pin.value); });
  /* Enter on the name skips the wait */
  nm.addEventListener("keydown",ev=>{ if(ev.key==="Enter"){ ev.preventDefault(); clearTimeout(LG.t); clearTimeout(LG.t2); startSearch(true); } });
  nm.addEventListener("input",()=>{
    clearTimeout(LG.t); clearTimeout(LG.t2);
    hideReveal();
    LG.t=setTimeout(startSearch,SETTLE_MS);
  });
  LG.mode=null;
  loadRoll();
  /* a name carried over from a failed attempt should not make you wait again */
  if(keepName) startSearch(true); else hideReveal();
}

/* ══════════════════ SIGN-IN REVEAL ══════════════════
   Nothing but the name field while you type. Stop, and a spinner shows the
   lookup running; then the PIN and a button that already knows whether it is
   a log-in or a sign-up fade in. Roughly 1.4s end to end. */
const SETTLE_MS=420, SEARCH_MS=520;

const hintEl=()=>document.getElementById("lhint");
function setHint(html){ const h=hintEl(); if(h){ h.style.display=""; h.innerHTML=html; } }

function hideReveal(){
  const r=document.getElementById("lreveal");
  if(r) r.classList.remove("on");
  LG.pending=false;
  setHint("Type your name. A new one starts a new account.");
  LG.mode=null;
}
/* stage one: the name has settled, show that we are looking it up */
function startSearch(now){
  const nm=document.getElementById("inName"), r=document.getElementById("lreveal");
  if(!nm||!r) return;
  if(slugify(nm.value).length<2){
    r.classList.remove("on");
    setHint("Names need at least two letters or numbers.");
    return;
  }
  setHint('<span class="spin"></span><span>Checking that name\u2026</span>');
  clearTimeout(LG.t2);
  LG.t2=setTimeout(openReveal, now?0:SEARCH_MS);
}
/* stage two: the answer is in (or the roll never arrives) */
function openReveal(){
  const r=document.getElementById("lreveal"), hint=hintEl();
  if(!r) return;
  if(cloudOn() && !LG.ids){ LG.pending=true; return; }   /* keep spinning */
  LG.pending=false;
  paintLoginState();
  /* clear it, or the spinner keeps turning inside a hidden element */
  if(hint){ hint.style.display="none"; hint.innerHTML=""; }
  r.classList.add("on");
}

/* ══════════════════ IS THAT NAME TAKEN? ══════════════════ */
const LG={ids:null,err:false,mode:null,t:null,t2:null,pending:false,loading:false};

async function loadRoll(){
  if(LG.ids||LG.loading) return;
  if(!cloudOn()){ LG.ids=new Set(); return; }
  LG.loading=true;
  try{
    const rows=await rpc("lm_board",{});
    LG.ids=new Set((rows||[]).map(r=>String(r.id)));
    LG.err=false;
  }catch(e){ LG.ids=new Set(); LG.err=true; }
  LG.loading=false;
  LG.mode=null;
  const r=document.getElementById("lreveal");
  if(LG.pending) openReveal();                       /* it was waiting on this */
  else if(r&&r.classList.contains("on")) paintLoginState();
}

/* [button, icon, headline, detail, accent] */
const LOGIN_COPY={
  empty:  ["START LIFTING","","","","var(--line)"],
  looking:["CHECKING…","clock","Checking that name","One moment.","var(--line)"],
  known:  ["LOG IN","users","NAME already has an account",
           "Welcome back. Enter the 4-digit PIN you set for it.","var(--cobalt)"],
  fresh:  ["CREATE ACCOUNT","spark","NAME is not taken yet",
           "This will be a brand new account. Choose a 4-digit PIN for it — you'll need it to sign in anywhere else.","var(--green)"],
  local:  ["START LIFTING","gear","No server connected",
           "This account stays on this device only.","var(--line)"],
  unknown:["START LIFTING","alert","Couldn't check that name",
           "The server didn't answer. Signing in will still work.","var(--red)"]
};

function paintLoginState(){
  const nm=document.getElementById("inName"), cta=document.getElementById("loginCta"),
        st=document.getElementById("lstate"), pin=document.getElementById("inPin");
  if(!nm||!cta||!st) return;
  const raw=String(nm.value||"").trim(), id=slugify(raw);
  let mode;
  if(id.length<2)      mode="empty";
  else if(!cloudOn())  mode="local";
  else if(!LG.ids)     mode="looking";
  else if(LG.err)      mode="unknown";
  else                 mode=LG.ids.has(id)?"known":"fresh";

  if(mode===LG.mode) return;          /* nothing changed, do not replay */
  LG.mode=mode;
  const c=LOGIN_COPY[mode], who=esc(raw.toUpperCase());
  cta.textContent=c[0];
  cta.className="cta"+(mode==="known"?" alt":"");
  st.style.setProperty("--accent",c[4]);
  st.innerHTML=(c[1]?ico(c[1]):"")
    +`<div><b>${c[2].replace("NAME",who)}</b><em>${c[3].replace("NAME",who)}</em></div>`;
  if(pin) pin.placeholder = mode==="known" ? "YOUR PIN" : mode==="fresh" ? "CHOOSE A NEW PIN" : "4-DIGIT PIN";
  /* restart both animations from the top */
  [cta,st].forEach(el=>{ el.classList.remove("swap"); void el.offsetWidth; el.classList.add("swap"); });
}

document.getElementById("app").addEventListener("click",e=>{
  const b=e.target.closest("[data-l]"); if(!b) return;
  if(b.dataset.l==="go") doLogin(document.getElementById("inName").value,document.getElementById("inPin").value);
  else if(b.dataset.l==="server") saveServer(document.getElementById("sbUrl").value,document.getElementById("sbKey").value,()=>renderLogin());
  else if(b.dataset.l==="theme"){ const n=document.getElementById("inName"); const keep=n?n.value:"";
    U.theme=b.dataset.v||"night"; applyTheme(); renderLogin("",false,keep); }
});

async function doLogin(name,pin){
  name=String(name||"").trim().slice(0,14);
  pin=String(pin||"").trim();
  const id=slugify(name);
  if(id.length<2) return renderLogin("Names need at least 2 letters or numbers.",false,name);
  if(!/^\d{4}$/.test(pin)) return renderLogin("The PIN is exactly 4 digits.",false,name);

  if(cloudOn()){
    renderLogin("",true,name);
    try{
      const rows=await rpc("lm_login",{p_id:id,p_name:name,p_pin:pin});
      const row=Array.isArray(rows)?rows[0]:rows;
      if(!row||!row.token) throw new Error("Server didn't return an account");
      MP.me={id:row.id||id,name:row.name||name,token:row.token};
      MP.status="live";
      if(LG.ids) LG.ids.add(MP.me.id);
    }catch(e){
      const m=String(e.message||e);
      return renderLogin(/bad pin/i.test(m)
        ? `${name.toUpperCase()} already has an account and that isn't its PIN. Try again, or pick a different name to start a new account.`
        : `Couldn't reach the server: ${m}`, false, name);
    }
  } else {
    MP.me={id,name,token:null};
  }
  await STORE.set(JSON.stringify(MP.me),"liftmania:me");
  await startSession();
}

/* ══════════════════ BOOT ══════════════════ */
async function startSession(){
  KEY="liftmania:save:"+MP.me.id;
  let raw=await STORE.get(KEY);
  if(!raw && !(await STORE.get("liftmania:claimed"))){
    for(const k of LEGACY){ const v=await STORE.get(k); if(v){ raw=v; break; } }
    if(raw) await STORE.set("1","liftmania:claimed");
  }
  let parsed=null;
  if(raw){ try{ parsed=JSON.parse(raw); }catch(e){} }
  if(parsed && (parsed.app==="liftmania"||parsed.app==="iron-run") && parsed.save) parsed=parsed.save;
  S=migrate(parsed);
  const away=applyDecay();
  if(away && (away.healed>0||away.revived.length)) S.away=away;
  rollDaily(); pickEx(U.ex); await persist();
  render();
  if(cloudOn()){ await cloudPull(); await refreshBoard(); rollDaily(); render(); }
  else MP.ready=true;
}

(async function(){
  try{ const savedTheme=localStorage.getItem("liftmania:theme"); if(savedTheme && THEMES.some(t=>t.id===savedTheme)) U.theme=savedTheme; }catch(e){}
  applyTheme();
  await STORE.init();
  let me=null;
  try{ me=JSON.parse(await STORE.get("liftmania:me")||"null"); }catch(e){}
  if(me && me.id && (!cloudOn() || me.token)){ MP.me=me; await startSession(); }
  else renderLogin();
})();
</script>
